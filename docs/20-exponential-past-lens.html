// Exact C¹ vertical mapping across NOW (y and dy/dstep match at Δt = 0 for all k >= 0):
// Future (dt >= 0): y = nowY + dt * pxPerStep | Past (age >= 0): y = nowY - (pxPerStep / k) * ln(1 + k * age)

// --- Music Theory Variable-Duration & Multi-Bar Resurrection Engine ---
function pickCell(len, barIdx, subIdx, isCadence) {
  if (len === 8) {
    const m = state.motion, t = state.tension, pool = [];
    const wLow = clamp(0.65 - m * 0.95 + (isCadence && t < 0.25 ? 0.35 : 0), 0.04, 1.5);

    for (const c of CELLS.low) pool.push([c, wLow]); for (const c of CELLS.mid) pool.push([c, wMid]); for (const c of CELLS.high) pool.push([c, wHigh]);
    let r = hash01(barIdx * 13 + subIdx, state.seed, 101) * pool.reduce((s, x) => s + x[1], 0);

  }

}

function choosePitch(step, dur, barIdx, prevPitch, prevInt, echo, lockNote) {
  const pos = ((step % 16) + 16) % 16, T = state.tension, M = state.memory;
  if (lockNote) return { noteIdx: lockNote.noteIdx, attn: { pastId: lockNote.id, weight: 1.0, locked: true } };
  if (echo && hash01(step, barIdx, 404) < clamp((M * 0.9 - 0.08) * (echo.source === 'user' ? 1.38 : 1) * echo.lagW, 0, 0.90))
    return { noteIdx: echo.noteIdx, attn: echo.id > 0 ? { pastId: echo.id, weight: clamp(M * echo.lagW, 0.2, 0.9), locked: false } : null };

function findPastAt(history, targetStep) {

function generateBar(barIdx, history, lockedNotes, prevPitchIn, prevIntIn) {
  const barStart = barIdx * 16, barNotes = [], M = state.memory, slots = [], anchorsByRel = new Map();

function recomputeFuture(flashChanges = true) {

    const rawL = Math.max(0.9, y1 - y0), f = edgeFade((y0 + y1) * 0.5), sVis = isFuture ? 1 : clamp(Math.pow(localTimeScale(age), 0.28), 0.42, 1.0);
    let symp = 0;
    if (!isFuture && age <= 288) for (const w of sympWaves) {
      if (w.idx !== n.noteIdx && w.srcPastId !== n.id) continue;
      const ms = nowPerf - w.bornPerf, p = ms / 820;
      const travel = p <= 1.25 ? Math.exp(-Math.pow((rawY0 - (geo.nowY - p * pastSpan)) / 48, 2)) * (1 - p * 0.45) : 0;
      symp = Math.max(symp, clamp((travel * 0.85 + Math.exp(-ms / 780) * (w.srcPastId === n.id ? 0.95 : 0.34)) * w.vel, 0, 1));
    }
    const heat = isFuture ? clamp(1 - (nowPerf - n.flashPerf) / FLASH_MS, 0, 1) : (n.locked ? 1 : 0);
    const crossing = !isFuture && rawY0 <= geo.nowY && rawY1 >= geo.nowY;
    const maxW = (3.3 + n.vel * 4.1) * (n.noteIdx === 0 ? 1.24 : 1) * (0.72 + 0.28 * clamp(dur / 6, 0, 1)) * sVis * (isHov ? 1.18 : 1);
    const segs = clamp(Math.round(rawL / 2.2), 5, 36), cycles = (0.95 + n.noteIdx * 0.26) * Math.max(0.75, dur * 0.45);
    const shimmer = isFuture ? 0.35 : Math.max(clamp(1 - age / (dur + 2.5), 0, 1), symp * 0.72);
    const phase = isFuture ? -tSec * 3.8 + n.step * 0.7 : (shimmer > 0.02 ? tSec * (11 + n.noteIdx * 1.6) * shimmer : 0) + n.step * 0.9;
    const trimEnd = Math.min(0.98, Math.max(0.55, (rawL - Math.min(1.6, rawL * 0.16)) / rawL));
    const sampleY = u => stepToY(n.step + u * dur * trimEnd, curStep) + dyMicro;

    ctx.beginPath();
    for (let k = 0; k <= segs; k++) { const u = k / segs, e = Math.min(1, u / 0.10) * Math.pow(1 - u, 1.38); k ? ctx.lineTo(x + e * maxW, sampleY(u)) : ctx.moveTo(x + e * maxW, y0); }
    for (let k = segs; k >= 0; k--) { const u = k / segs, e = Math.min(1, u / 0.10) * Math.pow(1 - u, 1.38); ctx.lineTo(x - e * maxW, sampleY(u)); }
    ctx.closePath();
    ctx.fillStyle = mixInk(heat, (!isFuture ? 0.13 + symp * 0.26 + (crossing ? 0.12 : 0) : 0.03 + heat * 0.11) * f); ctx.fill();
    ctx.strokeStyle = mixInk(heat, (!isFuture ? (0.32 + n.vel * 0.28 + symp * 0.42 + (crossing ? 0.16 : 0)) : (0.20 + n.vel * 0.20)) * f);
    ctx.lineWidth = !isFuture ? (crossing ? 1.15 : 0.75 + sVis * 0.2) : (heat > 0.05 ? 1.05 : 0.75); ctx.stroke();

    if (rawL > 2.2) {
      ctx.beginPath();
      for (let k = 0; k <= segs; k++) { const u = k / segs, e = Math.min(1, u / 0.08) * Math.pow(1 - u, 1.42), px = x + e * maxW * 0.86 * Math.sin(u * cycles * Math.PI * 2 + phase); k ? ctx.lineTo(px, sampleY(u)) : ctx.moveTo(px, y0); }
      ctx.strokeStyle = mixInk(heat, (!isFuture ? 0.62 + n.vel * 0.34 + symp * 0.32 : 0.30 + n.vel * 0.28) * f);
      ctx.lineWidth = !isFuture ? (crossing ? 1.55 : 0.85 + sVis * 0.35 + symp * 0.45) : (heat > 0.05 ? 1.25 : 0.9); ctx.stroke();
    }
    const rHead = ((n.noteIdx === 0 ? 3.1 : 2.25) + n.vel * 1.0) * sVis * (isHov ? 1.32 : 1);
    strokeLine(x - maxW * 0.92, y0, x + maxW * 0.92, y0, mixInk(heat, (!isFuture ? 0.62 + symp * 0.36 : 0.32) * f), 0.85);
    if (!isFuture) {
      if (symp > 0.06) strokeCirc(x, y0, rHead + 2.2 + symp * 5.2, mixInk(heat, symp * 0.56 * f), 0.85);
      fillCirc(x, y0, rHead, mixInk(heat, clamp(0.86 + symp * 0.2, 0, 1) * f));
      if (n.locked || isHov) strokeCirc(x, y0, rHead + (n.locked ? 4.8 : 5.5) * clamp(sVis + 0.25, 0.65, 1), n.locked ? '#ff5a1f' : 'rgba(255,255,255,0.72)', n.locked ? 1.3 : 0.95);
    } else {
      fillCirc(x, y0, rHead, '#000'); strokeCirc(x, y0, rHead, mixInk(heat, (0.48 + n.vel * 0.36) * f), heat > 0.05 ? 1.35 : 1.05);
      if (n.attn && n.attn.locked) fillCirc(x, y0, 1.8, `rgba(255,90,31,${(0.95 * f).toFixed(3)})`);
    }
    if (rawL > 4) { ctx.fillStyle = mixInk(heat, (!isFuture ? 0.42 : 0.24) * f); ctx.fillRect(x - 1, sampleY(1) - 0.5, 2, 1); }
  };
  for (const n of state.pastNotes) drawOne(n, n.step > curStep);
  for (const n of state.futureNotes) drawOne(n, true);
}

function drawMarqueeAndMicroFocus(curStep) {
  if (drag.mode === 'marquee') {
    const r = getMarqueeRect(curStep), w = Math.max(2, r.x1 - r.x0), h = Math.max(2, r.y1 - r.y0);
    ctx.fillStyle = 'rgba(255,90,31,0.085)'; ctx.fillRect(r.x0, r.y0, w, h);
    ctx.strokeStyle = 'rgba(255,90,31,0.88)'; ctx.lineWidth = 1; ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, w, h);
    const sel = state.pastNotes.filter(n => n.locked && n.step < curStep);
    const b0 = Math.max(0, (curStep - yToStep(r.y0, curStep)) / 16), b1 = Math.max(0, (curStep - yToStep(r.y1, curStep)) / 16);
    const txt = sel.length ? `${sel.length} RESURRECT · −${b0.toFixed(1)}b..−${b1.toFixed(1)}b` : `−${b0.toFixed(1)}b..−${b1.toFixed(1)}b`;
    ctx.font = '9.5px ui-monospace, monospace';
    const tw = ctx.measureText(txt).width + 12, bx = clamp(r.x1 + 8, geo.fieldL - 16, geo.fieldR + 20 - tw), by = Math.max(geo.padTop + 2, r.y0);
    ctx.fillStyle = 'rgba(0,0,0,0.88)'; ctx.fillRect(bx, by, tw, 17); ctx.strokeStyle = 'rgba(255,90,31,0.65)'; ctx.strokeRect(bx + 0.5, by + 0.5, tw, 17);
    ctx.fillStyle = '#ff5a1f'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(txt, bx + 6, by + 9); return;
  }
  if (hover.pastId > 0 && hover.focus > 0.05) {
    const n = state.pastNotes.find(p => p.id === hover.pastId); if (!n || n.step >= curStep) return;
    const x = geo.locusX[n.noteIdx], y = stepToY(n.step, curStep); if (y < geo.padTop - 2 || y >= geo.nowY) return;
    const a = hover.focus, col = n.locked ? `rgba(255,90,31,${(0.75 * a).toFixed(3)})` : `rgba(255,255,255,${(0.32 * a).toFixed(3)})`;
    strokeCirc(x, y, 14, col, 0.85); strokeLine(geo.fieldL - 22, y + 0.5, x - 18, y + 0.5, `rgba(255,255,255,${(0.11 * a).toFixed(3)})`);
    strokeLine(x - 18, y + 0.5, x - 14, y + 0.5, col); strokeLine(x + 14, y + 0.5, x + 18, y + 0.5, col);
    strokeLine(x + 0.5, y - 18, x + 0.5, y - 14, col); strokeLine(x + 0.5, y + 14, x + 0.5, y + 18, col);
    const label = `−${Math.max(0, (curStep - n.step) / 16).toFixed(1)}b · ${NOTES[n.noteIdx].name} · d=${n.dur}`;
    ctx.font = '9.5px ui-monospace, monospace';
    const tw = ctx.measureText(label).width + 14, bx = n.noteIdx >= 6 ? x - 20 - tw : x + 20, by = clamp(y - 9, geo.padTop + 2, geo.nowY - 22);
    ctx.fillStyle = `rgba(0,0,0,${(0.90 * a).toFixed(3)})`; ctx.fillRect(bx, by, tw, 18);
    ctx.strokeStyle = n.locked ? `rgba(255,90,31,${(0.8 * a).toFixed(3)})` : `rgba(255,255,255,${(0.36 * a).toFixed(3)})`; ctx.lineWidth = 0.9; ctx.strokeRect(bx + 0.5, by + 0.5, tw, 18);
    ctx.fillStyle = n.locked ? `rgba(255,90,31,${(0.98 * a).toFixed(3)})` : `rgba(255,255,255,${(0.92 * a).toFixed(3)})`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(label, bx + 7, by + 9.5);
  }
}

function drawNowInterferometer(dt, nowPerf) {
  const y = geo.nowY, xL = geo.fieldL - 22, xR = geo.fieldR + 22, span = xR - xL;
  for (const loc of loci) { loc.glow = Math.max(0, loc.glow * Math.exp(-dt * loc.damp)); loc.heat = Math.max(0, loc.heat - dt * 2.4); }
  for (let i = blooms.length - 1; i >= 0; i--) if (nowPerf - blooms[i].bornPerf >= blooms[i].lifeMs) blooms.splice(i, 1);
  for (const b of blooms) {
    const ageMs = nowPerf - b.bornPerf, p = clamp(ageMs / b.lifeMs, 0, 1), e = Math.pow(1 - p, 1.85), bx = geo.locusX[b.idx], h = b.hot ? clamp(1 - ageMs / FLASH_MS, 0, 1) : 0;
    const rx = 5 + Math.pow(p, 0.72) * (26 + b.dur * 11.5) * (0.68 + b.vel * 0.44) * (b.idx === 0 ? 1.24 : 1), ry = rx * (0.64 + 0.30 * Math.pow(p, 0.6));
    const rings = [[1, e * (0.84 + 0.16 * Math.sin(ageMs * 0.022 + b.idx)) * 0.68, 0.75 + e * 1.05, 1]];
    if (p > 0.035 && rx > 10) rings.push([0.60, e * 0.34, 0.7, 0.7]);
    if (b.dur >= 3 && p > 0.06 && rx > 16) rings.push([0.34, e * 0.20, 0.6, 0.5]);
    for (const [sc, alpha, lw, hm] of rings) { ctx.strokeStyle = mixInk(h * hm, alpha); ctx.lineWidth = lw; ctx.beginPath(); ctx.ellipse(bx, y, rx * sc, ry * sc, 0, 0, Math.PI * 2); ctx.stroke(); }
  }
  strokeLine(geo.lensX + 16, y + 0.5, xL, y + 0.5, 'rgba(255,255,255,0.10)');
  strokeLine(xR, y + 0.5, geo.rightX - geo.R - 14, y + 0.5, 'rgba(255,255,255,0.12)');
  let energy = 0; for (const b of blooms) energy += Math.pow(1 - (nowPerf - b.bornPerf) / b.lifeMs, 2);
  const traceWave = (kMul, wMul, ampMul, winExp, stroke, lw) => {
    ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.beginPath();
    for (let s = 0; s <= 140; s++) {
      const u = s / 140, px = xL + u * span, win = Math.pow(Math.sin(u * Math.PI), winExp); let dy = 0;
      for (const b of blooms) {
        const age = (nowPerf - b.bornPerf) * 0.001, e = Math.pow(1 - (nowPerf - b.bornPerf) / b.lifeMs, 1.8), dist = Math.abs(px - geo.locusX[b.idx]);
        dy += e * (4.5 + b.vel * 6.5) * ampMul * (b.idx === 0 ? 1.25 : 1) * Math.cos(dist * (0.075 + b.idx * 0.014) * kMul - age * (16 + b.idx * 2.2) * wMul) * Math.exp(-dist / (44 + b.dur * 11));
      }
      s ? ctx.lineTo(px, y + clamp(dy * win, -22, 22)) : ctx.moveTo(px, y + clamp(dy * win, -22, 22));
    }
    ctx.stroke();
  };
  if (!blooms.length) strokeLine(xL, y + 0.5, xR, y + 0.5, 'rgba(255,255,255,0.48)');
  else {
    if (energy > 0.15) traceWave(1.95, 1.75, 0.55, 1.0, `rgba(255,255,255,${clamp(energy * 0.16, 0.04, 0.24).toFixed(3)})`, 0.75);
    traceWave(1, 1, 1, 0.45, `rgba(255,255,255,${clamp(0.50 + energy * 0.35, 0.50, 0.96).toFixed(3)})`, 1.1);
  }
  for (let i = 0; i < 9; i++) {
    const x = geo.locusX[i], loc = loci[i], hov = hover.locusIdx === i;
    strokeLine(x + 0.5, y - 5, x + 0.5, y + 5, mixInk(loc.heat, 0.24 + loc.glow * 0.65 + (hov ? 0.3 : 0)));
    if (i === 0 || loc.glow > 0.08 || hov) strokeCirc(x, y, (i === 0 ? 6.5 : 5) + loc.glow * 3.5, mixInk(loc.heat, (i === 0 ? 0.28 : 0) + loc.glow * 0.72 + (hov ? 0.35 : 0)), 0.9);
    fillCirc(x, y, (i === 0 ? 2.6 : 2.0) + loc.glow * 2.1 + (hov ? 0.9 : 0), mixInk(loc.heat, 0.55 + loc.glow * 0.45));
  }
  ctx.font = '8.5px ui-monospace, monospace'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.textBaseline = 'bottom'; ctx.fillText('PAST · LOG', xR + 6, y - 7); ctx.textBaseline = 'top'; ctx.fillText('FUTURE · 1:1', xR + 6, y + 7);
}

function drawKnob(x, y, act, heat, hov) {
  fillCirc(x, y, act ? 7 : 6, act ? '#ff5a1f' : '#000');
  strokeCirc(x, y, act ? 7 : 6, mixInk(heat, hov || act ? 1 : 0.78), act ? 1.9 : 1.25);
  if (!act) fillCirc(x, y, 1.9, mixInk(heat, 0.92));
}

function drawControls(curStep, nowPerf) {
  ctx.font = '9px ui-monospace, monospace';
  const lbl = (txt, x, y, al, bl, h, a) => { ctx.textAlign = al; ctx.textBaseline = bl; ctx.fillStyle = mixInk(h, a); ctx.fillText(txt, x, y); };
  const lx = geo.lensX, lTop = geo.lensTop, lBot = geo.lensBot, ky = lensKnobY(), lAct = drag.mode === 'lens', lHeat = lAct ? 1 : clamp(1 - (nowPerf - state.lensHotPerf) / FLASH_MS, 0, 1);
  strokeLine(lx + 0.5, lTop, lx + 0.5, lBot, 'rgba(255,255,255,0.14)');
  for (let w = 1; w <= 4; w += 0.5) {
    const ty = Math.round(lensKnobY(w)) + 0.5, maj = Number.isInteger(w), tw = maj ? 7 : 3.5;
    strokeLine(lx - tw, ty, lx + tw, ty, Math.abs(ty - ky) < 9 ? mixInk(lHeat, 0.85) : `rgba(255,255,255,${maj ? 0.30 : 0.13})`);
    if (maj) lbl(`${w}×`, lx - 11, ty, 'right', 'middle', Math.abs(state.warp - w) < 0.2 ? lHeat : 0, Math.abs(state.warp - w) < 0.25 ? 0.72 : 0.28);
  }
  strokeLine(lx + 0.5, lBot, lx + 0.5, ky, mixInk(lHeat, lAct ? 0.95 : 0.62), lAct ? 1.8 : 1.25); drawKnob(lx, ky, lAct, lHeat, hover.target === 'lens');
  lbl('LENS', lx, lTop - 11, 'center', 'bottom', lHeat, 0.48); lbl(`${state.warp.toFixed(1)}×`, lx, lBot + 11, 'center', 'top', lHeat, 0.56); lbl(`−${Math.round(visiblePastSteps(curStep) / 16)}b`, lx, lBot + 24, 'center', 'top', lHeat * 0.7, 0.30);

  const rx = geo.rightX, ry = geo.nowY, R = geo.R, rk = radialKnobPos(), rAct = drag.mode === 'radial', rHeat = rAct ? 1 : clamp(1 - (nowPerf - state.radialHotPerf) / FLASH_MS, 0, 1);
  strokeCirc(rx, ry, R * 0.5, 'rgba(255,255,255,0.08)'); strokeCirc(rx, ry, R, rAct ? 'rgba(255,255,255,0.24)' : 'rgba(255,255,255,0.14)');
  strokeLine(rx - R - 5, ry + 0.5, rx + R + 5, ry + 0.5, 'rgba(255,255,255,0.10)'); strokeLine(rx + 0.5, ry - R - 5, rx + 0.5, ry + R + 5, 'rgba(255,255,255,0.10)');
  if (rAct) for (let d = 0, curAng = Math.atan2(rk.y - ry, rk.x - rx); d < 360; d += 15) {
    const a = d * Math.PI / 180, near = Math.abs(Math.atan2(Math.sin(a - curAng), Math.cos(a - curAng))) < 0.16 && Math.hypot(state.motion, state.tension) > 0.08;
    strokeLine(rx + Math.cos(a) * (R - 3), ry + Math.sin(a) * (R - 3), rx + Math.cos(a) * (R + 2), ry + Math.sin(a) * (R + 2), near ? '#ff5a1f' : 'rgba(255,255,255,0.18)', near ? 1.4 : 0.8);
  }
  strokeCirc(rx, ry, 3, 'rgba(255,255,255,0.30)');
  const dx = rk.x - rx, dy = rk.y - ry, dist = Math.hypot(dx, dy);
  if (dist > 3) {
    const ux = dx / dist, uy = dy / dist, nx = -uy, ny = ux, ticks = Math.floor((dist / R) * 6);
    strokeLine(rx, ry, rk.x, rk.y, mixInk(rHeat, rAct ? 0.95 : 0.68), rAct ? 1.5 : 1.1);
    for (let k = 1; k <= ticks; k++) { const r = (k / 6) * R; if (r > dist - 7) break; const tx = rx + ux * r, ty = ry + uy * r, hl = k === 3 || k === 6 ? 5 : 2.8; strokeLine(tx - nx * hl, ty - ny * hl, tx + nx * hl, ty + ny * hl, k === ticks && rHeat > 0.05 ? '#ff5a1f' : mixInk(rHeat * 0.6, 0.42)); }
  }
  drawKnob(rk.x, rk.y, rAct, rHeat, hover.target === 'radial');
  lbl('TENSION', rx, ry - R - 9, 'center', 'bottom', state.tension > 0.12 ? rHeat : 0, 0.34 + Math.max(0, state.tension) * 0.56);
  lbl('RELEASE', rx, ry + R + 9, 'center', 'top', state.tension < -0.12 ? rHeat : 0, 0.34 + Math.max(0, -state.tension) * 0.56);
  lbl('STILL', rx - R - 8, ry, 'right', 'middle', state.motion < -0.12 ? rHeat : 0, 0.34 + Math.max(0, -state.motion) * 0.56);
  lbl('MOTION', rx + R + 8, ry, 'left', 'middle', state.motion > 0.12 ? rHeat : 0, 0.34 + Math.max(0, state.motion) * 0.56);
  const sgn = v => (v >= 0 ? '+' : '') + v.toFixed(2);
  lbl(`T ${sgn(state.tension)}  M ${sgn(state.motion)}`, rx, ry + R + 23, 'center', 'top', rHeat * 0.7, 0.32);
}

// --- 60 FPS Animation Loop ---
let lastFrame = performance.now(); seedInitialPast(); recomputeFuture(false);
(function frame(nowPerf) {
  const dt = Math.min(0.05, (nowPerf - lastFrame) / 1000); lastFrame = nowPerf;
  state.warp += (state.targetWarp - state.warp) * Math.min(1, dt * 16);
  if (Math.abs(state.targetWarp - state.warp) < 0.001) state.warp = state.targetWarp;
  state.k = warpToK(state.warp);
  const curStep = getCurrentStep();
  for (let i = state.pastNotes.length - 1; i >= 0; i--) { const n = state.pastNotes[i]; if (!n.firedVisual && curStep >= n.step) { n.firedVisual = true; triggerResonator(n.noteIdx, n.vel, n.dur, Boolean(n.attn && n.attn.locked), n.attn ? n.attn.pastId : -1); } }
  const hovNote = hover.pastId > 0 ? state.pastNotes.find(p => p.id === hover.pastId) : null;
  if (hovNote && hovNote.step < curStep && !drag.mode) { hover.focusX = geo.locusX[hovNote.noteIdx]; hover.focusY = stepToY(hovNote.step, curStep); hover.focus = Math.min(1, hover.focus + dt * 10); }
  else hover.focus = Math.max(0, hover.focus - dt * 10);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawTimeHorizonField(curStep, nowPerf); drawAttentionArcs(curStep); drawWavePackets(curStep, nowPerf);
  drawNowInterferometer(dt, nowPerf); drawMarqueeAndMicroFocus(curStep); drawControls(curStep, nowPerf);
  requestAnimationFrame(frame);
})(lastFrame);
</script>
