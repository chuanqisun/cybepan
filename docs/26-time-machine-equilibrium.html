// 26 — Retrocausal Time Machine Equilibrium (Coupled P <-> F Fixed-Point Solver · D Kurd)
const NOTES = [
  ['D3','^1',146.83], ['A3','^5',220.00], ['Bb3','^b6',233.08], ['C4','^b7',261.63], ['D4','^1',293.66],
  ['E4','^2',329.63], ['F4','^b3',349.23], ['G4','^4',392.00], ['A4','^5',440.00],
].map(([name, deg, freq]) => ({ name, deg, freq }));

const BPM = 84, TATUM = 60 / BPM / 4, LOOKAHEAD = 0.11, FLASH_MS = 460;
const HALF_STEP_MS = 110, MAX_ITER = 5, EPS_NORM = 0.0035, QUANT_DURS = [1, 2, 3, 4, 6, 8];
const METRIC_W = [1.0,.14,.46,.20,.76,.14,.50,.24,.88,.14,.48,.20,.72,.16,.52,.26];
const CELLS = [[4,2,2], [3,3,2], [2,2,4], [4,-2,2], [6,2], [3,2,3], [2,4,2], [4,4], [6,-2]];
const FIELDS = {
  I:    { w: [1.00,.78,.18,.24,.95,.26,.78,.22,.64], tones: [0,1,4,6,8] },
  bVI:  { w: [ .42,.30,1.00,.28,.82,.30,.92,.28,.62], tones: [2,4,6,0,8] },
  bVII: { w: [ .22,.42,.26,1.00,.34,.88,.32,.94,.84], tones: [3,5,7,1,8] },

const CONSONANT = [[0,4,1,6,8],[1,8,4,0,5,6],[2,6,4,0,8],[3,7,5,1,8],[4,0,1,6,8,3,5],[5,1,3,7,8,4,6],[6,2,4,0,8,5,7],[7,3,5,4,6,8],[8,1,4,6,5,7]];

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const hash01 = (a, b, c = 0) => {
  let x = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2147483647)) | 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177); return ((x ^ (x >>> 16)) >>> 0) / 4294967296;

const quantizeDur = (raw, maxD = 8) => { let b = 1, bd = 1e9; for (const d of QUANT_DURS) if (d <= maxD && Math.abs(d - raw) <= bd) { b = d; bd = Math.abs(d - raw); } return b; };

// --- Synthetic D Kurd Handpan Voice + Delicate Dry Micro-Clicks ---

    const master = actx.createGain(); master.gain.value = 0.86; master.connect(comp);
    dryBus = actx.createGain(); dryBus.connect(master);
    const irLen = Math.floor(actx.sampleRate * 1.8), ir = actx.createBuffer(2, irLen, actx.sampleRate);

function playVoice(noteIdx, when, vel = 0.8, durSteps = 4) {

  const out = actx.createGain(), pan = actx.createStereoPanner(), fg = actx.createGain();
  out.gain.setValueAtTime(1, t0); pan.pan.setValueAtTime((noteIdx - 4) * 0.12, t0);
  out.connect(pan); pan.connect(dryBus); pan.connect(revSend);

  for (const [df, w] of [[0, 0.72], [0.7, 0.28]]) {

    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(f0 * ratio, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(lvl * v * bloom, t0 + del); g.gain.exponentialRampToValueAtTime(0.0001, t0 + tau * mul);
    o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + tau * mul + 0.05);
  }
  const ns = actx.createBufferSource(), bp = actx.createBiquadFilter(), ng = actx.createGain();

}

function playClick(panVal = 0, freq = 2400, gain = 0.08) {

// --- Musical State, Resonators & Quantized D Kurd Bar Generator ---
const state = {
  coupling: 0.65, playing: false, playheadStep: 32, anchorStep: 32, anchorAudioTime: 0,
  nextSchedStep: 32, nextId: 1, seed: 26, lastUserPitch: 4, activeField: 'I',
  pastNotes: [], futureNotes: [], activeHolds: new Map(),
  ghosts: [], arcs: [], persistentArcs: [], waveSweep: null,
  eq: { status: 'LOCKED', iter: 0, delta: 0, dir: '', timer: null, model: null },
};
const loci = NOTES.map(() => ({ glow: 0, heat: 0, damp: 1.8 })), blooms = [];
const getCurrentStep = () => (!state.playing || !actx) ? state.playheadStep : state.anchorStep + Math.max(0, (actx.currentTime - state.anchorAudioTime) / TATUM);

function triggerResonator(idx, vel, durSteps, hot = false) {
  const loc = loci[idx];
  loc.glow = clamp(Math.max(loc.glow * 0.4, 0.45 + vel * 0.55), 0, 1);
  loc.damp = clamp(3.6 / (0.65 + durSteps * 0.48), 0.65, 3.6);
  if (hot) loc.heat = 1.0;
  blooms.push({ idx, vel, dur: durSteps, bornPerf: performance.now(), lifeMs: clamp(360 + durSteps * 300, 420, 2750) * (idx === 0 ? 1.16 : 1), hot });
  if (blooms.length > 24) blooms.shift();
}

function generateBar(barIdx, prevPitchIn, fieldKey = 'I', isPastSeed = false) {
  const barStart = barIdx * 16, fW = FIELDS[fieldKey].w, out = [];
  let prev = prevPitchIn;
  for (let half = 0; half < 2; half++) {
    const cell = CELLS[Math.floor(hash01(barIdx * 11 + half, state.seed, 101) * CELLS.length)];
    for (let pos = half * 8, ci = 0; ci < cell.length; pos += Math.abs(cell[ci++])) {
      const v = cell[ci]; if (v <= 0) continue;
      const step = barStart + pos, ws = new Float32Array(9); let sum = 0;
      for (let i = 0; i < 9; i++) {
        let w = fW[i] * (0.65 + 0.55 * (1 - Math.abs(i / 8 - 0.48)));
        if (pos === 0 && (i === 0 || i === 4)) w *= 1.8;
        if (prev >= 0) { const ad = Math.abs(i - prev); w *= ad === 0 ? 0.34 : ad <= 2 ? 1.78 : ad <= 4 ? 0.90 : 0.36; }
        ws[i] = Math.max(0.01, w); sum += ws[i];
      }
      let r = hash01(step * 17 + v, barIdx * 13 + prev + 3, 202) * sum, noteIdx = 4;
      for (let i = 0; i < 9; i++) { r -= ws[i]; if (r <= 0) { noteIdx = i; break; } }
      const vel = clamp(0.48 + METRIC_W[pos] * 0.34 + (v >= 4 ? 0.1 : 0), 0.32, 0.95);
      out.push({ id: state.nextId++, step, dur: v, noteIdx, vel, source: 'gen', pinned: false, firedVisual: isPastSeed, holding: false, flashPerf: -9999, visPitch: noteIdx, visDur: v });
      prev = noteIdx;
    }
  }
  return { notes: out, prevPitch: prev };
}

function seedInitialTimeline() {
  state.pastNotes = []; state.futureNotes = [];
  for (let b = 0, prev = 0; b < 4; b++) {
    const res = generateBar(b, prev, b === 1 ? 'bVI' : b === 3 ? 'bVII' : 'I', b < 2);
    prev = res.prevPitch; (b < 2 ? state.pastNotes : state.futureNotes).push(...res.notes);
  }
}

// --- Coupled P <-> F Strictly-Convex Fixed-Point Equilibrium Solver ---
function inferHarmonicField(pinnedF, originPitch) {
  if (!pinnedF.length && originPitch == null) return 'I';
  let bestKey = 'I', bestScore = -1;
  for (const key of ['I', 'bVI', 'bVII']) {
    let sc = key === 'I' ? 0.15 : 0;
    for (const f of pinnedF) sc += FIELDS[key].w[Math.round(f.y0)] * (f.isOrigin ? 1.5 : 1);
    if (!pinnedF.length && originPitch != null) sc += FIELDS[key].w[clamp(Math.round(originPitch), 0, 8)];
    if (sc > bestScore) { bestScore = sc; bestKey = key; }
  }
  return bestKey;
}

function buildCoupledModel(pastList, futureList, curStep, coupling, opts = {}) {
  const lam = clamp(coupling, 0.2, 0.9);
  const pS = pastList.filter(n => n.step >= curStep - 32.5 && n.step < curStep - 0.05).sort((a, b) => a.step - b.step);
  const fS = futureList.filter(n => n.step >= curStep - 0.05 && n.step < curStep + 32.5).sort((a, b) => a.step - b.step);
  const P = pS.map((n, i) => ({ note: n, step: n.step, x0: n.noteIdx, u0: n.dur, x: n.noteIdx, u: n.dur, maxDur: Math.max(1, clamp(Math.floor((i + 1 < pS.length ? pS[i + 1].step : curStep) - n.step), 1, 8)), isUser: n.source === 'user', hPitch: n.noteIdx, hDur: n.dur }));
  const F = fS.map((n, j) => ({ note: n, step: n.step, y0: n.noteIdx, v0: n.dur, y: n.noteIdx, v: n.dur, maxDur: Math.max(1, clamp(Math.floor((j + 1 < fS.length ? fS[j + 1].step : curStep + 32) - n.step), 1, 8)), pinned: Boolean(n.pinned), isOrigin: opts.originId === n.id, hPitch: n.noteIdx, hDur: n.dur }));

  const pinnedF = F.filter(f => f.pinned), fieldKey = inferHarmonicField(pinnedF, opts.originPitch), tones = FIELDS[fieldKey].tones;
  const meanDur = pinnedF.length ? pinnedF.reduce((s, f) => s + f.v0, 0) / pinnedF.length : 3;
  const meanPitch = pinnedF.length ? pinnedF.reduce((s, f) => s + f.y0, 0) / pinnedF.length : 4;
  for (const p of P) { p.hPitch = nearestTone(pinnedF.length ? lerp(p.x0, meanPitch, 0.28) : p.x0, tones); p.hDur = clamp(pinnedF.length ? lerp(p.u0, meanDur, 0.55) : p.u0, 1, p.maxDur); }
  for (const f of F) if (!f.pinned) { f.hPitch = nearestTone(pinnedF.length ? lerp(f.y0, meanPitch, 0.24) : f.y0, tones); f.hDur = clamp(pinnedF.length ? lerp(f.v0, meanDur, 0.50) : f.v0, 1, f.maxDur); }

  const edges = [], seen = new Set();
  const addEdge = (i, j, kind, wPitch, wDur, delta) => { const k = `${i}:${j}`; if (!seen.has(k)) { seen.add(k); edges.push({ i, j, kind, wPitch, wDur, delta }); } };

    const fj = F[j], pinMul = fj.pinned ? (fj.isOrigin ? 2.4 : 1.85) : 1, cons = CONSONANT[clamp(Math.round(fj.y0), 0, 8)], posF = ((Math.round(fj.step) % 16) + 16) % 16;
    let cnt = 0;
    for (let i = 0; i < P.length; i++) {
      const pi = P[i], dt = fj.step - pi.step; if (dt <= 0) continue;
      const mod16 = ((Math.round(dt) % 16) + 16) % 16, mDist = Math.min(mod16, 16 - mod16);
      if (mDist === 0) {
        let bestT = cons[0], bestC = 1e9;

}

function computeEnergy(m) {
  const { P, F, edges, melP, melF, lam, wPriorP, wPriorF, wHarmP, wHarmF, alphaD } = m;
  let E = 0;
  for (const p of P) { const wp = wPriorP * (p.isUser ? 1.45 : 1); E += 0.5 * (wp * (p.x - p.x0) ** 2 + wHarmP * (p.x - p.hPitch) ** 2 + alphaD * (wp * (p.u - p.u0) ** 2 + wHarmP * 0.6 * (p.u - p.hDur) ** 2)); }
  for (const f of F) if (!f.pinned) E += 0.5 * (wPriorF * (f.y - f.y0) ** 2 + wHarmF * (f.y - f.hPitch) ** 2 + alphaD * (wPriorF * (f.v - f.v0) ** 2 + wHarmF * 0.6 * (f.v - f.hDur) ** 2));
  for (const e of edges) E += 0.5 * lam * (e.wPitch * (P[e.i].x - F[e.j].y - e.delta) ** 2 + alphaD * e.wDur * (P[e.i].u - F[e.j].v) ** 2);
  for (const s of melP) E += 0.5 * s.w * (P[s.b].x - P[s.a].x - s.s) ** 2;
  for (const s of melF) E += 0.5 * s.w * (F[s.b].y - F[s.a].y - s.s) ** 2;

function solveBlock(m, dir) {
  const isP = dir === 'F2P', list = isP ? m.P : m.F, other = isP ? m.F : m.P, n = list.length;
  const oP = Float64Array.from(list, z => isP ? z.x : z.y), oD = Float64Array.from(list, z => isP ? z.u : z.v);
  const byIdx = Array.from({ length: n }, () => []), adj = Array.from({ length: n }, () => []), wHarm = isP ? m.wHarmP : m.wHarmF;
  for (const e of m.edges) byIdx[isP ? e.i : e.j].push(e);
  for (const s of (isP ? m.melP : m.melF)) { adj[s.a].push([s.b, s.w, -s.s]); adj[s.b].push([s.a, s.w, s.s]); }
  for (let sweep = 0; sweep < 14; sweep++) {
    for (let idx = 0; idx < n; idx++) {
      const z = list[idx]; if (!isP && z.pinned) { oP[idx] = z.y0; oD[idx] = z.v0; continue; }

const eqReadout = document.getElementById('eqReadout'), resetBtn = document.getElementById('resetBtn');

}

function spawnGhost(note, oldPitch, oldDur, isFuture) {

  for (const targetBar = Math.floor((curStep + 34) / 16); nextBar <= targetBar; nextBar++) {

function schedulerTick() {

  state.futureNotes.sort((a, b) => a.step - b.step);

const edgeFade = y => Math.min(clamp((y - geo.padTop) / 34, 0, 1), clamp((H - geo.padBot - y) / 34, 0, 1));

    const p = (nowPerf - state.waveSweep.bornPerf) / 260;
    if (p < 1) {
      const isF2P = state.waveSweep.dir === 'F2P', a = (1 - p) * (0.14 + state.waveSweep.damp * 0.24), y = isF2P ? lerp(geo.nowY, geo.padTop + 12, p) : lerp(geo.nowY, H - geo.padBot - 12, p);
      strokeLine(xL, y, xR, y, isF2P ? `rgba(255,90,31,${a.toFixed(3)})` : `rgba(255,255,255,${(a * 0.8).toFixed(3)})`, 1.1);
    } else state.waveSweep = null;
  }
  ctx.textAlign = 'center';
  for (let i = 0; i < 9; i++) {
    const x = geo.locusX[i], loc = loci[i], hov = hover.locusIdx === i || hover.emptyPitch === i;
    ctx.font = '10px ui-monospace, monospace'; ctx.textBaseline = 'bottom'; ctx.fillStyle = mixInk(loc.heat, 0.28 + loc.glow * 0.72 + (hov ? 0.28 : 0)); ctx.fillText(NOTES[i].name, x, geo.padTop - 8);
    ctx.font = '9px ui-monospace, monospace'; ctx.textBaseline = 'top'; ctx.fillStyle = `rgba(255,255,255,${clamp(0.20 + loc.glow * 0.45, 0, 0.85).toFixed(3)})`; ctx.fillText(NOTES[i].deg, x, H - geo.padBot + 8);
  }
}

function drawEquilibriumArcs(curStep, nowPerf) {
  const drawCurve = (pNote, fNote, isF2P, alpha, lw, dashed, pulseT) => {
    const yP = geo.nowY + (pNote.step - curStep) * geo.pxPerStep, yF = geo.nowY + (fNote.step - curStep) * geo.pxPerStep;
    if (yP < geo.padTop - 10 || yF > H - geo.padBot + 10) return;
    const xP = noteX(pNote), xF = noteX(fNote), x0 = isF2P ? xF : xP, y0 = isF2P ? yF : yP, x1 = isF2P ? xP : xF, y1 = isF2P ? yP : yF;
    const bow = ((pNote.noteIdx + fNote.noteIdx) < 8 ? -1 : 1) * clamp(20 + (fNote.step - pNote.step) * 1.15, 22, 74) * (isF2P ? 1 : -0.78);
    const c1x = x0 + bow, c1y = lerp(y0, y1, 0.30), c2x = x1 + bow, c2y = lerp(y0, y1, 0.70), f = Math.min(edgeFade(yP), edgeFade(yF));
    ctx.save(); if (dashed) ctx.setLineDash([4, 4]);
    ctx.strokeStyle = isF2P ? `rgba(255,90,31,${(alpha * f).toFixed(3)})` : `rgba(255,255,255,${(alpha * f).toFixed(3)})`;
    ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.bezierCurveTo(c1x, c1y, c2x, c2y, x1, y1); ctx.stroke(); ctx.restore();
    if (pulseT >= 0 && pulseT <= 1) {
      const [px, py] = cubicPt(x0, y0, c1x, c1y, c2x, c2y, x1, y1, pulseT), [qx, qy] = cubicPt(x0, y0, c1x, c1y, c2x, c2y, x1, y1, Math.max(0, pulseT - 0.04));
      const ang = Math.atan2(py - qy, px - qx), sz = 4.6, col = isF2P ? `rgba(255,90,31,${(clamp(alpha * 1.4, 0, 1) * f).toFixed(3)})` : `rgba(255,255,255,${(clamp(alpha * 1.35, 0, 1) * f).toFixed(3)})`;
      ctx.strokeStyle = col; ctx.lineWidth = 1.35; ctx.beginPath();
      ctx.moveTo(px - Math.cos(ang - 0.55) * sz, py - Math.sin(ang - 0.55) * sz); ctx.lineTo(px, py); ctx.lineTo(px - Math.cos(ang + 0.55) * sz, py - Math.sin(ang + 0.55) * sz);
      ctx.stroke(); fillCirc(px, py, 2.0, col);
    }
  };
  for (const pa of state.persistentArcs) drawCurve(pa.pNote, pa.fNote, pa.pinned, pa.pinned ? 0.17 : 0.065, pa.pinned ? 0.9 : 0.7, pa.pinned, -1);
  for (let i = state.arcs.length - 1; i >= 0; i--) {
    const a = state.arcs[i], age = nowPerf - a.bornPerf; if (age >= a.lifeMs) { state.arcs.splice(i, 1); continue; }
    const fade = Math.pow(1 - age / a.lifeMs, 1.45), pulseT = clamp(age / (HALF_STEP_MS * 1.35), 0, 1);
    drawCurve(a.pNote, a.fNote, a.dir === 'F2P', clamp(fade * (0.24 + a.damp * 0.62) * (a.pinned ? 1.15 : 0.88), 0, 0.92), a.pinned ? 1.35 : 0.95, a.dir === 'F2P', age < HALF_STEP_MS * 1.55 ? pulseT : -1);
  }
}

function drawGhosts(curStep, nowPerf) {
  for (let i = state.ghosts.length - 1; i >= 0; i--) {
    const g = state.ghosts[i], age = nowPerf - g.bornPerf; if (age >= g.lifeMs) { state.ghosts.splice(i, 1); continue; }
    const y0 = geo.nowY + (g.step - curStep) * geo.pxPerStep, L = Math.max(7, g.dur * geo.pxPerStep - 2); if (y0 + L < geo.padTop || y0 > H - geo.padBot) continue;
    const x = geo.locusX[g.pitch], xTo = geo.locusX[g.toPitch], fade = Math.pow(1 - age / g.lifeMs, 1.6) * edgeFade(y0);
    ctx.save(); ctx.setLineDash([2, 3]);
    strokeLine(x, y0, x, y0 + L, `rgba(255,255,255,${(0.32 * fade).toFixed(3)})`, 0.9);
    if (x !== xTo) strokeLine(x, y0, xTo, y0, `rgba(255,90,31,${(0.38 * fade).toFixed(3)})`, 0.8);
    ctx.restore(); strokeCirc(x, y0, 3.0, `rgba(255,255,255,${(0.40 * fade).toFixed(3)})`, 0.85);
  }
}

function drawWavePackets(curStep, nowPerf, dt) {
  const tSec = nowPerf * 0.001, ease = 1 - Math.exp(-dt * 24);
  const drawOne = (n, isFuture) => {
    n.visPitch = (n.visPitch ?? n.noteIdx) + (n.noteIdx - (n.visPitch ?? n.noteIdx)) * ease;
    n.visDur = (n.visDur ?? n.dur) + (n.dur - (n.visDur ?? n.dur)) * ease;
    const dur = n.holding ? Math.max(0.6, curStep - n.step) : n.visDur, y0 = geo.nowY + (n.step - curStep) * geo.pxPerStep, y1 = geo.nowY + (n.step + dur - curStep) * geo.pxPerStep;
    if (y1 < geo.padTop || y0 > H - geo.padBot) return;
    const x = noteX(n), L = Math.max(7, (y1 - y0) - 2), f = edgeFade((y0 + y1) * 0.5), flash = clamp(1 - (nowPerf - n.flashPerf) / FLASH_MS, 0, 1), heat = (isFuture && n.pinned) ? 1 : flash;
    const crossing = !isFuture && y0 <= geo.nowY && y1 >= geo.nowY, hov = isFuture && (hover.noteId === n.id || drag.note === n);
    const maxW = (3.4 + n.vel * 4.2) * (n.noteIdx === 0 ? 1.24 : 1) * (0.72 + 0.28 * clamp(dur / 6, 0, 1)), segs = clamp(Math.round(L / 2.2), 10, 38);
    const cycles = (0.95 + n.noteIdx * 0.26) * Math.max(0.75, dur * 0.45), shimmer = isFuture ? 0.35 : clamp(1 - Math.max(0, curStep - n.step) / (dur + 2.5), 0, 1);
    const phase = isFuture ? -tSec * 3.8 + n.step * 0.7 : (shimmer > 0.02 ? tSec * (11 + n.noteIdx * 1.6) * shimmer : 0) + n.step * 0.9;

    ctx.beginPath();
    for (let k = 0; k <= segs; k++) { const u = k / segs, e = Math.min(1, u / 0.10) * Math.pow(1 - u, 1.38); k ? ctx.lineTo(x + e * maxW, y0 + u * L) : ctx.moveTo(x + e * maxW, y0); }
    for (let k = segs; k >= 0; k--) { const u = k / segs, e = Math.min(1, u / 0.10) * Math.pow(1 - u, 1.38); ctx.lineTo(x - e * maxW, y0 + u * L); }
    ctx.closePath();
    ctx.fillStyle = mixInk(heat, (!isFuture ? 0.14 + (crossing ? 0.12 : 0) : (n.pinned ? 0.14 : 0.035 + flash * 0.1)) * f); ctx.fill();
    ctx.strokeStyle = mixInk(heat, (!isFuture ? (0.34 + n.vel * 0.28 + (crossing ? 0.16 : 0)) : (0.24 + n.vel * 0.22 + (hov ? 0.28 : 0))) * f);
    ctx.lineWidth = !isFuture ? (crossing ? 1.15 : 0.85) : (n.pinned || hov ? 1.15 : 0.8); ctx.stroke();

    ctx.beginPath();
    for (let k = 0; k <= segs; k++) { const u = k / segs, e = Math.min(1, u / 0.08) * Math.pow(1 - u, 1.42), px = x + e * maxW * 0.86 * Math.sin(u * cycles * Math.PI * 2 + phase); k ? ctx.lineTo(px, y0 + u * L) : ctx.moveTo(px, y0); }
    ctx.strokeStyle = mixInk(heat, (!isFuture ? 0.68 + n.vel * 0.32 : (n.pinned ? 0.88 : 0.32 + n.vel * 0.28)) * f);
    ctx.lineWidth = !isFuture ? (crossing ? 1.55 : 1.2) : (n.pinned ? 1.35 : 0.95); ctx.stroke();

    const rHead = (n.noteIdx === 0 ? 3.2 : 2.4) + n.vel * 1.1;
    strokeLine(x - maxW * 0.95, y0, x + maxW * 0.95, y0, mixInk(heat, (!isFuture ? 0.65 : 0.36) * f), 0.9);
    if (!isFuture) fillCirc(x, y0, rHead, mixInk(heat, 0.95 * f));
    else if (n.pinned) { fillCirc(x, y0, rHead, `rgba(255,90,31,${(0.98 * f).toFixed(3)})`); strokeCirc(x, y0, rHead + 5.2, `rgba(255,90,31,${((hov ? 0.95 : 0.72) * f).toFixed(3)})`, hov ? 1.45 : 1.15); }
    else { fillCirc(x, y0, rHead, '#000'); strokeCirc(x, y0, rHead, mixInk(heat, (0.52 + n.vel * 0.34 + (hov ? 0.2 : 0)) * f), hov ? 1.4 : 1.05); if (hov) strokeCirc(x, y0, rHead + 5.0, `rgba(255,255,255,${(0.45 * f).toFixed(3)})`, 0.9); }
    const tailAct = isFuture && ((hover.mode === 'tail' && hover.noteId === n.id) || (drag.note === n && (drag.mode === 'dur' || drag.mode === 'plant')));
    const tw = tailAct ? 7 : (isFuture && (hov || n.pinned) ? 4.5 : 1.2);
    strokeLine(x - tw, y0 + L, x + tw, y0 + L, mixInk(tailAct ? 1 : heat, (tailAct ? 0.98 : isFuture && n.pinned ? 0.72 : 0.34) * f), tailAct ? 1.6 : 1);
    if (tailAct) { ctx.font = '9px ui-monospace, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ff5a1f'; ctx.fillText(`d=${n.dur}`, x + 11, y0 + L); }
  };
  for (const n of state.pastNotes) drawOne(n, n.step > curStep);
  for (const n of state.futureNotes) drawOne(n, true);
  if (hover.mode === 'empty' && !drag.mode && hover.emptyPitch >= 0) {
    const x = geo.locusX[hover.emptyPitch], y = geo.nowY + (hover.emptyStep - curStep) * geo.pxPerStep, f = edgeFade(y);
    if (y > geo.nowY + 8 && y < H - geo.padBot) { strokeCirc(x, y, 4.2, `rgba(255,90,31,${(0.42 * f).toFixed(3)})`, 1); strokeLine(x - 7, y, x + 7, y, `rgba(255,90,31,${(0.24 * f).toFixed(3)})`, 0.8); }
  }
}

function drawNowInterferometer(dt, nowPerf) {
  const y = geo.nowY, xL = geo.fieldL - 24, xR = geo.fieldR + 24, span = xR - xL;
  for (const loc of loci) { loc.glow = Math.max(0, loc.glow * Math.exp(-dt * loc.damp)); loc.heat = Math.max(0, loc.heat - dt * 2.4); }
  for (let i = blooms.length - 1; i >= 0; i--) if (nowPerf - blooms[i].bornPerf >= blooms[i].lifeMs) blooms.splice(i, 1);
  for (const b of blooms) {
    const ageMs = nowPerf - b.bornPerf, p = clamp(ageMs / b.lifeMs, 0, 1), e = Math.pow(1 - p, 1.85), bx = geo.locusX[b.idx], h = b.hot ? clamp(1 - ageMs / FLASH_MS, 0, 1) : 0;
    const rx = 5 + Math.pow(p, 0.72) * (26 + b.dur * 11.5) * (0.68 + b.vel * 0.44) * (b.idx === 0 ? 1.24 : 1), ry = rx * (0.64 + 0.30 * Math.pow(p, 0.6));
    const rings = [[1, e * (0.84 + 0.16 * Math.sin(ageMs * 0.022 + b.idx)) * 0.68, 0.75 + e * 1.05, 1]];
    if (p > 0.035 && rx > 10) rings.push([0.60, e * 0.34, 0.7, 0.7]);
    if (b.dur >= 3 && p > 0.06 && rx > 16) rings.push([0.34, e * 0.20, 0.6, 0.5]);
    for (const [sc, alpha, lw, hm] of rings) { ctx.strokeStyle = mixInk(h * hm, alpha); ctx.lineWidth = lw; ctx.beginPath(); ctx.ellipse(bx, y, rx * sc, ry * sc, 0, 0, Math.PI * 2); ctx.stroke(); }
  }
  let energy = 0; for (const b of blooms) energy += Math.pow(1 - (nowPerf - b.bornPerf) / b.lifeMs, 2);
  const traceWave = (kMul, wMul, ampMul, winExp, stroke, lw) => {
    ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.beginPath();
    for (let s = 0; s <= 140; s++) {
      const u = s / 140, px = xL + u * span, win = Math.pow(Math.sin(u * Math.PI), winExp); let dy = 0;
      for (const b of blooms) { const age = (nowPerf - b.bornPerf) * 0.001, e = Math.pow(1 - (nowPerf - b.bornPerf) / b.lifeMs, 1.8), dist = Math.abs(px - geo.locusX[b.idx]); dy += e * (4.5 + b.vel * 6.5) * ampMul * (b.idx === 0 ? 1.25 : 1) * Math.cos(dist * (0.075 + b.idx * 0.014) * kMul - age * (16 + b.idx * 2.2) * wMul) * Math.exp(-dist / (44 + b.dur * 11)); }
      s ? ctx.lineTo(px, y + clamp(dy * win, -22, 22)) : ctx.moveTo(px, y + clamp(dy * win, -22, 22));
    }
    ctx.stroke();
  };
  if (!blooms.length) strokeLine(xL, y + 0.5, xR, y + 0.5, 'rgba(255,255,255,0.48)');
  else {
    if (energy > 0.15) traceWave(1.95, 1.75, 0.55, 1.0, `rgba(255,255,255,${clamp(energy * 0.16, 0.04, 0.24).toFixed(3)})`, 0.75);
    traceWave(1, 1, 1, 0.45, `rgba(255,255,255,${clamp(0.50 + energy * 0.35, 0.50, 0.96).toFixed(3)})`, 1.1);
  }
  for (let i = 0; i < 9; i++) {
    const x = geo.locusX[i], loc = loci[i], hov = hover.mode === 'now' && hover.locusIdx === i;
    strokeLine(x + 0.5, y - 5, x + 0.5, y + 5, mixInk(loc.heat, 0.24 + loc.glow * 0.65 + (hov ? 0.3 : 0)));
    if (i === 0 || loc.glow > 0.08 || hov) strokeCirc(x, y, (i === 0 ? 6.5 : 5) + loc.glow * 3.5, mixInk(loc.heat, (i === 0 ? 0.28 : 0) + loc.glow * 0.72 + (hov ? 0.35 : 0)), 0.9);
    fillCirc(x, y, (i === 0 ? 2.6 : 2.0) + loc.glow * 2.1 + (hov ? 0.9 : 0), mixInk(loc.heat, 0.55 + loc.glow * 0.45));
  }
  const hotF2P = state.eq.status === 'CONVERGING' && state.eq.dir === 'F2P', hotP2F = state.eq.status === 'CONVERGING' && state.eq.dir === 'P2F';
  ctx.font = '8.5px ui-monospace, monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = hotF2P ? '#ff5a1f' : 'rgba(255,255,255,0.26)'; ctx.textBaseline = 'bottom'; ctx.fillText(hotF2P ? 'PAST ↑' : 'PAST', xR + 8, y - 7);
  ctx.fillStyle = hotP2F ? '#fff' : 'rgba(255,255,255,0.26)'; ctx.textBaseline = 'top'; ctx.fillText(hotP2F ? 'FUTURE ↓' : 'FUTURE', xR + 8, y + 7);
}

// --- 60 FPS Animation Loop ---
seedInitialTimeline();
refreshPersistentArcs(buildCoupledModel(state.pastNotes, state.futureNotes, state.playheadStep, state.coupling));
updateHeaderUI();

let lastFrame = performance.now();
(function frame(nowPerf) {
  const dt = Math.min(0.05, (nowPerf - lastFrame) / 1000); lastFrame = nowPerf;
  const curStep = getCurrentStep();
  for (let i = state.pastNotes.length - 1; i >= 0; i--) {
    const n = state.pastNotes[i];
    if (!n.firedVisual && curStep >= n.step) { n.firedVisual = true; triggerResonator(n.noteIdx, n.vel, n.dur, Boolean(n.wasPinned)); }
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawMetricField(curStep, nowPerf); drawEquilibriumArcs(curStep, nowPerf);
  drawGhosts(curStep, nowPerf); drawWavePackets(curStep, nowPerf, dt); drawNowInterferometer(dt, nowPerf);
  requestAnimationFrame(frame);
})(lastFrame);
</script>
