// --- Synthetic D Kurd Handpan Voice (Transport, NOW Strike & Future Preview ONLY; ZERO Past Sound!) ---

function playVoice(noteIdx, when = null, vel = 0.8, durSteps = 4, preview = false) {

// --- Music-Theory Variable-Duration & Closed-Loop Attention Solver ---
function pickCell(len, barIdx, subIdx, isCadence) {
  if (len === 8) {
    const m = state.motion, t = state.tension, pool = [];
    const wLow = clamp(0.66 - m * 0.96 + (isCadence && t < 0.25 ? 0.34 : 0), 0.04, 1.5), wMid = clamp(1.06 - Math.abs(m) * 0.74, 0.12, 1.2), wHigh = clamp(0.54 + m * 0.96 - (isCadence && t < -0.2 ? 0.24 : 0), 0.03, 1.5);

function choosePitch(step, dur, barIdx, prevPitch, prevInt, echo, anchor, nowPerf) {

    if (isHov) { const tw = tailActive ? 8.0 : 4.5; strokeLine(x - tw, y1, x + tw, y1, tailActive ? '#fff' : ink(0.72), tailActive ? 2.0 : 1.1); if (hover.kind === 'move-head' || drag.mode === 'move-head') strokeCirc(x, y0, rHead + 5.5, drag.mode === 'move-head' ? '#fff' : ink(0.72), 1.2); }
    else { ctx.fillStyle = lum(heat, (!isFuture || n.userLocked || isSel ? 0.56 : 0.28) * f); ctx.fillRect(x - 1.5, y0 + L - 0.5, 3, 1); }
  };
  for (const n of state.pastNotes) drawOne(n, n.step > cur);
  for (const n of state.futureNotes) drawOne(n, true);
}

function drawNowInterferometer(dt, nowPerf) {
  const y = geo.nowY, xL = geo.fieldL - 22, xR = geo.fieldR + 22, span = xR - xL;
  for (const loc of loci) { loc.glow = Math.max(0, loc.glow * Math.exp(-dt * loc.damp)); loc.heat = Math.max(0, loc.heat - dt * 2.4); }
  for (let i = blooms.length - 1; i >= 0; i--) if (nowPerf - blooms[i].bornPerf >= blooms[i].lifeMs) blooms.splice(i, 1);
  for (const b of blooms) {
    const ageMs = nowPerf - b.bornPerf, p = clamp(ageMs / b.lifeMs, 0, 1), e = Math.pow(1 - p, 1.85), bx = geo.locusX[b.idx], h = b.hot ? clamp(1 - ageMs / FLASH_MS, 0, 1) : 0;
    const rx = 5 + Math.pow(p, 0.72) * (26 + b.dur * 11) * (0.70 + b.vel * 0.42) * (b.idx === 0 ? 1.22 : 1), ry = rx * (0.62 + 0.30 * Math.pow(p, 0.6));
    ctx.strokeStyle = lum(h, e * 0.70); ctx.lineWidth = 0.8 + e * 1.1; ctx.beginPath(); ctx.ellipse(bx, y, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    if (p > 0.04 && rx > 11) { ctx.strokeStyle = lum(h * 0.6, e * 0.30); ctx.lineWidth = 0.7; ctx.beginPath(); ctx.ellipse(bx, y, rx * 0.58, ry * 0.58, 0, 0, Math.PI * 2); ctx.stroke(); }
  }
  let energy = 0; for (const b of blooms) energy += Math.pow(1 - (nowPerf - b.bornPerf) / b.lifeMs, 2);
  if (!blooms.length) strokeLine(xL, y + 0.5, xR, y + 0.5, ink(0.46));
  else {
    ctx.strokeStyle = ink(clamp(0.52 + energy * 0.36, 0.52, 0.98)); ctx.lineWidth = 1.15; ctx.beginPath();
    for (let s = 0; s <= 136; s++) {
      const u = s / 136, px = xL + u * span, win = Math.pow(Math.sin(u * Math.PI), 0.45); let dy = 0;
      for (const b of blooms) { const age = (nowPerf - b.bornPerf) * 0.001, e = Math.pow(1 - (nowPerf - b.bornPerf) / b.lifeMs, 1.8), dist = Math.abs(px - geo.locusX[b.idx]); dy += e * (4.5 + b.vel * 6.2) * (b.idx === 0 ? 1.24 : 1) * Math.cos(dist * (0.075 + b.idx * 0.014) - age * (16 + b.idx * 2.2)) * Math.exp(-dist / (44 + b.dur * 11)); }
      s ? ctx.lineTo(px, y + clamp(dy * win, -20, 20)) : ctx.moveTo(px, y + clamp(dy * win, -20, 20));
    }
    ctx.stroke();
  }
  for (let i = 0; i < 9; i++) {
    const x = geo.locusX[i], loc = loci[i], hov = hover.kind === 'strike-now' && hover.locus === i;
    strokeLine(x + 0.5, y - 5, x + 0.5, y + 5, lum(loc.heat, 0.24 + loc.glow * 0.65 + (hov ? 0.38 : 0)));
    if (i === 0 || loc.glow > 0.08 || hov) strokeCirc(x, y, (i === 0 ? 6.5 : 5) + loc.glow * 3.2, lum(hov ? 0.9 : loc.heat, (i === 0 ? 0.32 : 0) + loc.glow * 0.72 + (hov ? 0.55 : 0)), hov ? 1.3 : 1.0);
    fillCirc(x, y, (i === 0 ? 2.6 : 2.0) + loc.glow * 2.0 + (hov ? 1.0 : 0), lum(hov ? 1 : loc.heat, 0.58 + loc.glow * 0.42));
  }
  ctx.font = '8.5px ui-monospace, monospace'; ctx.textAlign = 'left'; ctx.fillStyle = ink(0.28); ctx.textBaseline = 'bottom'; ctx.fillText('PAST ↑', xR + 8, y - 6); ctx.textBaseline = 'top'; ctx.fillText('FUTURE ↓', xR + 8, y + 6);
}

function drawMarqueeAndPings(cur, nowPerf) {
  if (drag.mode === 'marquee' && drag.moved) {
    const r = marqueeRect(), hits = notesInMarquee(cur), addMode = drag.shiftAdd || isShiftHeld();
    ctx.fillStyle = ink(0.08); ctx.fillRect(r.x1, r.y1, r.x2 - r.x1, r.y2 - r.y1);
    ctx.save(); ctx.strokeStyle = ink(0.88); ctx.lineWidth = 1.1; ctx.setLineDash([4, 3]); ctx.strokeRect(r.x1 + 0.5, r.y1 + 0.5, Math.max(1, r.x2 - r.x1 - 1), Math.max(1, r.y2 - r.y1 - 1)); ctx.restore();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
    for (const [cx, cy, dx, dy] of [[r.x1,r.y1,1,1],[r.x2,r.y1,-1,1],[r.x1,r.y2,1,-1],[r.x2,r.y2,-1,-1]]) { ctx.beginPath(); ctx.moveTo(cx + dx * 7, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + dy * 7); ctx.stroke(); }
    const lbl = addMode ? `+G${state.groups.length + 1} ×${hits.length}` : `G1 ×${hits.length}`; ctx.font = '9px ui-monospace, monospace';
    const lw = Math.ceil(ctx.measureText(lbl).width) + 8, lh = 14, ly = Math.max(geo.padTop + 2, r.y1 - lh - 3);
    ctx.fillStyle = '#fff'; ctx.fillRect(r.x1, ly, lw, lh); ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(lbl, r.x1 + 4, ly + lh * 0.5 + 0.5);
  }
  for (let i = fxPings.length - 1; i >= 0; i--) {
    const p = fxPings[i], u = (nowPerf - p.bornPerf) / p.lifeMs; if (u >= 1) { fxPings.splice(i, 1); continue; }
    const a = 1 - u; strokeCirc(p.x, p.y, 4 + u * 18, ink(a * 0.82), 1.1);
    ctx.font = '9px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = ink(a); ctx.fillText(p.label, p.x, p.y - 8 - u * 10);
  }
}

function drawSteerPad(nowPerf) {
  const b = geo.pad, cx = b.x + b.w * 0.5, cy = b.y + b.h * 0.5, px = b.x + (state.motion * 0.5 + 0.5) * b.w, py = b.y + (0.5 - state.tension * 0.5) * b.h;
  const act = drag.mode === 'steer-pad' || keysDown.has('KeyW') || keysDown.has('KeyA') || keysDown.has('KeyS') || keysDown.has('KeyD'), heat = act ? 1 : clamp(1 - (nowPerf - state.steerHotPerf) / FLASH_MS, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.92)'; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = lum(heat, act ? 0.96 : (hover.kind === 'steer-pad' ? 0.55 : 0.20)); ctx.lineWidth = act ? 1.4 : 1; ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
  strokeLine(cx + 0.5, b.y + 4, cx + 0.5, b.y + b.h - 4, ink(0.08)); strokeLine(b.x + 4, cy + 0.5, b.x + b.w - 4, cy + 0.5, ink(0.08));
  strokeCirc(cx, cy, b.w * 0.25, ink(0.08)); strokeLine(cx, cy, px, py, lum(heat, act ? 0.95 : 0.56), act ? 1.5 : 1.0);
  fillCirc(px, py, act ? 6 : 5, act ? '#fff' : '#000'); strokeCirc(px, py, act ? 6 : 5, lum(heat, 0.95), 1.4); fillCirc(px, py, 1.8, act ? '#000' : lum(heat, 0.95));
  ctx.font = '8.5px ui-monospace, monospace';
  const lbl = (txt, x, y, al, bl, lit) => { ctx.textAlign = al; ctx.textBaseline = bl; ctx.fillStyle = ink(lit ? 0.98 : 0.36); ctx.fillText(txt, x, y); };
  lbl('W TENSION', cx, b.y - 5, 'center', 'bottom', keysDown.has('KeyW') || state.tension > 0.2); lbl('S RELEASE', cx, b.y + b.h + 5, 'center', 'top', keysDown.has('KeyS') || state.tension < -0.2);
  lbl('A', b.x + 5, cy, 'left', 'middle', keysDown.has('KeyA') || state.motion < -0.2); lbl('D', b.x + b.w - 5, cy, 'right', 'middle', keysDown.has('KeyD') || state.motion > 0.2);
  const sgn = (v) => (v >= 0 ? '+' : '') + v.toFixed(2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = lum(heat * 0.7, 0.40); ctx.fillText(`T${sgn(state.tension)} M${sgn(state.motion)}`, cx, b.y + b.h + 17);
}

// Smart Monochrome Live Cursor Reticle (Crisp Inverted White-Fill / Black-Ink for Active & Group Move)
function drawSmartReticle(cur) {
  if (!ptr.inside) return;
  let badge = '', inverted = drag.mode !== 'idle'; const shift = isShiftHeld(), selN = selectedNoteCount();
  if (drag.mode === 'strike-now' || (drag.mode === 'idle' && hover.kind === 'strike-now')) {
    const l = drag.mode === 'strike-now' ? drag.locus : hover.locus, x = geo.locusX[l], y = geo.nowY, col = drag.mode === 'strike-now' ? '#fff' : ink(0.68);
    badge = `STRIKE ${NOTES[l].name}`;
    for (const [dx, dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) { strokeLine(x + dx * 10, y + dy * 10, x + dx * 6, y + dy * 10, col); strokeLine(x + dx * 10, y + dy * 10, x + dx * 10, y + dy * 6, col); }
  } else if (drag.mode === 'move-group' || (drag.mode === 'idle' && hover.kind === 'move-group')) {
    inverted = true; const dStr = drag.mode === 'move-group' && drag.moved ? ` Δp${drag.lastDPitch >= 0 ? '+' : ''}${drag.lastDPitch} Δt${drag.lastDStep >= 0 ? '+' : ''}${drag.lastDStep}` : '';
    badge = `MOVE GROUP ✥ (${selN})${dStr}`;
  } else if (drag.mode === 'idle' && hover.kind === 'shift-toggle') { inverted = true; badge = '−GROUP'; }
  else if (drag.mode === 'idle' && hover.kind === 'shift-add-note') { inverted = true; badge = `+G${state.groups.length + 1} NOTE`; }
  else if (drag.mode === 'move-head' || (drag.mode === 'idle' && hover.kind === 'move-head')) { const n = drag.mode === 'move-head' ? drag.note : hover.note; badge = drag.mode === 'move-head' && n ? `MOVE ⇕ ${NOTES[n.noteIdx].name}` : 'MOVE ⇕'; }
  else if (drag.mode === 'resize-tail' || (drag.mode === 'idle' && hover.kind === 'resize-tail')) { const n = drag.mode === 'resize-tail' ? drag.note : hover.note; badge = drag.mode === 'resize-tail' && n ? `LENGTH ↕ ${n.dur}/16` : 'LENGTH ↕'; }
  else if (drag.mode === 'marquee') { const addM = drag.shiftAdd || shift; badge = drag.moved ? `${addM ? '+GROUP' : 'MARQUEE'} ▢ ${notesInMarquee(cur).length}` : (addM ? '+GROUP ▢' : 'PLANT +'); }
  else if (drag.mode === 'steer-pad' || (drag.mode === 'idle' && hover.kind === 'steer-pad')) badge = 'STEER ⊹';
  else if (drag.mode === 'idle' && (hover.kind === 'plant-past' || hover.kind === 'plant-future' || hover.kind === 'marquee-void')) {
    if (shift) { inverted = true; badge = '+GROUP ▢'; } else badge = hover.kind === 'marquee-void' ? 'MARQUEE ▢' : 'PLANT + / ▢';
    if (hover.locus >= 0 && !shift) { const sx = geo.locusX[hover.locus], sy = stepToY(hover.step, cur); strokeLine(sx - 6, sy + 0.5, sx + 6, sy + 0.5, ink(0.32)); strokeLine(sx + 0.5, sy - 6, sx + 0.5, sy + 6, ink(0.32)); strokeCirc(sx, sy, 3.2, ink(0.46), 0.9); }
  }
  if (!badge) return;
  ctx.font = inverted ? '600 9.5px ui-monospace, monospace' : '9.5px ui-monospace, monospace';
  const bw = Math.ceil(ctx.measureText(badge).width) + 12, bh = 18, bx = clamp(ptr.x + 14, 8, W - bw - 8), by = clamp(ptr.y - 25, 34, H - bh - 8);
  ctx.fillStyle = inverted ? '#fff' : 'rgba(0,0,0,0.92)'; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = inverted ? '#fff' : ink(0.42); ctx.lineWidth = 1; ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  ctx.fillStyle = inverted ? '#000' : ink(0.92); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(badge, bx + 6, by + bh * 0.5 + 0.5);
}

// --- 60 FPS Animation Loop + Left-Hand WASD Bimanual Future Steering ---
seedOpeningScore(); updateHud();
let lastFrame = performance.now();
(function frame(nowPerf) {
  const dt = Math.min(0.05, (nowPerf - lastFrame) / 1000); lastFrame = nowPerf; const cur = getCurrentStep();
  const ax = (keysDown.has('KeyD') ? 1 : 0) - (keysDown.has('KeyA') ? 1 : 0), ay = (keysDown.has('KeyW') ? 1 : 0) - (keysDown.has('KeyS') ? 1 : 0);
  if (ax || ay) {
    state.motion = clamp(state.motion + ax * dt * 1.18, -1, 1); state.tension = clamp(state.tension + ay * dt * 1.18, -1, 1); state.steerHotPerf = nowPerf;
    const det = `${Math.round(state.motion * 4)}:${Math.round(state.tension * 4)}`; if (det !== state.lastSteerDetent) { state.lastSteerDetent = det; playClick('drag-snap', 0.52); }
    if (nowPerf - state.lastWasdRecomp > 65) { state.lastWasdRecomp = nowPerf; recomputeFuture(true, { kind: 'steer' }); }
  }
  for (let i = state.pastNotes.length - 1; i >= 0; i--) {
    const n = state.pastNotes[i]; if (n.sympBoost > 0) n.sympBoost = Math.max(0, n.sympBoost - dt * 0.12);
    if (!n.firedVisual && cur >= n.step) { n.firedVisual = true; triggerResonator(n.noteIdx, n.vel, n.dur, Boolean(n.edited || (n.attn && n.attn.kind === 'selected'))); }
  }
  if (ptr.inside && drag.mode === 'idle') inspectHover(ptr.x, ptr.y);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawMetricField(cur); drawAttentionAndWavefronts(cur, nowPerf); drawGroupBoxes(cur); drawWavePackets(cur, nowPerf);
  drawNowInterferometer(dt, nowPerf); drawMarqueeAndPings(cur, nowPerf); drawSteerPad(nowPerf); drawSmartReticle(cur);
  requestAnimationFrame(frame);
})(lastFrame);
</script>
