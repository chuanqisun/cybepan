    if (u >= 1) { state.nowFlashes.splice(i, 1); continue; }
    const e = Math.pow(1 - u, 1.8), h = cf.hot ? e : 0;
    strokeLine(xL, y + 0.5, xR, y + 0.5, mixInk(h, 0.44 * e), 1.0 + e * 0.9);
    strokeCirc(geo.locusX[cf.pitch], y, 4 + Math.pow(u, 0.72) * (18 + cf.dur * 4.5) * (0.76 + cf.vel * 0.32), mixInk(h, 0.78 * e), 0.9 + e * 0.8);
  }
  strokeLine(xL, y + 0.5, xR, y + 0.5, 'rgba(255,255,255,0.42)');
  drawText('NOW', xR + 8, y + 0.5, 'left', 'middle', 'rgba(255,255,255,0.36)', 8.5);
  for (let i = 0; i < 9; i++) {
    const x = geo.locusX[i], gl = state.lociGlow[i], ht = state.lociHeat[i], hov = snapTarget && snapTarget.pitch === i && snapTarget.kind === 'now';
    strokeLine(x + 0.5, y - 4.5, x + 0.5, y + 4.5, mixInk(ht || (hov ? 0.9 : 0), 0.32 + gl * 0.68 + (hov ? 0.40 : 0)));
    fillCirc(x, y, (i === 0 ? 2.4 : 1.9) + gl * 1.9 + (hov ? 0.9 : 0), mixInk(ht || (hov ? 1 : 0), 0.60 + gl * 0.40));
    drawText(NOTES[i].name, x + 6, y - 5, 'left', 'bottom', mixInk(ht || (hov ? 0.9 : 0), 0.36 + gl * 0.64 + (hov ? 0.45 : 0)), 9);
  }
}
function drawSnapBracket() {
  if (!snapTarget) return;
  const { kind, x, y, bw, bh, pitch } = snapTarget, hw = bw * 0.5, hh = bh * 0.5, c = Math.min(7, hw * 0.45, hh * 0.55);
  const isHot = kind !== 'past' || snapTarget.vertex.pinned, ink = isHot ? '#ff5a1f' : 'rgba(255,255,255,0.82)';
  if (Math.abs(pointer.x - x) > hw || Math.abs(pointer.y - y) > hh)
    strokeLine(pointer.x, pointer.y, clamp(pointer.x, x - hw, x + hw), clamp(pointer.y, y - hh, y + hh), isHot ? 'rgba(255,90,31,0.18)' : 'rgba(255,255,255,0.14)', 0.75);
  ctx.fillStyle = isHot ? 'rgba(255,90,31,0.065)' : 'rgba(255,255,255,0.045)'; ctx.fillRect(x - hw, y - hh, bw, bh);
  ctx.strokeStyle = ink; ctx.lineWidth = 1.25; ctx.beginPath();
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    ctx.moveTo(x + sx * hw, y + sy * (hh - c)); ctx.lineTo(x + sx * hw, y + sy * hh); ctx.lineTo(x + sx * (hw - c), y + sy * hh);
  }
  ctx.stroke();
  let label = NOTES[pitch].name;
  if (kind === 'future') label = (snapTarget.slot.collapsed && snapTarget.slot.eigenPitch === pitch) ? `${NOTES[pitch].name} · 100%` : `${NOTES[pitch].name} · ${Math.round(snapTarget.slot.probs[pitch] * 100)}%`;
  else if (kind === 'past') label = `${NOTES[pitch].name} · ${snapTarget.vertex.pinned ? 'UNPIN' : 'PIN'}`;
  drawText(label, clamp(x, 38, W - 38), Math.max(geo.padTop + 10, y - hh - 4), 'center', 'bottom', ink, 9);
}

// --- 60 FPS Main Loop ---
seedInitialTimeline();
let lastTs = performance.now();
(function frame(nowPerf) {
  const dt = Math.min(0.05, (nowPerf - lastTs) / 1000); lastTs = nowPerf;
  const cur = getCurrentStep();
  if (state.playing) { observeCrossingSlots(cur, nowPerf); ensureFutureHorizon(cur); }
  updateSnap(cur);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawGrid(cur); drawPast(cur, nowPerf); drawFuture(cur, nowPerf, dt); drawNow(dt, nowPerf); drawSnapBracket();
  requestAnimationFrame(frame);
})(lastTs);
</script>
