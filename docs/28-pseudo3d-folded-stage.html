<style>

<script type="module">
// ============================================================================
// 28 — PSEUDO-3D FOLDED STAGE (ROCK-STABLE · ZERO FRONT-PLANE DISTORTION)
// TOP HALF (PAST):   Static pseudo-3D receding upright wall + Shift multi-marquee
// MIDDLE (NOW):      Crisp architectural fold hinge + 9 optical energy meters
// BOTTOM (FUTURE):   100% orthogonal flat front plane (x strictly invariant!)
// ============================================================================
const NOTES   = ['D3', 'A3', 'Bb3', 'C4', 'D4', 'E4', 'F4', 'G4', 'A4'];
const DEGREES = ['^1', '^5', '^b6', '^b7', '^1', '^2', '^b3', '^4', '^5'];
const FREQS   = [146.83, 220.00, 233.08, 261.63, 293.66, 329.63, 349.23, 392.00, 440.00];
const DURS = [1, 2, 3, 4, 6, 8], BPM = 84, STEP_S = 60 / BPM / 4;
const FUTURE_STEPS = 32, PAST_STEPS = 32, LANE_HALF = 4.55, FLASH_S = 0.40;
const WALL_K = 0.62, WALL_TAPER = 0.21;

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const pick  = (arr) => arr[(Math.random() * arr.length) | 0];
const snapDur = (s) => DURS.reduce((b, d) => Math.abs(d - s) < Math.abs(b - s) ? d : b, DURS[0]);
const laneX = (i) => i - 4;
const locusOfWorldX = (wx) => clamp(Math.round(wx + 4), 0, 8);
const mixInk = (sig, a) => `rgba(255,${Math.round(lerp(255, 90, clamp(sig, 0, 1)))},${Math.round(lerp(255, 31, clamp(sig, 0, 1)))},${clamp(a, 0, 1).toFixed(3)})`;

// --- STATIC ROCK-SOLID PSEUDO-3D FOLDED STAGE PROJECTION (ZERO PARALLAX) ---
const canvas = document.getElementById('stage'), ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
const stg = { cx: 640, topY: 50, nowY: 400, botY: 760, wallH: 350, frontH: 360, halfW: 380, colStep: 80, xL: 260, xR: 1020 };
function updateStage() {
  stg.cx = W * 0.5; stg.topY = 50; stg.botY = H - 22; stg.nowY = Math.round(stg.topY + (stg.botY - stg.topY) * 0.49);
  stg.wallH = Math.max(84, stg.nowY - stg.topY); stg.frontH = Math.max(84, stg.botY - stg.nowY);
  stg.halfW = clamp(W * 0.37, Math.min(136, W * 0.43), Math.min(W * 0.41, 460));
  stg.colStep = stg.halfW / LANE_HALF; stg.xL = stg.cx - stg.halfW; stg.xR = stg.cx + stg.halfW;
}
// BOTTOM FRONT PLANE (FUTURE): STRICTLY ORTHOGONAL — x(wx, stepOff) IS INVARIANT WITH stepOff!
const frontX = (wx) => stg.cx + wx * stg.colStep, frontY = (off) => stg.nowY + (off / FUTURE_STEPS) * stg.frontH;
const projFront = (wx, off) => ({ x: frontX(wx), y: frontY(off) });
const unprojFront = (sx, sy) => sy < stg.nowY ? null : { wx: (sx - stg.cx) / stg.colStep, off: ((sy - stg.nowY) / stg.frontH) * FUTURE_STEPS };
// TOP VERTICAL WALL (PAST): STATIC PSEUDO-3D FORESHORTENING + SUBTLE INWARD TAPER
function projWall(wx, ageSteps) {
  const t = Math.max(0, ageSteps) / PAST_STEPS, p = (t * (1 + WALL_K)) / (1 + WALL_K * t), scale = 1 - WALL_TAPER * clamp(p, 0, 1.12);
  return { x: stg.cx + wx * stg.colStep * scale, y: stg.nowY - p * stg.wallH, scale, p };
}
function unprojWall(sx, sy) {
  if (sy > stg.nowY) return null;
  const p = clamp((stg.nowY - sy) / stg.wallH, 0, 1), t = p / (1 + WALL_K * (1 - p)), scale = 1 - WALL_TAPER * p;
  return { wx: (sx - stg.cx) / (stg.colStep * scale), age: t * PAST_STEPS, p };
}
function resize() { DPR = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight; canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR); updateStage(); }
window.addEventListener('resize', resize); resize();

// --- SINGLE CLEAN SYNTHETIC D KURD HANDPAN VOICE + DRY MICRO-CLICKS ---
let actx = null, masterBus = null, reverbSend = null, noiseBuf = null, lastClickMs = 0;
function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return actx; }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -10; comp.knee.value = 14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.16; comp.connect(actx.destination);
  masterBus = actx.createGain(); masterBus.gain.value = 0.86; masterBus.connect(comp);
  const len = Math.floor(actx.sampleRate * 1.9), ir = actx.createBuffer(2, len, actx.sampleRate);
  for (let ch = 0; ch < 2; ch++) for (let i = 0, lp = 0, d = ir.getChannelData(ch); i < len; i++) { lp = lp * 0.72 + (Math.random() * 2 - 1) * 0.28; d[i] = lp * Math.pow(1 - i / len, 2.7) * (i < 900 ? i / 900 : 1); }
  const conv = actx.createConvolver(); conv.buffer = ir; reverbSend = actx.createGain(); reverbSend.gain.value = 0.34; reverbSend.connect(conv); conv.connect(comp);
  const nLen = Math.floor(actx.sampleRate * 0.04); noiseBuf = actx.createBuffer(1, nLen, actx.sampleRate);
  for (let i = 0, nd = noiseBuf.getChannelData(0); i < nLen; i++) nd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (nLen * 0.18));
  return actx;
}
function playVoice(locus, vel = 0.75, durSteps = 4, when = null, openHold = false) {
  const ctxA = ensureAudio(), t0 = when != null ? Math.max(when, ctxA.currentTime) : ctxA.currentTime;
  const f0 = FREQS[locus], isDing = locus === 0, panVal = (locus / 8 - 0.5) * 0.74;
  const tau1 = (isDing ? 1.48 : 1.12) * Math.pow(220 / f0, 0.22) * (openHold ? 1.85 : (0.30 + Math.pow(durSteps / 8, 0.78) * 1.45));
  const vGain = ctxA.createGain(), panner = ctxA.createStereoPanner();
  vGain.gain.setValueAtTime(vel * (isDing ? 0.56 : 0.44), t0); panner.pan.setValueAtTime(panVal, t0);
  vGain.connect(panner); panner.connect(masterBus); panner.connect(reverbSend);
  const addPartial = (hz, amp, rise, tau) => {
    const osc = ctxA.createOscillator(), g = ctxA.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(hz * (1 + 0.0025 * vel), t0); osc.frequency.exponentialRampToValueAtTime(hz, t0 + 0.045);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(amp, t0 + rise); g.gain.setTargetAtTime(0.0001, t0 + rise, tau);
    osc.connect(g); g.connect(vGain); osc.start(t0); osc.stop(t0 + Math.min(5.6, rise + tau * 5.2));
  };
  addPartial(f0, 0.72, 0.005, tau1); addPartial(f0 + 0.7, 0.28, 0.008, tau1 * 0.94);
  addPartial(f0 * 2, 0.26 * (0.65 + 0.45 * vel), 0.024, tau1 * 0.48); addPartial(f0 * 3, 0.10 * vel, 0.038, tau1 * 0.24);
  const src = ctxA.createBufferSource(), bp = ctxA.createBiquadFilter(), ng = ctxA.createGain();
  src.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.setValueAtTime(520 + locus * 110, t0); bp.Q.value = 1.6;
  ng.gain.setValueAtTime(vel * 0.22, t0); ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.022);
  src.connect(bp); bp.connect(ng); ng.connect(panner); src.start(t0);
  return { shapeTo(d) { if (!actx) return; const now = actx.currentTime; vGain.gain.cancelScheduledValues(now); vGain.gain.setValueAtTime(Math.max(0.0001, vGain.gain.value), now); vGain.gain.setTargetAtTime(0.0001, now, 0.14 + (d / 8) * 0.95); } };
}
function playClick(pan = 0, hz = 1480, gain = 0.04) {
  const nowMs = performance.now(); if (nowMs - lastClickMs < 22) return; lastClickMs = nowMs;
  const ctxA = ensureAudio(), t0 = ctxA.currentTime, osc = ctxA.createOscillator(), g = ctxA.createGain(), p = ctxA.createStereoPanner();
  osc.type = 'triangle'; osc.frequency.setValueAtTime(hz, t0); osc.frequency.exponentialRampToValueAtTime(hz * 0.42, t0 + 0.012);
  g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.015); p.pan.setValueAtTime(clamp(pan, -0.8, 0.8), t0);
  osc.connect(g); g.connect(p); p.connect(masterBus); osc.start(t0); osc.stop(t0 + 0.018);
}

// --- QUANTIZED VARIABLE-DURATION GENERATOR & MULTI-MARQUEE COMPOSITOR ---
const CELLS_SPARSE  = [[8,8],[6,2,8],[4,4,8],[6,4,6],[8,-4,4],[2,2,4,8],[6,-2,8]];
const CELLS_GROOVE  = [[3,3,2,4,4],[3,3,2,6,2],[2,2,4,3,3,2],[4,2,2,6,-2],[1,1,2,4,2,6],[6,2,2,2,4],[3,3,2,2,-2,4]];
const CELLS_KINETIC = [[1,1,2,3,3,2,2,2],[2,1,1,2,2,3,3,2],[3,3,2,1,1,2,4],[1,1,1,1,2,2,3,3,2],[2,2,1,1,2,2,2,4]];
const CHORDS = [[0,1,4,6,8],[2,4,6,8,1],[3,5,7,1,8],[0,1,4,6,5]]; // D Kurd: i -> bVI -> bVII -> i

const state = {
  playing: false, playhead: 24, anchorTime: 0, anchorStep: 24, generatedUpTo: 24, nextId: 1, nextGroupId: 1,
  past: [], future: [], shocks: [], brush: [], motifLocks: [], activeHolds: new Map(),
  locusGlow: new Float32Array(9), locusPeak: new Float32Array(9), locusOrange: new Float32Array(9), gravity: 0.44, kinetic: 0.48
};
const metricWeight = (s) => s === 0 ? 1.0 : s === 8 ? 0.78 : s % 4 === 0 ? 0.60 : s % 2 === 0 ? 0.36 : 0.18;
const findAtStep = (arr, s) => arr.find(n => n.step === s) || null;

function choosePitch(step, dur, prev1, prev2, barIdx) {
  const barInPhrase = ((barIdx % 4) + 4) % 4, barStep = ((step % 16) + 16) % 16;
  const pool = CHORDS[barInPhrase], gravCenter = lerp(1.6, 6.8, state.gravity);
  const e16 = findAtStep(state.past, step - 16), e32 = findAtStep(state.past, step - 32);
  const echoSrc = (e16 && Math.random() < 0.48) ? e16 : (e32 && Math.random() < 0.54) ? e32 : null;

  if (barStep === 0 && (barInPhrase === 0 || barInPhrase === 3)) {
    return { locus: state.gravity < 0.58 ? 0 : 4, attn: echoSrc ? { srcStep: echoSrc.step, srcLocus: echoSrc.locus, kind: 'phase' } : prev1 ? { srcStep: prev1.step, srcLocus: prev1.locus, kind: 'narmour' } : null };
  }
  if (echoSrc && Math.random() < 0.62) {
    const drift = state.gravity > 0.68 && echoSrc.locus < 7 ? 1 : state.gravity < 0.28 && echoSrc.locus > 0 ? -1 : 0;
    return { locus: clamp(echoSrc.locus + (Math.random() < 0.45 ? drift : 0), 0, 8), attn: { srcStep: echoSrc.step, srcLocus: echoSrc.locus, kind: 'phase' } };
  }
  let pref = Math.round(gravCenter);
  if (prev1 && prev2) {
    const leap = prev1.locus - prev2.locus;
    pref = Math.abs(leap) >= 3 ? clamp(prev1.locus - Math.sign(leap) * (Math.abs(leap) >= 5 ? 2 : 1), 0, 8)
                               : clamp(prev1.locus + (leap ? Math.sign(leap) : (Math.random() < 0.5 ? 1 : -1)), 0, 8);
  } else if (prev1) pref = clamp(prev1.locus + (Math.random() < 0.5 ? 1 : -1), 0, 8);

  let bestL = pref, bestSc = -1e9;
  for (let l = 0; l < 9; l++) {
    const sc = (pool.includes(l) ? 2.2 : 0) - Math.abs(l - pref) * 0.78 - Math.abs(l - gravCenter) * (0.42 + (dur >= 4 ? 0.25 : 0))
             - (prev1 && l === prev1.locus ? (dur <= 2 ? 1.8 : 0.9) : 0) + (l === 2 && dur >= 4 && barInPhrase === 1 ? 1.6 : 0)
             + (l === 0 && barStep === 0 && state.gravity < 0.65 ? 1.5 : 0) + (Math.random() - 0.5) * 1.45;
    if (sc > bestSc) { bestSc = sc; bestL = l; }
  }
  return { locus: bestL, attn: prev1 ? { srcStep: prev1.step, srcLocus: prev1.locus, kind: 'narmour' } : null };
}

function fillLockedSpan(startS, endS) {
  const occ = new Set(state.future.filter(n => n.step >= startS && n.step < endS).map(n => `${n.step}:${n.locus}`)), minS = Math.floor(state.playhead);
  for (const lock of state.motifLocks) for (let s = startS, len = Math.max(4, lock.len); s < endS; s++) {
    if (s <= minS) continue;
    const rel = (((s - lock.startStep) % len) + len) % len;
    for (const m of lock.notes) if (m.rel === rel) {
      const key = `${s}:${m.locus}`; if (occ.has(key)) continue; occ.add(key);
      state.future.push({ id: state.nextId++, step: s, locus: m.locus, dur: snapDur(Math.min(m.dur, endS - s)), vel: clamp(m.vel * (0.94 + Math.random() * 0.10), 0.35, 0.96), flash: lock.flash > 0 ? 0.85 : 0, sculpted: false, scheduled: false, attn: { srcStep: m.srcStep, srcLocus: m.srcLocus, kind: 'lock', groupId: lock.id } });
    }
  }
}
function generateBar(barStartStep) {
  if (state.motifLocks.length) { fillLockedSpan(barStartStep, barStartStep + 16); return; }
  const barIdx = Math.floor(barStartStep / 16), barInPhrase = ((barIdx % 4) + 4) % 4;
  const bank = state.kinetic < 0.34 ? CELLS_SPARSE : state.kinetic > 0.68 ? CELLS_KINETIC : CELLS_GROOVE;
  const cell = (barInPhrase === 3 && state.kinetic < 0.72) ? pick([[2,2,4,6,-2],[3,3,2,8],[4,4,6,-2],[6,2,6,-2]]) : pick(bank);
  const allPrev = [...state.past, ...state.future].filter(n => n.step < barStartStep).sort((a, b) => a.step - b.step);
  let prev2 = allPrev[allPrev.length - 2] || null, prev1 = allPrev[allPrev.length - 1] || null, cursor = 0;
  for (const raw of cell) {
    if (cursor >= 16) break; if (raw < 0) { cursor += -raw; continue; }
    const dur = snapDur(Math.min(raw, 16 - cursor)), step = barStartStep + cursor, { locus, attn } = choosePitch(step, dur, prev1, prev2, barIdx);
    const vel = clamp(0.50 + metricWeight(cursor) * 0.28 + (dur >= 6 ? 0.10 : dur >= 4 ? 0.05 : -0.04) + (locus === 2 ? 0.07 : 0) + (Math.random() - 0.5) * 0.08, 0.34, 0.96);
    const note = { id: state.nextId++, step, locus, dur, vel, flash: 0, sculpted: false, scheduled: false, attn };
    state.future.push(note); prev2 = prev1; prev1 = note; cursor += raw;
  }
}
function ensureFutureBuffer() {
  const target = Math.ceil(state.playhead) + FUTURE_STEPS;
  while (state.generatedUpTo < target) {
    const barStart = Math.floor(state.generatedUpTo / 16) * 16, nextStart = barStart < state.generatedUpTo ? barStart + 16 : barStart;
    if (nextStart > state.generatedUpTo) {
      if (state.motifLocks.length) fillLockedSpan(state.generatedUpTo, nextStart);
      else for (let s = state.generatedUpTo, prev1 = state.past.at(-1) || null, prev2 = state.past.at(-2) || null; s < nextStart;) {
        const dur = snapDur(Math.min(state.kinetic > 0.68 ? 2 : state.kinetic < 0.35 ? 4 : 3, nextStart - s)), { locus, attn } = choosePitch(s, dur, prev1, prev2, Math.floor(s / 16));
        const n = { id: state.nextId++, step: s, locus, dur, vel: 0.64, flash: 0, sculpted: false, scheduled: false, attn };
        state.future.push(n); prev2 = prev1; prev1 = n; s += dur;
      }
      state.generatedUpTo = nextStart;
    } else { generateBar(nextStart); state.generatedUpTo = nextStart + 16; }
  }
  state.future.sort((a, b) => a.step - b.step || a.locus - b.locus);
}
const regenerateFuture = (offset = 2) => { const cut = Math.ceil(state.playhead) + offset; state.future = state.future.filter(n => n.step < cut); state.generatedUpTo = cut; ensureFutureBuffer(); };
function seedOpeningScore() {
  const seed = [[0,0,4,0.88],[3,1,3,0.68],[6,2,2,0.72],[8,0,4,0.82],[8,4,3,0.76],[11,6,3,0.78],[14,5,2,0.64],[16,0,4,0.86],[18,7,2,0.70],[20,1,4,0.72],[20,8,4,0.80],[22,6,2,0.66]];
  state.past = seed.map(([step, locus, dur, vel], i) => ({ id: state.nextId++, step, locus, dur, vel, flash: 0, shimmer: 0, user: false, holding: false, attn: i > 0 ? { srcStep: seed[i - 1][0], srcLocus: seed[i - 1][1], kind: 'narmour' } : null }));
  state.playhead = state.anchorStep = state.generatedUpTo = 24; state.future = []; ensureFutureBuffer();
}

// --- PERSPECTIVE-FREE SHOCKWAVES & LOOKAHEAD SCHEDULER ---
function spawnShock(locus, vel, durSteps, orange = 0, holding = false) {
  const r = { locus, dur: durSteps, vel, age: 0, phase: Math.random() * Math.PI * 2, orange, holding, maxAge: 0.42 + Math.pow(durSteps / 8, 0.80) * 2.15, maxR: 0.95 + Math.pow(durSteps / 8, 0.78) * 3.10 * (0.85 + vel * 0.25), rings: durSteps >= 6 ? 3 : durSteps >= 3 ? 2 : 1 };
  state.shocks.push(r); if (state.shocks.length > 26) state.shocks.shift();
  const e = clamp(0.68 + vel * 0.45, 0, 1.15);
  state.locusGlow[locus] = Math.max(state.locusGlow[locus], e); state.locusPeak[locus] = Math.max(state.locusPeak[locus], e);
  if (orange > 0) state.locusOrange[locus] = Math.max(state.locusOrange[locus], orange);
  return r;
}

const updatePlayhead = () => { if (state.playing && actx) state.playhead = state.anchorStep + (actx.currentTime - state.anchorTime) / STEP_S; };

setInterval(() => {
  if (!state.playing || !actx) return;
  updatePlayhead(); ensureFutureBuffer();
  const nowS = state.playhead, look = 0.12 / STEP_S;
  for (const n of state.future) if (!n.scheduled && n.step <= nowS + look) {
    n.scheduled = true; playVoice(n.locus, n.vel, n.dur, actx.currentTime + Math.max(0.002, (n.step - nowS) * STEP_S), false);
  }
  while (state.future.length && state.future[0].step <= nowS) {
    const n = state.future.shift();
    if (!n.scheduled) playVoice(n.locus, n.vel, n.dur, actx.currentTime, false);
    spawnShock(n.locus, n.vel, n.dur, n.sculpted ? 0.90 : 0, false);
    if (n.attn) { const src = state.past.find(p => p.step === n.attn.srcStep && p.locus === n.attn.srcLocus); if (src) src.shimmer = 1; }
    state.past.push({ id: n.id, step: n.step, locus: n.locus, dur: n.dur, vel: n.vel, flash: n.sculpted ? 0.75 : 0, shimmer: 0, user: false, holding: false, attn: n.attn });
    state.kinetic = lerp(state.kinetic, 0.48, 0.008);
  }
  if (state.past.length > 220) state.past = state.past.filter(n => n.step >= nowS - 128);
  for (const lock of state.motifLocks) if (lock.endStep < nowS - 28) {
    const shift = Math.ceil((nowS - 20 - lock.endStep) / lock.len) * lock.len;
    if (shift > 0 && lock.startStep + shift < nowS - 2) {
      lock.startStep += shift; lock.endStep += shift;
      for (const m of lock.notes) m.srcStep += shift;
      for (const f of state.future) if (f.attn?.groupId === lock.id) f.attn.srcStep += shift;
    }
  }
}, 25);

const playBtn = document.getElementById('playBtn'), playLbl = document.getElementById('playLbl'), metaEl = document.getElementById('meta');
function togglePlay(force = null) {
  const want = force != null ? force : !state.playing; if (want === state.playing) return;
  const ctxA = ensureAudio();

      if (n.dur >= 4 || lockGrp || inDrag || n.shimmer > 0.08) { ctx.strokeStyle = mixInk(sig, a * (lockGrp || inDrag ? 0.82 : 0.46 + n.shimmer * 0.4)); ctx.lineWidth = 0.9; ctx.beginPath(); ctx.arc(pTop.x, pTop.y, r0 + (3.4 + n.shimmer * 3.0) * pTop.scale, 0, Math.PI * 2); ctx.stroke(); }
      if (n.dur >= 6) { ctx.strokeStyle = mixInk(sig, a * 0.24); ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(pTop.x, pTop.y, r0 + 6.6 * pTop.scale, 0, Math.PI * 2); ctx.stroke(); }
    }
  }

  // 10. THE NOW ARCHITECTURAL FOLD HINGE & 9 CALIBRATED OPTICAL LEVEL METERS
  ctx.strokeStyle = 'rgba(255,255,255,0.78)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(stg.xL - 16, stg.nowY); ctx.lineTo(stg.xR + 16, stg.nowY); ctx.stroke();
  const gL = projWall(-LANE_HALF, 1.4), gR = projWall(LANE_HALF, 1.4);
  ctx.strokeStyle = 'rgba(255,255,255,0.44)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(stg.xL, stg.nowY + 9); ctx.lineTo(stg.xL, stg.nowY); ctx.lineTo(gL.x, gL.y); ctx.moveTo(stg.xR, stg.nowY + 9); ctx.lineTo(stg.xR, stg.nowY); ctx.lineTo(gR.x, gR.y); ctx.stroke();

  for (let i = 0; i < 9; i++) {
    const wx = laneX(i), x = frontX(wx), glow = state.locusGlow[i], peak = state.locusPeak[i], sig = state.locusOrange[i], hov = g.hoverLocus === i, isRoot = i === 0 || i === 4;
    for (let k = 0, segs = 6, lit = clamp(glow, 0, 1) * segs; k < segs; k++) {
      const py = projWall(wx, 0.55 + k * 0.55), active = lit > k + 0.15, hw = (isRoot ? 5.4 : 4.3) * (1 - k * 0.055);
      ctx.strokeStyle = active ? mixInk(sig, 0.45 + clamp(lit - k, 0, 1) * 0.55) : `rgba(255,255,255,${hov ? 0.22 : 0.075})`;
      ctx.lineWidth = active ? 1.4 : 0.8; ctx.beginPath(); ctx.moveTo(py.x - hw, py.y); ctx.lineTo(py.x + hw, py.y); ctx.stroke();
    }
    if (peak > 0.12) {
      const pk = projWall(wx, 0.55 + clamp(peak, 0, 1) * 5.6 * 0.55);
      ctx.strokeStyle = mixInk(sig, clamp(peak, 0, 0.92)); ctx.lineWidth = 1.25; ctx.beginPath(); ctx.moveTo(pk.x - 5.6, pk.y); ctx.lineTo(pk.x + 5.6, pk.y); ctx.stroke();
    }
    const th = (isRoot ? 6.2 : 4.4) + glow * 3;
    ctx.strokeStyle = mixInk(sig, hov ? 0.98 : 0.50 + glow * 0.50); ctx.lineWidth = glow > 0.15 || hov ? 1.6 : 1.05;
    ctx.beginPath(); ctx.moveTo(x, stg.nowY - th); ctx.lineTo(x, stg.nowY + th); ctx.stroke();
    if (glow > 0.06 || hov) { ctx.fillStyle = mixInk(sig, clamp(glow + (hov ? 0.45 : 0), 0, 1)); ctx.beginPath(); ctx.arc(x, stg.nowY, 2.0 + glow * 2.7, 0, Math.PI * 2); ctx.fill(); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.font = '9px ui-monospace, "SF Mono", Menlo, monospace'; ctx.fillStyle = mixInk(sig, hov || glow > 0.18 ? 0.94 : isRoot ? 0.54 : 0.32); ctx.fillText(NOTES[i], x, stg.nowY + th + 4);
    ctx.font = '8px ui-monospace, "SF Mono", Menlo, monospace'; ctx.fillStyle = mixInk(sig, hov || glow > 0.18 ? 0.64 : 0.18); ctx.fillText(DEGREES[i], x, stg.nowY + th + 14);
  }

  ctx.font = '10px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
  ctx.fillStyle = (g.mode === 'scrub' || g.hoverZone === 'scrub') ? '#ff5a1f' : 'rgba(255,255,255,0.66)';
  ctx.fillText('NOW ▸', stg.xL - 22, stg.nowY);
  if (g.mode === 'scrub') {
    const age = clamp(state.playhead - g.scrubStep, 0, PAST_STEPS), sL = projWall(-LANE_HALF - 0.18, age), sR = projWall(LANE_HALF + 0.18, age);
    ctx.strokeStyle = '#ff5a1f'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(sL.x, sL.y); ctx.lineTo(sR.x, sR.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#ff5a1f'; ctx.fillText(`-${Math.round(state.playhead - g.scrubStep)}`, sL.x - 8, sL.y);
  }
  if (W >= 620) { ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.20)'; ctx.fillText('PAST ↑', wTR.x + 12, stg.topY + 8); ctx.fillText('FUTURE ↓', stg.xR + 12, stg.botY - 12); }
  requestAnimationFrame(drawFrame);
}

seedOpeningScore();
requestAnimationFrame(drawFrame);
