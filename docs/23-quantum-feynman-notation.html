// --- Synthetic D Kurd Web Audio Handpan + Delicate Crystal Collapse Click ---

// --- Quantum State, Entanglement Graph & Past Feynman Vertices ---
const state = {
  hamiltonian: 0.0, entropy: 0.44, padHotPerf: -9999,
  playing: false, playheadStep: 28.0, anchorStep: 28.0, anchorAudioTime: 0,
  nextId: 1, lastGenBar: 1,
  pastVertices: [], futureSlots: [], entanglements: [],
  collapseFlashes: [], rowRipples: [], photonPulses: [],
  lociGlow: new Float32Array(9), lociHeat: new Float32Array(9),
  forcedBias: { pitch: -1, perf: -9999 },
};
const getCurrentStep = () =>
  (!state.playing || !actx) ? state.playheadStep : state.anchorStep + Math.max(0, (actx.currentTime - state.anchorAudioTime) / TATUM);
const getSlotById = id => state.futureSlots.find(s => s.id === id) || null;

function pickHalfCell(barIdx, halfIdx) {
  const h = state.hamiltonian, e = state.entropy, cad = halfIdx === 1 && (barIdx & 1) === 1, pool = [];
  const wCalm = clamp(0.85 - h * 0.45 - (e - 0.45) * 0.45 + (cad ? 0.35 : 0), 0.12, 1.4);

}

function generateFutureBar(barIdx) {
  const barStart = barIdx * 16, barSlots = [];
  for (let half = 0; half < 2; half++) {

    for (const seg of pickHalfCell(barIdx, half)) {

        const pos = ((cursor % 16) + 16) % 16;

function computeBaseLogits(slot, refPitch, refInt, pinnedPast, recentSalient) {

    }
  }
  // 2. Wavy Harmonic Photon Exchange (~~~~) between resonant Past vertices
  for (const { v, x, y, f } of visible) {
    for (const bid of v.harmonicBonds) {
      const o = byId.get(bid); if (!o) continue;
      drawPhotonWave(o.x, o.y, x, y, 2.8, 12, tSec * 2.2 + v.id, (o.x >= x ? 1 : -1) * clamp(10 + Math.abs(y - o.y) * 0.14, 10, 26), `rgba(255,255,255,${(0.24 * Math.min(f, o.f)).toFixed(3)})`, 0.8);
    }
  }
  // 3. Solid Directed Fermion Propagators (→) connecting consecutive collapsed events
  const chrono = visible.filter(it => it.y > geo.padTop + 12 || !it.v.pinned).sort((a, b) => a.v.step - b.v.step);
  for (let i = 1; i < chrono.length; i++) {
    const prev = chrono[i - 1], curr = chrono[i]; if (curr.v.step - prev.v.step > 12) continue;
    const isLeap = Math.abs(curr.v.pitch - prev.v.pitch) >= 3, fresh = clamp(1 - (nowPerf - curr.v.collapsePerf) / 520, 0, 1);
    drawFermionLine(prev.x, prev.y, curr.x, curr.y, mixInk(curr.v.preCollapsed ? fresh * 0.9 : 0, (0.34 + fresh * 0.32) * Math.min(prev.f, curr.f)), isLeap ? 1.2 : 0.95, isLeap);
  }
  // 4. Feynman Vertices (●) with Quantized Duration Arc & Wing Ticks
  for (const { v, x, y, f } of visible) {
    const fresh = clamp(1 - (nowPerf - v.collapsePerf) / 560, 0, 1), hov = hover.kind === 'past' && hover.pastId === v.id;
    const heat = v.pinned ? 1 : ((v.preCollapsed || v.isUser) ? fresh : 0), r = (v.pitch === 0 ? 3.5 : 2.7) + v.vel * 1.15, wing = 4.5 + v.dur * 1.35;
    strokeLine(x - wing, y, x - r - 1.5, y, mixInk(heat, (0.36 + fresh * 0.35) * f), 0.85);
    strokeLine(x + r + 1.5, y, x + wing, y, mixInk(heat, (0.36 + fresh * 0.35) * f), 0.85);
    if (v.dur >= 4) { strokeLine(x - wing, y - 2.2, x - wing, y + 2.2, mixInk(heat, 0.38 * f), 0.8); strokeLine(x + wing, y - 2.2, x + wing, y + 2.2, mixInk(heat, 0.38 * f), 0.8); }
    ctx.strokeStyle = mixInk(heat, (0.58 + fresh * 0.34) * f); ctx.lineWidth = v.pinned ? 1.35 : 1.05;
    ctx.beginPath(); ctx.arc(x, y, r + 3.6, -Math.PI * 0.5, -Math.PI * 0.5 + (v.dur / 8) * Math.PI * 2); ctx.stroke();
    fillCirc(x, y, r, mixInk(heat, 0.96 * f));
    if (v.isUser) strokeCirc(x, y, r + 6.4, mixInk(heat, 0.48 * f), 0.8);
    if (v.pinned || hov) {
      strokeCirc(x, y, r + 7.2, v.pinned ? '#ff5a1f' : 'rgba(255,255,255,0.68)', v.pinned ? 1.3 : 0.95);
      if (v.pinned) drawText('g', x + r + 9.5, y - 4, 'left', 'middle', '#ff5a1f', 8.5);
    }
  }
}

function computeHoverPreviewMap() {
  const preview = new Map();
  if (hover.kind !== 'future' || hover.slotId < 0 || hover.pitch < 0) return preview;
  for (const ent of state.entanglements) {
    const isA = ent.aId === hover.slotId, isB = ent.bId === hover.slotId;
    if (!isA && !isB) continue;
    const partner = getSlotById(isA ? ent.bId : ent.aId);
    if (!partner || partner.collapsed) continue;
    preview.set(partner.id, computeSlotDistribution(partner, { pitch: hover.pitch, type: ent.type, strength: ent.strength, reverse: isB }));
  }
  return preview;
}

function drawFutureQuantum(cur, nowPerf, dt) {
  const tSec = nowPerf * 0.001, previewMap = computeHoverPreviewMap();
  // 1. Wavy Entanglement Boson/Photon Propagators (~~~~)
  for (const ent of state.entanglements) {
    const sa = getSlotById(ent.aId), sb = getSlotById(ent.bId); if (!sa || !sb) continue;
    const ya = stepToY(sa.step, cur), yb = stepToY(sb.step, cur);
    if (yb < geo.nowY + 4 || ya > H - geo.padBot) continue;
    const isHov = hover.kind === 'future' && (hover.slotId === sa.id || hover.slotId === sb.id);
    const pa = isHov && hover.slotId === sa.id ? hover.pitch : (previewMap.has(sa.id) ? argmax(previewMap.get(sa.id)) : (sa.collapsed ? sa.eigenPitch : argmax(sa.probs)));
    const pb = isHov && hover.slotId === sb.id ? hover.pitch : (previewMap.has(sb.id) ? argmax(previewMap.get(sb.id)) : (sb.collapsed ? sb.eigenPitch : argmax(sb.probs)));
    const pulse = clamp(1 - (nowPerf - ent.pulsePerf) / 680, 0, 1), heat = isHov ? 1.0 : pulse;
    const f = Math.min(edgeFade(ya), edgeFade(yb)), alpha = (isHov ? 0.88 : (ent.type === 'harmonic' ? 0.24 : 0.19) + pulse * 0.65) * f;
    const bow = (ent.type === 'harmonic' ? 18 : -13) * ((pa + pb) < 8 ? -1 : 1);
    const mid = drawPhotonWave(geo.locusX[pa], ya, geo.locusX[pb], yb, isHov ? 4.2 : 3.0 + pulse * 1.4, ent.type === 'harmonic' ? 14 : 10, -tSec * (isHov ? 8.5 : 3.2) + ent.aId, bow, mixInk(heat, alpha), isHov ? 1.35 : 0.9 + pulse * 0.5);
    if (isHov && mid) {
      ctx.font = '8px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ff5a1f'; ctx.fillText(ent.type === 'harmonic' ? 'γ·HARM' : 'γ·GAP', mid.mx + (bow >= 0 ? 18 : -18), mid.my);
    }
  }
  // Traveling entanglement boson pulses (including cross-NOW spooky action!)
  for (let i = state.photonPulses.length - 1; i >= 0; i--) {
    const pp = state.photonPulses[i], u = (nowPerf - pp.bornPerf) / pp.lifeMs;
    if (u >= 1) { state.photonPulses.splice(i, 1); continue; }
    const target = getSlotById(pp.toSlotId); if (!target) continue;
    const x1 = geo.locusX[pp.fromPitch], y1 = Math.max(geo.padTop, stepToY(pp.fromStep, cur));
    const x2 = geo.locusX[pp.toPitch], y2 = stepToY(target.step, cur); if (y2 > H - geo.padBot) continue;
    const bow = (pp.type === 'harmonic' ? 18 : -13) * ((pp.fromPitch + pp.toPitch) < 8 ? -1 : 1);
    drawPhotonWave(x1, y1, x2, y2, 4.4 * (1 - u * 0.4), 13, -tSec * 12, bow, `rgba(255,90,31,${((1 - u) * 0.88).toFixed(3)})`, 1.4);
    fillCirc(lerp(x1, x2, u), lerp(y1, y2, u), 3.6 * (1 - u * 0.45), `rgba(255,90,31,${(1 - u).toFixed(3)})`);
  }
  // Destructive-interference horizontal ripples on pre-measured rows
  for (let i = state.rowRipples.length - 1; i >= 0; i--) {
    const rp = state.rowRipples[i], u = (nowPerf - rp.bornPerf) / rp.lifeMs;
    if (u >= 1) { state.rowRipples.splice(i, 1); continue; }
    const ry = stepToY(rp.step, cur); if (ry < geo.nowY || ry > H - geo.padBot) continue;
    const e = Math.pow(1 - u, 1.7);
    strokeLine(geo.fieldL - 12, ry, geo.fieldR + 12, ry, `rgba(255,90,31,${(0.42 * e).toFixed(3)})`, 1.0);
    strokeCirc(geo.locusX[rp.pitch], ry, 5 + u * 28, `rgba(255,90,31,${(0.72 * e).toFixed(3)})`, 1.1);
    for (let k = 0; k < 9; k++) {
      if (k === rp.pitch || rp.preProbs[k] < 0.03) continue;
      strokeCirc(geo.locusX[k], ry, (1 - u) * (3 + rp.preProbs[k] * 14), `rgba(255,255,255,${(0.45 * e * Math.min(1, rp.preProbs[k] * 3.5)).toFixed(3)})`, 0.8);
    }
  }
  // 2. Superposition Probability Rows (ALL 9 pitches simultaneously)
  for (const slot of state.futureSlots) {
    slot.shiftHeat = Math.max(0, slot.shiftHeat - dt * 1.9);
    const y = stepToY(slot.step, cur); if (y < geo.nowY + 4 || y > H - geo.padBot) continue;
    const f = edgeFade(y), isPreview = previewMap.has(slot.id), probs = isPreview ? previewMap.get(slot.id) : slot.probs;
    const rowHeat = isPreview ? 0.92 : slot.shiftHeat;
    strokeLine(geo.fieldL - 10, y, geo.fieldR + 10, y, mixInk(rowHeat * 0.6, (slot.collapsed ? 0.08 : 0.055) * f), 0.75);
    strokeLine(geo.fieldL - 15 - slot.dur * 1.4, y, geo.fieldL - 14, y, mixInk(slot.collapsed ? 1 : rowHeat, 0.34 * f), 1.3);

    if (slot.collapsed && slot.eigenPitch >= 0) {
      const ex = geo.locusX[slot.eigenPitch], fresh = clamp(1 - (nowPerf - slot.collapsePerf) / 560, 0, 1), r = 3.4 + slot.vel * 1.1;
      for (let i = 0; i < 9; i++) if (i !== slot.eigenPitch) strokeLine(geo.locusX[i] - 1.6, y - 1.6, geo.locusX[i] + 1.6, y + 1.6, `rgba(255,255,255,${(0.08 * f).toFixed(3)})`, 0.7);
      ctx.strokeStyle = mixInk(1, (0.75 + fresh * 0.25) * f); ctx.lineWidth = 1.25;
      ctx.beginPath(); ctx.arc(ex, y, r + 4.0, -Math.PI * 0.5, -Math.PI * 0.5 + (slot.dur / 8) * Math.PI * 2); ctx.stroke();
      fillCirc(ex, y, r, mixInk(0.85, 0.98 * f)); strokeCirc(ex, y, r + 7.2, `rgba(255,90,31,${(0.45 * f).toFixed(3)})`, 0.9);
      continue;
    }
    for (let i = 0; i < 9; i++) {
      const p = probs[i], x = geo.locusX[i], isHov = hover.kind === 'future' && hover.slotId === slot.id && hover.pitch === i;
      const delta = isPreview ? p - slot.probs[i] : 0;
      const nodeHeat = isHov ? 1.0 : (isPreview && delta > 0.025 ? clamp(delta * 5.2, 0.35, 1.0) : rowHeat * clamp(p * 3.2, 0, 1));
      const pPow = Math.pow(p, 0.58), osc = Math.sin(tSec * (3.0 + i * 0.42) + slot.phaseSeed + i * 1.3);
      const rCore = 0.95 + pPow * 4.4 + (isHov ? 1.2 : 0), rRing = rCore + 2.2 + pPow * 8.2 + osc * (0.7 + pPow * 1.4);
      strokeCirc(x, y, rRing, mixInk(nodeHeat, clamp((0.08 + pPow * 0.62 + (isHov ? 0.35 : 0)) * f, 0.03, 0.98)), isHov ? 1.45 : 0.65 + pPow * 0.65);
      if (p > 0.15 || isHov) strokeCirc(x, y, rRing + 3.6 - osc * 0.9, mixInk(nodeHeat, (0.08 + p * 0.36) * f), 0.65);
      fillCirc(x, y, rCore, mixInk(nodeHeat, clamp((0.14 + Math.pow(p, 0.65) * 0.88) * f, 0.06, 0.98)));
      if (isHov) {
        ctx.font = '9.5px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillStyle = '#ff5a1f'; ctx.fillText(`|${NOTES[i].name}⟩ ${Math.round(p * 100)}%`, x, y - rRing - 6);
      }
    }
  }
}

function drawNowObserver(dt, nowPerf) {
  const y = geo.nowY, xL = geo.fieldL - 26, xR = geo.fieldR + 26;
  for (let i = 0; i < 9; i++) { state.lociGlow[i] = Math.max(0, state.lociGlow[i] * Math.exp(-dt * 2.8)); state.lociHeat[i] = Math.max(0, state.lociHeat[i] - dt * 2.2); }
  for (let i = state.collapseFlashes.length - 1; i >= 0; i--) {
    const cf = state.collapseFlashes[i], u = (nowPerf - cf.bornPerf) / cf.lifeMs;
    if (u >= 1) { state.collapseFlashes.splice(i, 1); continue; }
    const e = Math.pow(1 - u, 1.75), bx = geo.locusX[cf.pitch], h = cf.hot ? e : e * 0.55;
    strokeLine(xL, y, xR, y, mixInk(h, 0.34 * e), 1.0 + e * 0.8);
    const rad = 5 + Math.pow(u, 0.68) * (24 + cf.dur * 9.5) * (0.72 + cf.vel * 0.38);
    strokeCirc(bx, y, rad, mixInk(h, 0.72 * e), 0.8 + e * 1.0);
    if (rad > 14) strokeCirc(bx, y, rad * 0.56, mixInk(h * 0.7, 0.34 * e), 0.7);
    for (let k = 0; k < 9; k++) {
      const pk = cf.preProbs[k] || 0; if (k === cf.pitch || pk < 0.025) continue;
      const gx = geo.locusX[k], drift = (gx < bx ? -1 : 1) * u * 12;
      strokeCirc(gx + drift, y, Math.max(0.8, (2.2 + pk * 11) * (1 - u)), `rgba(255,255,255,${(0.46 * e * Math.min(1, pk * 3.4)).toFixed(3)})`, 0.75);
      strokeLine(gx - 3 * e, y - 5 * u, gx + 3 * e, y + 5 * u, `rgba(255,255,255,${(0.24 * e * pk * 3).toFixed(3)})`, 0.7);
    }
  }
  strokeLine(xL, y + 0.5, xR, y + 0.5, 'rgba(255,255,255,0.44)', 1.0);
  strokeLine(xL, y - 8, xL, y + 8, 'rgba(255,255,255,0.52)', 1.1);
  strokeLine(xR, y - 8, xR, y + 8, 'rgba(255,255,255,0.52)', 1.1);
  ctx.font = '10px ui-monospace, monospace'; ctx.textBaseline = 'middle';
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,0.68)'; ctx.fillText('⟨ψ|', xL - 7, y + 0.5);
  ctx.textAlign = 'left';  ctx.fillStyle = 'rgba(255,255,255,0.48)'; ctx.fillText('NOW', xR + 8, y + 0.5);
  for (let i = 0; i < 9; i++) {
    const x = geo.locusX[i], gl = state.lociGlow[i], ht = state.lociHeat[i], hov = hover.kind === 'now' && hover.pitch === i;
    strokeLine(x + 0.5, y - 6, x + 0.5, y + 6, mixInk(ht, 0.30 + gl * 0.70 + (hov ? 0.38 : 0)));
    if (i === 0 || gl > 0.08 || hov) strokeCirc(x, y, (i === 0 ? 6.5 : 5.2) + gl * 3.4, mixInk(ht, (i === 0 ? 0.28 : 0) + gl * 0.72 + (hov ? 0.45 : 0)), 0.95);
    fillCirc(x, y, (i === 0 ? 2.5 : 2.0) + gl * 2.2 + (hov ? 0.8 : 0), mixInk(ht, 0.58 + gl * 0.42));
  }
}

function drawCornerPad(nowPerf) {
  const cx = geo.padX, cy = geo.padY, s = geo.padSize, hs = s * 0.5;
  const act = drag.mode === 'pad' || drag.mode === 'steer' || (drag.mode === 'future' && drag.moved);
  const heat = act ? 1 : clamp(1 - (nowPerf - state.padHotPerf) / 560, 0, 1), hov = hover.kind === 'pad';
  ctx.strokeStyle = mixInk(heat, act ? 0.58 : (hov ? 0.38 : 0.18)); ctx.lineWidth = 1;
  ctx.strokeRect(cx - hs + 0.5, cy - hs + 0.5, s, s);
  strokeLine(cx - hs, cy + 0.5, cx + hs, cy + 0.5, 'rgba(255,255,255,0.10)');
  strokeLine(cx + 0.5, cy - hs, cx + 0.5, cy + hs, 'rgba(255,255,255,0.10)');
  const kx = cx + state.hamiltonian * hs, ky = (cy - hs) + ((state.entropy - 0.12) / 0.88) * s;
  strokeLine(cx, cy, kx, ky, mixInk(heat, act ? 0.85 : 0.40), 1.0);
  fillCirc(kx, ky, act ? 4.2 : 3.2, mixInk(heat, act || hov ? 1.0 : 0.86));
  if (act || hov) strokeCirc(kx, ky, 7.5, mixInk(heat, 0.45), 0.9);
  ctx.font = '8.5px ui-monospace, monospace'; ctx.fillStyle = mixInk(heat * 0.7, 0.38);
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('SHARP', cx, cy - hs - 5);
  ctx.textBaseline = 'top'; ctx.fillText('CLOUD', cx, cy + hs + 5);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText('i', cx - hs - 6, cy);
  ctx.textAlign = 'left';  ctx.fillText('bVII', cx + hs + 5, cy);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = mixInk(heat * 0.8, 0.42);
  ctx.fillText(`H ${state.hamiltonian >= 0 ? '+' : ''}${state.hamiltonian.toFixed(1)} · S ${Math.round(state.entropy * 100)}%`, cx, cy + hs + 17);
}

// --- 60 FPS Main Loop ---
seedInitialTimeline();
let lastTs = performance.now();
(function frame(nowPerf) {
  const dt = Math.min(0.05, (nowPerf - lastTs) / 1000); lastTs = nowPerf;
  const cur = getCurrentStep();
  if (state.playing) { observeCrossingSlots(cur, nowPerf); ensureFutureHorizon(cur); }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawMetricSpacetime(cur);
  drawPastFeynman(cur, nowPerf);
  drawFutureQuantum(cur, nowPerf, dt);
  drawNowObserver(dt, nowPerf);
  drawCornerPad(nowPerf);
  requestAnimationFrame(frame);
})(lastTs);
</script>
