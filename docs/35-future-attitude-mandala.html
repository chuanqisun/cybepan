// --- Quantized 16th-Note Variable-Duration D Kurd Generative Engine ---
function barGravityTarget(barIdx, baseBar) {
  const rel = barIdx - baseBar, g = state.steer.gravity, rb = state.steer.resolveBias;

function pickCell(len, barIdx, subIdx, isCadence) {
  const E = state.steer.energy;
  if (len === 8) {
    const bands = [
      [CELLS.cantus,     Math.exp(-Math.pow((E - 0.08) / 0.18, 2)) + (isCadence && E < 0.3 ? 0.35 : 0)],
      [CELLS.lyrical,    Math.exp(-Math.pow((E - 0.36) / 0.17, 2))],

function choosePitch(step, dur, barIdx, barT, prevPitch, prevInt, echo, lockNote) {

  const rawSyn = clamp((shortCnt / all.length) * 0.88 + (syncScore / Math.max(2, all.length)) * 0.52 + e.dft8 * 0.34, 0, 1.4);
  const rSum = rawCan + rawLyr + rawTre + rawSyn + 0.001;

  // Eigenvector 2: Artificial Horizon Tilt, Eccentricity & Resolution Trajectory (Near 2b vs Far 2b)
  const tonalGravityOf = (list) => {
    if (!list.length) return { grav: -0.75, reg: 0.25 };
    let num = 0, den = 0, rNum = 0;
    for (const n of list) {
      const w = (0.55 + METRIC_W[((Math.round(n.step) % 16) + 16) % 16] * 0.65) * (0.65 + n.dur * 0.22);

  const gNear = tonalGravityOf(all), gFar = tonalGravityOf(far.length ? far : all);

  // Eigenvector 4: Coherence / Phase-Lock (Actual Echo Links + Bar-to-Bar Self-Similarity)
  const near64 = state.futureNotes.filter(n => n.step >= curStep - 0.1 && n.step < curStep + 64);

  let echoSum = 0, simHits = 0, simPairs = 0;

function recomputeFuture(flashChanges = true) {

  let prevPitch = hist.length ? hist[hist.length - 1].noteIdx : state.lastUserPitch;
  let prevInt = hist.length >= 2 ? hist[hist.length - 1].noteIdx - hist[hist.length - 2].noteIdx : 0;

  const nextFuture = [];

    prevPitch = res.prevPitch; prevInt = res.prevInt;
    for (const ev of res.barNotes) {
      if (ev.step < minStep) continue;

      if (old && old.noteIdx === ev.noteIdx && old.dur === ev.dur) ev.flashPerf = old.flashPerf;
      else if (flashChanges && prevByStep.size) ev.flashPerf = nowPerf;

    const dH = Math.abs(targetEigen.horizonShift - prevEigen.horizonShift) + Math.abs(targetEigen.trajectory - prevEigen.trajectory) * 0.7;
    const dA = Math.abs(targetEigen.aperture - prevEigen.aperture), dC = Math.abs(targetEigen.coherence - prevEigen.coherence);

    if (dH > 0.025) heat.horizon   = clamp(Math.max(heat.horizon, 0.55 + dH * 2.4), 0, 1);
    if (dA > 0.022) heat.aperture  = clamp(Math.max(heat.aperture, 0.55 + dA * 2.8), 0, 1);
    if (dC > 0.025) heat.coherence = clamp(Math.max(heat.coherence, 0.55 + dC * 2.4), 0, 1);

}

function seedInitialPast() {

}

// --- Lookahead Web Audio Scheduler, Transport & Direct Performance ---
let schedTimer = null;
function schedulerTick() {
  if (!state.playing || !actx) return;
  const horizon = state.anchorStep + (actx.currentTime + LOOKAHEAD - state.anchorAudioTime) / TATUM;
  while (state.futureNotes.length && state.futureNotes[0].step <= horizon) {
    const ev = state.futureNotes.shift();

    ev.id = state.nextId++; ev.firedVisual = false; state.pastNotes.push(ev); state.nextSchedStep = ev.step + 1;

  const curStep = getCurrentStep(), curBar = Math.floor(curStep / 16);
  const maxFut = state.futureNotes.length ? state.futureNotes[state.futureNotes.length - 1].step : -1;

// --- Geometry, Pointer & Keyboard Tactile Steering ---
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');

  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

const drag = { mode: null, locus: -1, detentE: '', detentG: '', detentC: '', clickT: 0 };
const hover = { zone: null, locusIdx: -1, pastId: -1 }, keysDown = new Set();

function applySteer({ energy, gravity, coherence, resolveBias }, panHint = 0) {

    if (Math.abs(v - state.steer.energy) > 0.002) {

      const b = v < 0.24 ? 0 : (v < 0.50 ? 1 : (v < 0.78 ? 2 : 3)), key = `${b}:${Math.round(v * 12)}`;
      if (key !== drag.detentE) { const maj = drag.detentE && drag.detentE[0] !== String(b); drag.detentE = key; playClick(panHint, maj); }

const updateGlyphPointer = (mx, my) => {
  const dx = clamp((mx - geo.gx) / (geo.R * 0.94), -1, 1), dy = clamp((geo.gy - my) / (geo.R * 0.94), -1, 1);
  applySteer({ gravity: dx, energy: (dy + 1) * 0.5 }, dx * 0.65);
};
const updateCoherencePointer = (mx, my) => {

  const n = clamp((s / (Math.PI * 0.78) + 1) * 0.5, 0, 1); applySteer({ coherence: n }, (n - 0.5) * 0.7);
};
function resetNeutral() {

  heat.lobe = heat.horizon = heat.aperture = heat.coherence = 1; playClick(0, true); recomputeFuture(true);
}

canvas.addEventListener('pointerdown', (e) => {

  canvas.setPointerCapture(e.pointerId);

  const pastHit = hitTestPastNote(mx, my);
  if (pastHit) { pastHit.locked = !pastHit.locked; heat.coherence = 1; return recomputeFuture(true); }

const strokeLine = (x1, y1, x2, y2, col, lw = 1) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };

function drawPastConstellation(curStep) {

  for (const n of state.futureNotes) {
    const dt = n.step - curStep; if (dt < 0 || dt > 64) continue;
    const x = geo.locusX[n.noteIdx], y0 = yNow + dt * pxStep, y1 = Math.min(H - 18, y0 + Math.max(4, n.dur * pxStep - 1.5)), fade = clamp(1 - dt / 68, 0.14, 1), h = clamp(1 - (nowPerf - n.flashPerf) / FLASH_MS, 0, 1);
    strokeLine(x, y0, x, y1, mixInk(h, (0.20 + n.vel * 0.14) * fade), 1.3); fillCirc(x, y0, 2.0 + n.vel * 0.8, mixInk(h, (0.42 + h * 0.52) * fade));
  }
}

function drawNowHorizon(dt, nowPerf) {
  const y = geo.nowY, xL = geo.fieldL - 22, xR = geo.fieldR + 22, span = xR - xL;
  for (const loc of loci) { loc.glow = Math.max(0, loc.glow * Math.exp(-dt * loc.damp)); loc.heat = Math.max(0, loc.heat - dt * 2.8); }
  for (let i = blooms.length - 1; i >= 0; i--) if (nowPerf - blooms[i].bornPerf >= blooms[i].lifeMs) blooms.splice(i, 1);
  for (const b of blooms) {
    const ageMs = nowPerf - b.bornPerf, p = clamp(ageMs / b.lifeMs, 0, 1), e = Math.pow(1 - p, 1.9);
    const rx = 5 + Math.pow(p, 0.72) * (22 + b.dur * 8.5) * (0.7 + b.vel * 0.4);
    ctx.strokeStyle = mixInk(b.hot ? clamp(1 - ageMs / FLASH_MS, 0, 1) : 0, e * 0.48); ctx.lineWidth = 0.8 + e * 0.7;
    ctx.beginPath(); ctx.ellipse(geo.locusX[b.idx], y, rx, rx * 0.44, 0, 0, TAU); ctx.stroke();
  }
  strokeLine(18, y + 0.5, xL, y + 0.5, 'rgba(255,255,255,0.10)'); strokeLine(xR, y + 0.5, W - 18, y + 0.5, 'rgba(255,255,255,0.10)');
  if (!blooms.length) strokeLine(xL, y + 0.5, xR, y + 0.5, 'rgba(255,255,255,0.48)');
  else {
    ctx.strokeStyle = 'rgba(255,255,255,0.78)'; ctx.lineWidth = 1.1; ctx.beginPath();
    for (let s = 0; s <= 120; s++) {
      const u = s / 120, px = xL + u * span, win = Math.pow(Math.sin(u * Math.PI), 0.45); let dy = 0;
      for (const b of blooms) {
        const age = (nowPerf - b.bornPerf) * 0.001, e = Math.pow(1 - (nowPerf - b.bornPerf) / b.lifeMs, 1.9), dist = Math.abs(px - geo.locusX[b.idx]);
        dy += e * (3.6 + b.vel * 5.2) * Math.cos(dist * (0.075 + b.idx * 0.013) - age * (15 + b.idx * 2.1)) * Math.exp(-dist / (40 + b.dur * 9));
      }
      s ? ctx.lineTo(px, y + clamp(dy * win, -16, 16)) : ctx.moveTo(px, y + clamp(dy * win, -16, 16));
    }
    ctx.stroke();
  }
  ctx.font = '9px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  for (let i = 0; i < 9; i++) {
    const x = geo.locusX[i], loc = loci[i], hov = hover.locusIdx === i;
    strokeLine(x + 0.5, y - 4.5, x + 0.5, y + 4.5, mixInk(loc.heat, 0.24 + loc.glow * 0.65 + (hov ? 0.35 : 0)));
    if (i === 0 || loc.glow > 0.08 || hov) strokeCirc(x, y, (i === 0 ? 6.0 : 4.8) + loc.glow * 3.2, mixInk(loc.heat, (i === 0 ? 0.24 : 0) + loc.glow * 0.68 + (hov ? 0.4 : 0)), 0.9);
    fillCirc(x, y, (i === 0 ? 2.5 : 1.9) + loc.glow * 2.0 + (hov ? 0.8 : 0), mixInk(loc.heat, 0.55 + loc.glow * 0.45));
    ctx.fillStyle = mixInk(loc.heat, 0.20 + loc.glow * 0.72 + (hov ? 0.52 : 0)); ctx.fillText(NOTES[i].name, x, y - 9);
  }
  ctx.font = '8.5px ui-monospace, monospace'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.44)'; ctx.fillText('NOW', 18, y - 6);
}

// --- BOTTOM STAGE (38% .. 100%): MONUMENTAL FUTURE ATTITUDE GLYPH ---
function sampleContourRadius(theta, rBase, phaseOffset, tSec, beatPhase, E) {
  const breathe = 1 + 0.018 * Math.sin(beatPhase * TAU);
  const spin3 = tSec * (0.28 + E.tresillo * 0.62) + phaseOffset, spin8 = tSec * (0.95 + E.syncop * 1.45) - phaseOffset * 1.5;
  const m2 = (0.042 * E.cantus + 0.024 * E.dft2) * Math.cos(2 * theta + tSec * 0.22 + phaseOffset);
  const m4 = (0.145 * E.lyrical + 0.048 * E.dft4) * Math.cos(4 * theta - Math.PI * 0.5 + phaseOffset);
  const m3 = (0.200 * E.tresillo + 0.052 * E.dft6) * (Math.cos(3 * theta - spin3) + 0.38 * E.chiral * Math.sin(6 * theta - 2 * spin3));
  const m8 = (0.148 * E.syncop + 0.048 * E.dft8) * (Math.cos(8 * theta + spin8) + 0.42 * Math.cos(12 * theta - spin8 * 1.35));
  return rBase * breathe * clamp(1 + m2 + m4 + m3 + m8, 0.54, 1.44);
}

function drawFutureAttitudeGlyph(curStep, tSec) {
  const gx = geo.gx, gy = geo.gy, R = geo.R, bzR = geo.bezelR, E = dispEigen;
  const beatPhase = (curStep % 4) / 4, barPhase = (((curStep % 16) + 16) % 16) / 16;
  const cohHot = Math.max(heat.coherence, drag.mode === 'coherence' ? 1 : 0);

  // Outer Aviation Compass Bezel + Interactive Coherence Phase-Lock Arc (Eigenvector 4)
  strokeCirc(gx, gy, bzR, mixInk(cohHot * 0.35, hover.zone === 'coherence' ? 0.26 : 0.11), 0.85);
  for (let d = 0; d < 36; d++) {
    const a = (d / 36) * TAU - Math.PI * 0.5, maj = d % 9 === 0, r0 = bzR - (maj ? 6 : 2.5), r1 = bzR + (maj ? 3 : 0);
    strokeLine(gx + Math.cos(a) * r0, gy + Math.sin(a) * r0, gx + Math.cos(a) * r1, gy + Math.sin(a) * r1, `rgba(255,255,255,${maj ? 0.26 : 0.10})`);
  }
  const arcSpan = Math.PI * 0.78, arcStart = -Math.PI * 0.5 - arcSpan, arcEnd = arcStart + arcSpan * 2 * state.steer.coherence;
  ctx.strokeStyle = mixInk(cohHot, drag.mode === 'coherence' || hover.zone === 'coherence' ? 0.88 : 0.36);
  ctx.lineWidth = drag.mode === 'coherence' ? 2.0 : 1.35;
  ctx.beginPath(); ctx.arc(gx, gy, bzR, arcStart, arcEnd); ctx.stroke();
  fillCirc(gx + Math.cos(arcEnd) * bzR, gy + Math.sin(arcEnd) * bzR, drag.mode === 'coherence' ? 4.2 : 3.0, mixInk(cohHot, 0.92));

  const swA = barPhase * TAU - Math.PI * 0.5;
  strokeLine(gx + Math.cos(swA) * (bzR - 11), gy + Math.sin(swA) * (bzR - 11), gx + Math.cos(swA) * (bzR - 4), gy + Math.sin(swA) * (bzR - 4), 'rgba(255,255,255,0.44)', 1.2);

  // Eigenvectors 1 + 3 + 4: Nested Concentric Cymatic Standing-Wave Contours
  const rBase = R * lerp(0.34, 0.90, E.aperture), ringCount = clamp(Math.round(E.ringCount), 1, 5);
  const contourHot = Math.max(heat.lobe, heat.aperture * 0.9, heat.coherence * 0.55);
  if (E.aperture > 0.22) {
    const rg = ctx.createRadialGradient(gx, gy, rBase * 0.08, gx, gy, rBase * 1.08);
    rg.addColorStop(0, 'rgba(255,255,255,0)'); rg.addColorStop(0.75, mixInk(contourHot * 0.4, 0.032 * E.aperture)); rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(gx, gy, rBase * 1.08, 0, TAU); ctx.fill();
  }
  for (let ring = ringCount - 1; ring >= 0; ring--) {
    const isOuter = ring === 0, scale = 1 - ring * lerp(0.165, 0.135, E.aperture);
    if (scale < 0.34) continue;
    const dephase = (1 - E.coherence) * ring * (0.48 + 0.22 * Math.sin(tSec * 0.7 + ring * 1.4)) * (ring & 1 ? 1 : -1);
    ctx.beginPath();
    for (let s = 0; s <= 180; s++) {
      const th = (s / 180) * TAU, rr = sampleContourRadius(th, rBase * scale, dephase, tSec, beatPhase, E);
      s ? ctx.lineTo(gx + Math.cos(th) * rr, gy + Math.sin(th) * rr) : ctx.moveTo(gx + Math.cos(th) * rr, gy + Math.sin(th) * rr);
    }
    ctx.closePath();
    const baseA = isOuter ? lerp(0.58, 0.96, E.aperture * 0.65 + E.coherence * 0.35) : lerp(0.14, 0.44, (1 - ring / 5) * (0.55 + E.coherence * 0.45));
    ctx.strokeStyle = mixInk(isOuter ? contourHot : contourHot * 0.72, baseA);
    ctx.lineWidth = isOuter ? lerp(1.15, 1.85, E.coherence * 0.5 + E.aperture * 0.5) : lerp(0.7, 1.05, E.coherence);
    ctx.stroke();
  }

  // Phase-Lock Radial Alignment Stitches (razor-sharp concentric lock at high Coherence)
  if (E.coherence > 0.48 && ringCount >= 2) {
    const lockA = clamp((E.coherence - 0.48) / 0.52, 0, 1);
    const spokes = E.tresillo > 0.36 ? 6 : (E.syncop > 0.34 ? 8 : (E.lyrical > 0.34 ? 4 : 2));
    const innerScale = Math.max(0.36, 1 - (ringCount - 1) * lerp(0.165, 0.135, E.aperture));
    for (let k = 0; k < spokes; k++) {
      const th = (k / spokes) * TAU - Math.PI * 0.5 + (E.tresillo > 0.36 ? tSec * (0.28 + E.tresillo * 0.62) / 3 : 0);
      const rIn = sampleContourRadius(th, rBase * innerScale, 0, tSec, beatPhase, E), rOut = sampleContourRadius(th, rBase, 0, tSec, beatPhase, E);
      strokeLine(gx + Math.cos(th) * rIn, gy + Math.sin(th) * rIn, gx + Math.cos(th) * rOut, gy + Math.sin(th) * rOut, mixInk(cohHot, lockA * 0.34), 0.85);
    }
  }

  // Eigenvector 4: Shimmering Orbital Phase Dots (Locked to Outer Contour vs Dispersed Cloud)
  const disp = Math.pow(1 - E.coherence, 1.35);
  for (const d of targetEigen.dots) {
    const ang = d.ang + disp * Math.sin(tSec * (0.9 + d.seed * 1.1) + d.seed * TAU) * 0.42;
    const rad = sampleContourRadius(ang, rBase, 0, tSec, beatPhase, E) + disp * (10 + d.seed * 34 + d.novel * 20) * (0.75 + 0.25 * Math.cos(tSec * 1.4 + d.seed * 12));
    const dotA = clamp((d.bar === 0 ? 0.86 : 0.44) * (0.52 + 0.48 * E.coherence + 0.28 * d.novel), 0.18, 0.96);
    fillCirc(gx + Math.cos(ang) * rad, gy + Math.sin(ang) * rad, (1.3 + d.vel * 1.4) * (d.bar === 0 ? 1.05 : 0.82), mixInk(Math.max(cohHot, heat.lobe * 0.4), dotA));
  }

  // Eigenvector 2: ARTIFICIAL HORIZON TILT, ECCENTRICITY & RESOLUTION TRAJECTORY VECTOR
  const horHot = heat.horizon, comX = gx + E.horizonShift * R * 0.42, comY = gy - E.horizonLift * R * 0.22;
  strokeLine(gx - 17, gy + 0.5, gx - 7, gy + 0.5, 'rgba(255,255,255,0.32)'); strokeLine(gx + 7, gy + 0.5, gx + 17, gy + 0.5, 'rgba(255,255,255,0.32)');
  strokeLine(gx + 0.5, gy - 5, gx + 0.5, gy - 2, 'rgba(255,255,255,0.24)'); strokeCirc(gx, gy, 2.5, 'rgba(255,255,255,0.36)', 0.9);
  const eccDist = Math.hypot(comX - gx, comY - gy);
  if (eccDist > 5) { ctx.setLineDash([2, 3]); strokeLine(gx, gy, comX, comY, mixInk(horHot, 0.30 + clamp(eccDist / (R * 0.5), 0, 1) * 0.25), 0.9); ctx.setLineDash([]); }

  const halfSpan = clamp(rBase * 0.68, 36, R * 0.72), cosA = Math.cos(E.tiltAngle), sinA = Math.sin(E.tiltAngle), nx = -sinA, ny = cosA;
  strokeLine(comX - cosA * halfSpan, comY - sinA * halfSpan, comX + cosA * halfSpan, comY + sinA * halfSpan, mixInk(horHot, 0.86), 1.35);
  for (const sgn of [-1, 1]) { const ex = comX + cosA * halfSpan * sgn, ey = comY + sinA * halfSpan * sgn; strokeLine(ex, ey, ex + nx * 5, ey + ny * 5, mixInk(horHot, 0.55)); }
  if (Math.abs(E.tiltAngle) > 0.04) {
    const ladA = clamp(Math.abs(E.tiltAngle) * 2.2, 0.14, 0.42);
    for (const off of [-14, 14]) { const lx = comX + nx * off, ly = comY + ny * off; strokeLine(lx - cosA * 14, ly - sinA * 14, lx - cosA * 5, ly - sinA * 5, mixInk(horHot, ladA), 0.85); strokeLine(lx + cosA * 5, ly + sinA * 5, lx + cosA * 14, ly + sinA * 14, mixInk(horHot, ladA), 0.85); }
  }
  fillCirc(comX, comY, 3.0, '#000'); strokeCirc(comX, comY, 5.2, mixInk(horHot, 0.94), 1.35); fillCirc(comX, comY, 1.9, mixInk(horHot, 0.96));

  if (Math.abs(E.trajectory) > 0.045) {
    const resolving = E.trajectory < 0, mag = clamp(Math.abs(E.trajectory) * 1.45, 0.25, 1.0), vLen = 18 + mag * 30;
    const aimA = resolving ? (eccDist > 8 ? Math.atan2(gy - comY, gx - comX) : Math.PI) : (E.tiltAngle - 0.24);
    const len = resolving ? Math.min(vLen, Math.max(16, eccDist * 0.85)) : vLen;
    const tx = comX + Math.cos(aimA) * len, ty = comY + Math.sin(aimA) * len;
    const cx = (comX + tx) * 0.5 + nx * (resolving ? 10 : -8), cy = (comY + ty) * 0.5 + ny * (resolving ? 10 : -8);
    ctx.strokeStyle = mixInk(horHot, 0.45 + mag * 0.42); ctx.lineWidth = 1.15;
    ctx.beginPath(); ctx.moveTo(comX, comY); ctx.quadraticCurveTo(cx, cy, tx, ty); ctx.stroke();
    const headA = Math.atan2(ty - cy, tx - cx);
    for (const s of [-1, 1]) strokeLine(tx, ty, tx - Math.cos(headA + s * 0.48) * 6.5, ty - Math.sin(headA + s * 0.48) * 6.5, mixInk(horHot, 0.72 + mag * 0.24), 1.15);
  }
  if (drag.mode === 'glyph') { const sx = gx + state.steer.gravity * R * 0.94, sy = gy - (state.steer.energy * 2 - 1) * R * 0.94; strokeCirc(sx, sy, 6.5, '#ff5a1f', 1.25); fillCirc(sx, sy, 2.0, '#ff5a1f'); }

  ctx.font = '9px ui-monospace, monospace';
  const lbl = (txt, x, y, al, bl, h, a) => { ctx.textAlign = al; ctx.textBaseline = bl; ctx.fillStyle = mixInk(h, a); ctx.fillText(txt, x, y); };
  lbl(E.regime, gx, gy - bzR - 10, 'center', 'bottom', Math.max(heat.lobe, heat.aperture), 0.34 + E.aperture * 0.34);
  lbl('STILL',  gx, gy + bzR + 10, 'center', 'top',    heat.aperture * (1 - E.aperture), 0.22 + (1 - E.aperture) * 0.24);
  lbl('i · HOME',   gx - bzR - 12, gy, 'right', 'middle', heat.horizon * (E.horizonShift < 0.2 ? 1 : 0), 0.26 + clamp(1 - E.horizonShift, 0, 1) * 0.32);
  lbl('bVI / bVII', gx + bzR + 12, gy, 'left',  'middle', heat.horizon * (E.horizonShift > 0.2 ? 1 : 0), 0.26 + clamp(E.horizonShift, 0, 1) * 0.42);
  lbl(E.coherence > 0.62 ? 'PHASE-LOCK' : (E.coherence < 0.35 ? 'DISPERSED' : 'COHERENCE'), gx + bzR * 0.74, gy - bzR * 0.74 - 4, 'left', 'bottom', cohHot, 0.22 + cohHot * 0.52);
}

// --- 60 FPS Main Loop ---
seedInitialPast();
let lastFrame = performance.now(), keySteerAcc = 0;
const SMOOTH_KEYS = ['cantus','lyrical','tresillo','syncop','dft2','dft3','dft4','dft6','dft8','chiral','horizonShift','horizonLift','tiltAngle','trajectory','aperture','ringCount','density','coherence'];

(function frame(nowPerf) {
  const dt = Math.min(0.05, (nowPerf - lastFrame) / 1000), tSec = nowPerf * 0.001; lastFrame = nowPerf;
  if (keysDown.size && (keySteerAcc += dt) >= 0.045) {
    const sDt = keySteerAcc; keySteerAcc = 0;
    const dE = ((keysDown.has('w') ? 1 : 0) - (keysDown.has('s') ? 1 : 0)) * sDt * 0.95;
    const dG = ((keysDown.has('d') ? 1 : 0) - (keysDown.has('a') ? 1 : 0)) * sDt * 1.45;
    const dC = ((keysDown.has('e') || keysDown.has('i') ? 1 : 0) - (keysDown.has('q') || keysDown.has('k') ? 1 : 0)) * sDt * 0.95;
    const dR = ((keysDown.has('l') ? 1 : 0) - (keysDown.has('j') ? 1 : 0)) * sDt * 1.35;
    applySteer({ energy: dE ? state.steer.energy + dE : undefined, gravity: dG ? state.steer.gravity + dG : undefined, coherence: dC ? state.steer.coherence + dC : undefined, resolveBias: dR ? state.steer.resolveBias + dR : undefined }, dG ? Math.sign(dG) * 0.5 : 0);
  }
  const curStep = getCurrentStep(), cool = dt / (FLASH_MS / 1000), sm = 1 - Math.exp(-dt * 12.5);
  for (let i = state.pastNotes.length - 1; i >= 0; i--) { const n = state.pastNotes[i]; if (!n.firedVisual && curStep >= n.step) { n.firedVisual = true; triggerResonator(n.noteIdx, n.vel, n.dur, Boolean(n.echoLocked)); } }
  for (const k of ['lobe','horizon','aperture','coherence']) heat[k] = Math.max(0, heat[k] - cool);
  for (const k of SMOOTH_KEYS) dispEigen[k] = lerp(dispEigen[k], targetEigen[k], sm);
  dispEigen.regime = targetEigen.regime;

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawPastConstellation(curStep); drawPeekGhost(curStep, nowPerf); drawNowHorizon(dt, nowPerf); drawFutureAttitudeGlyph(curStep, tSec);
  requestAnimationFrame(frame);
})(lastFrame);
</script>
