// --- Synthetic D Kurd Web Audio Handpan Voice + Dry Detent Micro-Clicks ---

}

// --- Musical State, Causal Ripples & Eigenvector Profile Buffers ---
const state = {
  tension: 0, motion: 0, memory: 0.56, showScore: false, scoreBlend: 0,
  steerHotPerf: -9999, memHotPerf: -9999, diffPerf: -9999,
  playing: false, playheadStep: 0, anchorStep: 0, anchorAudioTime: 0,
  nextSchedStep: 0, nextId: 1, seed: 29, lastUserPitch: 0,
  pastNotes: [], futureNotes: [], activeHolds: new Map(),

const loci = NOTES.map(() => ({ glow: 0, heat: 0, damp: 1.8 }));
const blooms = [], ripples = [];

const allocProfile = n => ({
  spine: new Float32Array(n), halfW: new Float32Array(n),
  ribAmp: new Float32Array(n), ribFreq: new Float32Array(n),
  coh: new Float32Array(n), heat: new Float32Array(n),

let hasGhost = false;

const getCurrentStep = () =>
  (!state.playing || !actx) ? state.playheadStep : state.anchorStep + Math.max(0, (actx.currentTime - state.anchorAudioTime) / TATUM);

function triggerResonator(idx, vel, durSteps, hot = false) {
  const loc = loci[idx];
  loc.glow = clamp(Math.max(loc.glow * 0.4, 0.48 + vel * 0.52), 0, 1);
  loc.damp = clamp(3.5 / (0.65 + durSteps * 0.46), 0.65, 3.5);

  blooms.push({ idx, vel, dur: durSteps, bornPerf: performance.now(), lifeMs: clamp(360 + durSteps * 280, 420, 2600) * (idx === 0 ? 1.16 : 1.0), hot });
  if (blooms.length > 22) blooms.shift();
}

// --- Real 4-Bar D Kurd Generator (Monotonic Continuous Steering) ---
function noteLhlSyncopation(step, dur) {
  const pos = ((step % 16) + 16) % 16, onsetW = METRIC_W[pos];
  let maxCross = onsetW;
  for (let k = 1; k < dur; k++) { const w = METRIC_W[(pos + k) & 15]; if (w > maxCross) maxCross = w; }
  const tieSync = clamp((maxCross - onsetW) * 1.45, 0, 1);
  const offbeat = (pos & 1) === 1 ? 0.58 : (pos & 3) === 2 ? 0.24 : 0;
  return clamp(tieSync * 0.78 + offbeat * 0.45, 0, 1);
}

function pickHalfBarCell(barIdx, subIdx, effMotion, isCadence) {
  const target = clamp((effMotion + 1) * 0.5 - (isCadence && effMotion < 0.25 ? 0.16 : 0), 0, 1), sigma = 0.21;
  const weights = new Float32Array(CELLS_ORDERED.length);
  let sum = 0;
  for (let i = 0; i < CELLS_ORDERED.length; i++) {
    const d = CELLS_ORDERED[i].e - target;
    let w = Math.exp(-(d * d) / (2 * sigma * sigma));
    if (isCadence && subIdx === 1 && CELLS_ORDERED[i].c.some(v => v < 0) && effMotion < 0.45) w *= 1.55;
    weights[i] = w; sum += w;
  }
  let r = hash01(barIdx * 19 + subIdx * 7, state.seed, 101) * sum;
  for (let i = 0; i < CELLS_ORDERED.length; i++) { r -= weights[i]; if (r <= 0) return CELLS_ORDERED[i].c; }
  return CELLS_ORDERED[8].c;
}

function findPastNear(history, targetStep, tol = 1.6) {
  let best = null, bestD = tol;
  for (let i = history.length - 1; i >= 0; i--) {
    const d = Math.abs(history[i].step - targetStep);
    if (d < bestD) { best = history[i]; bestD = d; if (d < 0.35) break; }
  }
  return best;
}

function choosePitch(step, dur, barIdx, effT, prevPitch, prevInt, echo, rhythmEcho) {
  const pos = ((step % 16) + 16) % 16, M = state.memory, uEcho = hash01(step * 13 + 5, barIdx * 7, 404), steerYield = 1 - Math.abs(state.tension) * 0.58;
  if (echo && uEcho < clamp((M * 1.04 - 0.10) * (echo.source === 'user' ? 1.42 : steerYield) * echo.lagW, 0, 0.96)) {
    const shift = Math.abs(state.tension) > 0.45 && echo.source !== 'user' ? Math.round(state.tension * 2) : 0;

    let w = (FIELD_I[i] * wI + FIELD_BVI[i] * wBVI + FIELD_BVII[i] * wBVII) * Math.exp(-Math.pow((i - centerIdx) / 2.85, 2));

      if (effT <= 0.12 && (i === 0 || i === 4)) w *= 2.1 - effT;
      if (effT > 0.22 && (i === 2 || i === 3 || i === 7 || i === 8)) w *= 1.65;
    }
    if (prevPitch >= 0) {
      const d = i - prevPitch, ad = Math.abs(d);

function generateBar(barIdx, history, prevPitchIn, prevIntIn) {
  const barStart = barIdx * 16, phase = ((barIdx % 4) + 4) % 4, slots = [];
  const effT = clamp(state.tension + BAR_ARCH[phase] * (1 - Math.abs(state.tension) * 0.52), -1, 1);
  const effM = clamp(state.motion + (phase === 2 ? 0.14 : phase === 3 ? -0.16 : 0) * (1 - Math.abs(state.motion) * 0.55), -1, 1);

  if (rEchoProb > 0.05) {
    const srcStart = barStart - ((state.memory > 0.68 || (barIdx & 1) === 0) ? 16 : 32);

// --- 4 Visual Eigenvectors Computed Directly From Actual Note Buffers ---
const noteHorizNorm = noteIdx => clamp(((noteIdx - 4) / 4) * 0.72 + MODAL_PULL[noteIdx] * 0.34, -1.05, 1.05);

function smoothArray(arr, passes = 2) {
  const n = arr.length, tmp = new Float32Array(n);

function sampleEigenvectors(notes, startStep, spanSteps, N, prof) {

      const wf = Math.exp(-Math.pow((t - ev.step) / 3.0, 2)); spreadSum += wf * nx * nx; spreadW += wf; // 2) Body Width & Fullness

    strokeLine(geomCur.sx[k - 1], geomCur.y[k - 1], geomCur.sx[k], geomCur.y[k], mixInk(h, (0.82 + futProf.halfW[k] * 0.18) * f), 1.85 + h * 0.9);
  }
  const ck = geomCur.climaxK, cx = geomCur.sx[ck], cy = geomCur.y[ck];
  ctx.strokeStyle = mixInk(geomCur.heat[ck], 0.74); ctx.lineWidth = 1.0;
  ctx.beginPath(); ctx.moveTo(cx, cy - 4.5); ctx.lineTo(cx + 4.5, cy); ctx.lineTo(cx, cy + 4.5); ctx.lineTo(cx - 4.5, cy); ctx.closePath(); ctx.stroke();
  for (const r of ripples) {
    const p = (nowPerf - r.bornPerf) / r.lifeMs;
    if (p >= 0 && p <= 1) { const rk = clamp(Math.round(p * N_FUT), 0, N_FUT); strokeLine(geomCur.lx[rk] - 8, geomCur.y[rk], geomCur.rx[rk] + 8, geomCur.y[rk], `rgba(255,90,31,${(0.65 * (1 - p)).toFixed(3)})`, 1.3); }
  }
  // 5) Secondary Reference Only: Whisper-faint (9-12%) internal Future note sparks (or 72% Score Peek)
  const sb = state.scoreBlend;
  for (const n of state.futureNotes) {
    const y0 = stepToY(n.step, curStep), y1 = stepToY(n.step + n.dur, curStep);
    if (y0 < geo.nowY + 2 || y0 > H - geo.padBot) continue;
    const x = geo.locusX[n.noteIdx], f = edgeFadeY(y0), h = clamp(1 - (nowPerf - n.flashPerf) / DIFF_MS, 0, 1);
    const baseA = lerp(0.085 + n.vel * 0.035, 0.56 + n.vel * 0.34, sb);
    strokeLine(x, y0, x, Math.min(H - geo.padBot, y1 - 1.5), mixInk(h * (0.4 + sb * 0.6), baseA * 0.72 * f), lerp(0.8, 1.35, sb));
    fillCirc(x, y0, lerp(1.6, 2.7 + n.vel * 0.9, sb), mixInk(h * (0.5 + sb * 0.5), baseA * f));
  }
}

const pastX = new Float32Array(N_PAST + 1), pastY = new Float32Array(N_PAST + 1), pastHW = new Float32Array(N_PAST + 1), pastD = new Float32Array(N_PAST + 1);
function drawPastWakeTrace(curStep, allNotes) {
  sampleEigenvectors(allNotes, curStep - geo.pastSteps, geo.pastSteps, N_PAST, pastProf);
  for (let k = 0; k <= N_PAST; k++) {
    const age = (1 - k / N_PAST) * geo.pastSteps;
    pastY[k] = stepToY(curStep - age, curStep); pastD[k] = Math.exp(-age * 0.058);
    pastX[k] = spineToX(pastProf.spine[k]); pastHW[k] = pastProf.halfW[k] * geo.maxHalfW * 0.44 * pastD[k];
  }
  ctx.beginPath();
  for (let k = 0; k <= N_PAST; k++) k ? ctx.lineTo(pastX[k] - pastHW[k], pastY[k]) : ctx.moveTo(pastX[k] - pastHW[k], pastY[k]);
  for (let k = N_PAST; k >= 0; k--) ctx.lineTo(pastX[k] + pastHW[k], pastY[k]);
  ctx.closePath();
  const pg = ctx.createLinearGradient(0, geo.padTop, 0, geo.nowY);
  pg.addColorStop(0.0, 'rgba(255,255,255,0.005)'); pg.addColorStop(1.0, 'rgba(255,255,255,0.068)');
  ctx.fillStyle = pg; ctx.fill();

  for (let k = 1; k <= N_PAST; k++) {
    const d1 = pastD[k], f = edgeFadeY(pastY[k]), fc = `rgba(255,255,255,${(0.24 * d1 * f).toFixed(3)})`;
    strokeLine(pastX[k - 1], pastY[k - 1], pastX[k], pastY[k], `rgba(255,255,255,${(0.66 * d1 * f).toFixed(3)})`, 1.4 * d1 + 0.35);
    strokeLine(pastX[k - 1] - pastHW[k - 1], pastY[k - 1], pastX[k] - pastHW[k], pastY[k], fc, 0.8);
    strokeLine(pastX[k - 1] + pastHW[k - 1], pastY[k - 1], pastX[k] + pastHW[k], pastY[k], fc, 0.8);
  }
  for (const n of state.pastNotes) {
    const dur = n.holding ? Math.max(0.6, curStep - n.step) : n.dur, age = curStep - n.step;
    if (age < 0 || age > geo.pastSteps + 4) continue;
    const y0 = stepToY(n.step, curStep), y1 = Math.min(geo.nowY, stepToY(n.step + dur, curStep));
    if (y1 < geo.padTop) continue;
    const x = geo.locusX[n.noteIdx], f = edgeFadeY(y0) * clamp(1 - age / (geo.pastSteps * 1.15), 0.1, 1), h = n.source === 'user' ? 0.85 : 0;
    strokeLine(x, y0, x, y1, mixInk(h, (0.34 + n.vel * 0.32) * f), 1.15);
    fillCirc(x, y0, (n.noteIdx === 0 ? 3.1 : 2.3) + n.vel * 0.95, mixInk(h, 0.92 * f));
  }
}

function drawNowHorizonAndTactileCues(dt, nowPerf) {
  const y = geo.nowY, xL = geo.fieldL - 36, xR = geo.fieldR + 36;
  for (const loc of loci) { loc.glow = Math.max(0, loc.glow * Math.exp(-dt * loc.damp)); loc.heat = Math.max(0, loc.heat - dt * 2.5); }
  for (let i = blooms.length - 1; i >= 0; i--) if (nowPerf - blooms[i].bornPerf >= blooms[i].lifeMs) blooms.splice(i, 1);
  for (let i = ripples.length - 1; i >= 0; i--) if (nowPerf - ripples[i].bornPerf >= ripples[i].lifeMs) ripples.splice(i, 1);

  for (const b of blooms) {
    const age = nowPerf - b.bornPerf, p = clamp(age / b.lifeMs, 0, 1), e = Math.pow(1 - p, 1.8);
    const rx = 5 + Math.pow(p, 0.72) * (24 + b.dur * 10) * (0.68 + b.vel * 0.42) * (b.idx === 0 ? 1.22 : 1);
    ctx.strokeStyle = mixInk(b.hot ? clamp(1 - age / DIFF_MS, 0, 1) : 0, e * 0.65); ctx.lineWidth = 0.8 + e * 0.9;
    ctx.beginPath(); ctx.ellipse(geo.locusX[b.idx], y, rx, rx * 0.56, 0, 0, Math.PI * 2); ctx.stroke();
  }

  strokeLine(xL, y + 0.5, xR, y + 0.5, 'rgba(255,255,255,0.44)', 1.0);
  ctx.textAlign = 'center';
  for (let i = 0; i < 9; i++) {
    const x = geo.locusX[i], loc = loci[i], hov = hover.locusIdx === i;
    strokeLine(x + 0.5, y - 5, x + 0.5, y + 5, mixInk(loc.heat, 0.24 + loc.glow * 0.68 + (hov ? 0.34 : 0)));
    if (i === 0 || loc.glow > 0.08 || hov) strokeCirc(x, y, (i === 0 ? 6 : 4.8) + loc.glow * 3.2, mixInk(loc.heat, (i === 0 ? 0.26 : 0) + loc.glow * 0.7 + (hov ? 0.38 : 0)), 0.9);
    fillCirc(x, y, (i === 0 ? 2.6 : 1.9) + loc.glow * 2.0 + (hov ? 0.9 : 0), mixInk(loc.heat, 0.58 + loc.glow * 0.42));
    ctx.font = '9px ui-monospace, monospace'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = mixInk(loc.heat, 0.22 + loc.glow * 0.72 + (hov ? 0.36 : 0) + state.scoreBlend * 0.18);
    ctx.fillText(NOTES[i].name, x, y - 9);
  }

  ctx.font = '8.5px ui-monospace, monospace'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.textBaseline = 'bottom'; ctx.fillText('PAST', xR + 8, y - 6);
  ctx.textBaseline = 'top';    ctx.fillText('FUTURE · 4 BARS', xR + 8, y + 6);

  const sHot = drag.mode === 'sculpt' ? 1 : clamp(1 - (nowPerf - state.steerHotPerf) / 900, 0, 1);
  const mHot = clamp(1 - (nowPerf - state.memHotPerf) / 900, 0, 1), midY = (geo.nowY + H - geo.padBot) * 0.5;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'right'; ctx.fillStyle = mixInk(state.tension < -0.1 ? sHot : 0, 0.13 + sHot * 0.48); ctx.fillText('← i HOME', xL - 10, midY);
  ctx.textAlign = 'left';  ctx.fillStyle = mixInk(state.tension > 0.1 ? sHot : 0, 0.13 + sHot * 0.48);  ctx.fillText('bVI·bVII →', xR + 10, midY);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';    ctx.fillStyle = mixInk(state.motion > 0.1 ? sHot : 0, 0.11 + sHot * 0.45);  ctx.fillText('▲ RIBBED SYNCOPATION', geo.cx, geo.nowY + 11);
  ctx.textBaseline = 'bottom'; ctx.fillStyle = mixInk(state.motion < -0.1 ? sHot : 0, 0.11 + sHot * 0.45); ctx.fillText('▼ SMOOTH CANTUS', geo.cx, H - 10);
  if (mHot > 0.02) {
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillStyle = mixInk(mHot, 0.78 * mHot);
    ctx.fillText(state.memory >= 0.5 ? 'TWIN-SHELL ECHO' : 'DISPERSED DISCOVERY', xR, H - 10);
  }
  if (drag.mode === 'sculpt') {
    strokeCirc(drag.startX, drag.startY, 4, 'rgba(255,90,31,0.55)', 1);
    strokeLine(drag.startX, drag.startY, drag.curX, drag.curY, 'rgba(255,90,31,0.72)', 1.2);
    fillCirc(drag.curX, drag.curY, 3.2, '#ff5a1f');
  }
}

// --- 60 FPS Loop ---
seedIntroHistory();
recomputeFuture(false);

let lastFrame = performance.now(), keySteerAcc = 0.04;
(function frame(nowPerf) {
  const dt = Math.min(0.05, (nowPerf - lastFrame) / 1000);
  lastFrame = nowPerf;
  const curStep = getCurrentStep();

  const dx = ((keysDown.has('KeyD') || keysDown.has('KeyL') || keysDown.has('ArrowRight')) ? 1 : 0) - ((keysDown.has('KeyA') || keysDown.has('KeyJ') || keysDown.has('ArrowLeft')) ? 1 : 0);
  const dy = ((keysDown.has('KeyW') || keysDown.has('KeyI') || keysDown.has('ArrowUp')) ? 1 : 0) - ((keysDown.has('KeyS') || keysDown.has('KeyK') || keysDown.has('ArrowDown')) ? 1 : 0);
  const dm = (keysDown.has('KeyE') ? 1 : 0) - (keysDown.has('KeyQ') ? 1 : 0);
  if (dx || dy || dm) {
    keySteerAcc += dt;
    if (keySteerAcc >= 0.032) {
      if (dx || dy) applySteering(state.tension + dx * keySteerAcc * 1.15, state.motion + dy * keySteerAcc * 1.15, true);
      if (dm) applyMemory(state.memory + dm * keySteerAcc * 0.85, true);
      keySteerAcc = 0;
    }
  } else keySteerAcc = 0.04;

  for (let i = state.pastNotes.length - 1; i >= 0; i--) {
    const n = state.pastNotes[i];
    if (!n.firedVisual && curStep >= n.step) { n.firedVisual = true; triggerResonator(n.noteIdx, n.vel, n.dur, false); }
  }
  const heatDecay = Math.exp(-dt / (DIFF_MS * 0.00055));
  for (let k = 0; k <= N_FUT; k++) futProf.heat[k] = futProf.heat[k] > 0.004 ? futProf.heat[k] * heatDecay : 0;
  state.scoreBlend += ((state.showScore ? 1 : 0) - state.scoreBlend) * Math.min(1, dt * 11);

  const allNotes = state.pastNotes.concat(state.futureNotes);
  sampleEigenvectors(allNotes, curStep, FUT_STEPS, N_FUT, futProf);

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawMetricHorizonGrid(curStep);
  drawPastWakeTrace(curStep, allNotes);
  drawFutureGestaltSilhouette(curStep, nowPerf);
  drawNowHorizonAndTactileCues(dt, nowPerf);
  requestAnimationFrame(frame);
})(lastFrame);
</script>
</body>
