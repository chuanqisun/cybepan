<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>16 — Vertical Metric Tree &amp; Breath Pendulum</title>
  <style>
    :root {
      --bg: #000; --ink-1: #fff; --ink-2: rgba(255,255,255,.64);
      --ink-3: rgba(255,255,255,.35); --ink-4: rgba(255,255,255,.16);
      --signal: #ff5a1f;
      --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--ink-1);
      font: 11px var(--mono); font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased; user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #hud {
      position: fixed; top: 12px; left: 16px; right: 16px; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      pointer-events: none; letter-spacing: .05em; color: var(--ink-3);
      white-space: nowrap; gap: 16px;
    }
    #hud .strip { overflow: hidden; text-overflow: ellipsis; }
    #hud b { color: var(--ink-1); font-weight: 600; }
    #hud .ctl { display: inline-flex; align-items: center; gap: 8px; pointer-events: auto; }
    .pill {
      appearance: none; background: transparent; color: var(--ink-2);
      border: 1px solid var(--ink-4); font: inherit; letter-spacing: .06em;
      padding: 3px 9px; border-radius: 99px; cursor: pointer;
      transition: border-color .16s ease, color .16s ease, background .16s ease;
    }
    .pill:hover { border-color: var(--ink-2); color: var(--ink-1); }
    .pill.on { border-color: var(--ink-1); color: var(--bg); background: var(--ink-1); }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud">
    <div class="strip"><b>16</b> · SPACE play · DRAG puck (time × gravity) · L lock motif · 1-9 strike</div>
    <div class="ctl">
      <span id="status-readout">LYRICAL · 03.1 · 84 BPM</span>
      <button class="pill" id="btn-play" type="button">PLAY</button>
      <button class="pill" id="btn-lock" type="button">ECHO ○</button>
    </div>
  </div>
  <script type="module">
    'use strict';

    // ==================== 1. D KURD SCALE, GTTM METRIC & LHL RHYTHM THEORY ====================
    const BPM = 84, STEP_SEC = 60 / BPM / 4; // Strict 16th-note quantized grid
    const NOTES = ['D3', 'A3', 'Bb3', 'C4', 'D4', 'E4', 'F4', 'G4', 'A4'];
    const FREQS = [146.83, 220.00, 233.08, 261.63, 293.66, 329.63, 349.23, 392.00, 440.00];
    const DEGREES = ['^1', '^5', '^b6', '^b7', '^1', '^2', '^b3', '^4', '^5'];
    const PANS = [-0.48, -0.36, -0.24, -0.12, 0.0, 0.12, 0.24, 0.36, 0.48];
    const CHORDS = {
      i: [0, 1, 4, 6, 8], iv: [0, 2, 4, 7], III: [1, 3, 6, 8],
      v: [1, 3, 5, 8], bVI: [2, 4, 6, 8], bVII: [3, 5, 7, 8]
    };

    // GTTM Metric Hierarchy (Lerdahl & Jackendoff): Beat1=4, Beat3=3, Beats2/4=2, 8ths=1, 16ths=0
    function metricWeight(step) {
      const s = ((step % 16) + 16) % 16;
      return s === 0 ? 4 : s === 8 ? 3 : s % 4 === 0 ? 2 : s % 2 === 0 ? 1 : 0;
    }

    // LHL Syncopation Score (Longuet-Higgins & Lee): strongest crossed beat minus onset level
    function lhlSyncopation(onset, dur) {
      const w0 = metricWeight(onset);
      let maxCross = -1;
      for (let k = 1; k < dur; k++) maxCross = Math.max(maxCross, metricWeight(onset + k));
      return maxCross > w0 ? maxCross - w0 : 0;
    }

    // 4 Continuous Music-Theory Regimes (negative = structural rest; {d, tie:true} = barline anticipation)
    const REGIMES = [
      { name: 'CANTUS', minX: 0.00, maxX: 0.25, patterns: [
        [8, 8], [8, 4, -4], [6, 2, 8], [6, 2, 6, -2], [4, 4, 8], [4, 4, 6, 2]
      ]},
      { name: 'LYRICAL', minX: 0.25, maxX: 0.55, patterns: [
        [4, 2, 2, 8], [2, 4, 2, 6, -2], [4, 2, 2, 4, 4], [2, 2, 4, 6, 2], [2, 2, 4, 2, 2, 4], [3, 1, 4, 2, 2, 4]
      ]},
      { name: 'TRESILLO', minX: 0.55, maxX: 0.80, patterns: [
        [8, 3, 3, 2], [3, 3, 4, 2, 4], [3, 3, 2, 4, 2, -2], [3, 3, 2, 3, 3, 2], [2, 3, 3, 3, 3, 2], [3, 3, 2, 2, 1, 1, 4]
      ]},
      { name: 'SYNCOPATE', minX: 0.80, maxX: 1.00, patterns: [
        [2, 2, 3, 3, 1, 1, 2, 2], [1, 1, 2, 3, 3, 2, 1, 1, 2], [2, 1, 1, 3, 5, 1, 1, 2],
        [1, 1, 2, 3, 3, 1, 3, 1, 1], [3, 3, 1, 3, 2, 1, 2, { d: 3, tie: true }],
        [1, 1, 2, 2, 1, 5, 2, 1, { d: 3, tie: true }]
      ]}
    ];

    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const regimeForX = (x) => x < 0.25 ? REGIMES[0] : x < 0.55 ? REGIMES[1] : x < 0.80 ? REGIMES[2] : REGIMES[3];

    function seededRand(seed) {
      let s = (seed * 1664525 + 1013904223) >>> 0;
      return () => (((s = (s * 1664525 + 1013904223) >>> 0) >>> 8) / 16777216);
    }

    function selectPattern(x, barIdx, isCadence) {
      const reg = regimeForX(x);
      const t = clamp((x - reg.minX) / Math.max(0.001, reg.maxX - reg.minX), 0, 0.9999);
      const alt = ((barIdx * 7 + 3) % 3 === 0) ? (barIdx % 2 === 0 ? 1 : -1) : 0;
      let pat = reg.patterns[clamp(Math.floor(t * reg.patterns.length) + alt, 0, reg.patterns.length - 1)];
      // GTTM Cadential Agogic Lengthening on Bar 4 of every 4-bar period
      if (isCadence && x < 0.72) pat = x < 0.25 ? [6, 2, 8] : x < 0.55 ? [4, 2, 2, 8] : [3, 3, 2, 8];
      return pat;
    }

    // ==================== 2. SINGLE CLEAN SYNTHETIC HANDPAN VOICE ====================
    let audioCtx = null, dryBus = null, wetBus = null, uiBus = null, noiseBuf = null;

    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -10; comp.ratio.value = 3.2; comp.attack.value = 0.004; comp.release.value = 0.14;
        comp.connect(audioCtx.destination);
        dryBus = audioCtx.createGain(); dryBus.gain.value = 0.86; dryBus.connect(comp);
        uiBus = audioCtx.createGain(); uiBus.gain.value = 0.34; uiBus.connect(audioCtx.destination);

        const sr = audioCtx.sampleRate;
        noiseBuf = audioCtx.createBuffer(1, Math.floor(sr * 0.06), sr);
        const nd = noiseBuf.getChannelData(0);
        for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sr * 0.012));

        const irLen = Math.floor(sr * 1.65), ir = audioCtx.createBuffer(2, irLen, sr);
        for (let c = 0; c < 2; c++) {
          const d = ir.getChannelData(c);
          for (let i = 0; i < irLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.7) * 0.42;
        }
        const conv = audioCtx.createConvolver(); conv.buffer = ir;
        const revLp = audioCtx.createBiquadFilter(); revLp.type = 'lowpass'; revLp.frequency.value = 2600;
        wetBus = audioCtx.createGain(); wetBus.gain.value = 0.28;
        wetBus.connect(conv); conv.connect(revLp); revLp.connect(comp);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playHandpan(lane, when, vel = 0.8, durSteps = 4) {
      ensureAudio();
      const freq = FREQS[lane]; if (!freq) return;
      const t0 = Math.max(audioCtx.currentTime + 0.002, when), isDing = lane === 0;
      const dF = clamp(durSteps, 1, 8);
      // Release mapped directly to quantized duration d (1 crisp -> 8 lush sustained bloom)
      const tau1 = (0.19 + 0.29 * Math.pow(dF, 0.94)) * (isDing ? 1.18 : 1.0) * Math.pow(220 / freq, 0.18);

      const vg = audioCtx.createGain(); vg.gain.setValueAtTime(clamp(vel, 0.12, 1.0) * 0.44, t0);
      const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass';
      const cut = Math.min(7200, (1900 + 2600 * vel) * (0.85 + 0.04 * dF));
      lp.frequency.setValueAtTime(cut, t0);
      lp.frequency.exponentialRampToValueAtTime(Math.max(680, cut * 0.42), t0 + tau1 * 2.4);

      if (audioCtx.createStereoPanner) {
        const sp = audioCtx.createStereoPanner(); sp.pan.value = PANS[lane] || 0;
        vg.connect(lp); lp.connect(sp); sp.connect(dryBus); sp.connect(wetBus);
      } else { vg.connect(lp); lp.connect(dryBus); lp.connect(wetBus); }

      const mode = (hz, amp, rise, tau) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(hz * (1 + 0.0028 * vel), t0);
        o.frequency.exponentialRampToValueAtTime(hz, t0 + 0.042);
        g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(amp, t0 + rise);
        g.gain.setTargetAtTime(0.0001, t0 + rise, tau);
        o.connect(g); g.connect(vg); o.start(t0); o.stop(t0 + Math.min(5.2, rise + tau * 4.8));
      };
      // Tonefield eigenmodes: fundamental + beating pair + delayed 2f0 & 3f0 bloom
      mode(freq, 0.62, 0.006, tau1);
      mode(freq + 0.68, 0.21, 0.011, tau1 * 0.94);
      mode(freq * 2.001, 0.24 * (0.55 + 0.5 * vel), 0.018, tau1 * 0.58);
      mode(freq * 2.999, 0.11 * (0.45 + 0.6 * vel), 0.026, tau1 * 0.36);

      // Soft skin mallet impulse + Helmholtz body resonance on Ding/low
      const n = audioCtx.createBufferSource(); n.buffer = noiseBuf;
      const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = isDing ? 440 : 720; bp.Q.value = 1.3;
      const ng = audioCtx.createGain(); ng.gain.setValueAtTime(0.20 * vel, t0); ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.016);
      n.connect(bp); bp.connect(ng); ng.connect(vg); n.start(t0); n.stop(t0 + 0.024);

      if (isDing || lane === 1) {
        const bo = audioCtx.createOscillator(), bg = audioCtx.createGain();
        bo.type = 'sine'; bo.frequency.setValueAtTime(isDing ? 96 : 112, t0); bo.frequency.exponentialRampToValueAtTime(76, t0 + 0.085);
        bg.gain.setValueAtTime(0.0001, t0); bg.gain.linearRampToValueAtTime((isDing ? 0.28 : 0.11) * vel, t0 + 0.007);
        bg.gain.exponentialRampToValueAtTime(0.0001, t0 + (isDing ? 0.22 : 0.12));
        bo.connect(bg); bg.connect(vg); bo.start(t0); bo.stop(t0 + 0.25);
      }
    }

    function playDetent(str = 0.65) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      const t0 = audioCtx.currentTime + 0.001, o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(1480 + str * 420, t0); o.frequency.exponentialRampToValueAtTime(420, t0 + 0.012);
      g.gain.setValueAtTime(0.09 * str, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.014);
      o.connect(g); g.connect(uiBus); o.start(t0); o.stop(t0 + 0.018);
    }

    // ==================== 3. STATE, RESONATOR PORTALS & HEURISTIC ENGINE ====================
    const state = {
      playing: false, nowStep: 32.0, nextSchedStep: 32, nextSchedTime: 0,
      puckX: 0.38, puckY: 0.34, draggingPuck: false, puckSignal: 0,
      hoverPortal: -1, lastDetentKey: '', echoLock: null,
      lastStepApex: -1, pendulumApexGlow: 0, pendulumBreath: 0,
      bars: new Map(), humanNotes: []
    };

    // 9 Discrete Resonator Portals along NOW with Chladni (0,1), (1,1) 2f0, (2,1) 3f0 eigenmodes
    const portals = NOTES.map((name, i) => ({
      name, deg: DEGREES[i], idx: i, e0: 0, e2: 0, e3: 0,
      p0: i * 0.7, p2: i * 1.1, p3: i * 1.6, rot: (i * Math.PI) / 9,
      flash: 0, durTau: 0.45, ripples: []
    }));

    function chordForBar(barIdx, y) {
      const pos = ((barIdx % 4) + 4) % 4;
      if (y < 0.28) return ['i', 'i', 'iv', 'i'][pos];
      if (y < 0.68) return ['i', 'bVI', 'bVII', 'i'][pos];
      return ['bVI', 'bVII', 'v', 'bVII'][pos];
    }

    // Narmour Implication-Realization + Harmonic Gravity pitch selection
    function pickNextLane(prevLane, prevInt, chordPool, y, stepInBar, dur, isCadence, rng) {
      const w = metricWeight(stepInBar), targetLane = lerp(1.5, 6.9, y);
      if (isCadence && stepInBar >= 8 && dur >= 6 && y < 0.72) return y < 0.34 ? 0 : (rng() < 0.55 ? 0 : 4);
      if (stepInBar === 0) {
        if (y < 0.36) return rng() < 0.75 ? 0 : 4;
        if (y < 0.70) return chordPool[0];
        return chordPool[Math.min(chordPool.length - 1, Math.floor(rng() * 2) + 1)];
      }
      let bestLane = chordPool[0], bestScore = -1e9;
      for (let lane = 0; lane < 9; lane++) {
        const iv = lane - prevLane, aIv = Math.abs(iv);
        let sc = chordPool.includes(lane) ? ((w >= 2 || dur >= 4) ? 3.2 : 1.1) : -0.8;
        sc -= Math.abs(lane - targetLane) * (0.62 + (w >= 2 ? 0.25 : 0));
        if (Math.abs(prevInt) >= 3) {
          const opp = Math.sign(iv) === -Math.sign(prevInt);
          sc += opp && (aIv === 1 || aIv === 2) ? 3.6 : (!opp && aIv >= 2 ? -2.4 : 0);
        } else if (Math.abs(prevInt) > 0) {
          sc += (Math.sign(iv) === Math.sign(prevInt) && aIv <= 2) ? 1.6 : (aIv <= 2 ? 0.9 : 0);
        }
        if (dur <= 2 && aIv > 3) sc -= 2.3;
        if (aIv === 0) sc -= (dur <= 2 ? 2.4 : 1.1);
        if (lane === 0 && w < 2 && dur <= 2) sc -= 1.8;
        sc += (rng() - 0.5) * 1.45;
        if (sc > bestScore) { bestScore = sc; bestLane = lane; }
      }
      return bestLane;
    }

    function formatPartition(events, carryIn) {
      const L = carryIn > 0 ? [`~${carryIn}`] : [], R = [];
      for (const ev of events) {
        const tag = ev.rest ? `r${ev.dur}` : `${ev.dur}${ev.tiesMid || ev.tiesBar ? '⌒' : ''}`;
        (ev.stepInBar < 8 ? L : R).push(tag);
      }
      return `${L.join('·') || '—'} | ${R.join('·') || '—'}`;
    }

    function buildBar(barIdx, opts = {}) {
      const x = opts.x ?? state.puckX, y = opts.y ?? state.puckY;
      const flashMs = opts.flash ? performance.now() : 0;
      const prevBar = state.bars.get(barIdx - 1), carryIn = prevBar ? prevBar.overhang : 0;
      const isCadence = ((barIdx % 4) + 4) % 4 === 3;
      const chordKey = chordForBar(barIdx, y), chordPool = CHORDS[chordKey];
      const rng = seededRand(barIdx * 977 + Math.round(x * 19) * 31 + Math.round(y * 11) * 13);

      let prevLane = 0, prevInt = 0;
      if (prevBar && prevBar.notes.length) {
        const last = prevBar.notes[prevBar.notes.length - 1];
        prevLane = last.lane;
        if (prevBar.notes.length >= 2) prevInt = last.lane - prevBar.notes[prevBar.notes.length - 2].lane;
      }

      const rawPattern = state.echoLock ? state.echoLock.tokens : selectPattern(x, barIdx, isCadence);
      const events = [], notes = [];
      let cursor = 0, overhang = 0, totalSync = 0, noteOrder = 0;

      for (const tok of rawPattern) {
        if (cursor >= 16) break;
        const isObj = typeof tok === 'object', isRest = !isObj && tok < 0;
        const d = isObj ? tok.d : Math.abs(tok), tieOut = isObj && tok.tie;
        const evStep = cursor, advance = tieOut ? (16 - evStep) : Math.min(d, 16 - evStep);
        cursor += advance;

        let startStep = evStep, effDur = tieOut ? d : advance;
        if (startStep < carryIn) {
          const trim = carryIn - startStep;
          if (trim >= effDur) continue;
          startStep = carryIn; effDur -= trim;
        }
        if (effDur <= 0) continue;

        const tiesMid = !isRest && startStep < 8 && (startStep + effDur) > 8;
        const tiesBar = !isRest && (startStep + effDur) > 16;
        if (tiesBar) overhang = (startStep + effDur) - 16;
        events.push({ stepInBar: startStep, dur: effDur, rest: isRest, tiesMid, tiesBar });

        if (!isRest) {
          let lane;
          if (state.echoLock && noteOrder < state.echoLock.lanes.length) {
            lane = clamp(state.echoLock.lanes[noteOrder] + Math.round((y - state.echoLock.baseY) * 3), 0, 8);
          } else {
            lane = pickNextLane(prevLane, prevInt, chordPool, y, startStep, effDur, isCadence, rng);
          }
          const w = metricWeight(startStep), sync = lhlSyncopation(startStep, effDur);
          totalSync += sync;
          const agogic = effDur >= 6 ? 0.14 : effDur >= 4 ? 0.06 : 0;
          const vel = clamp(0.56 + w * 0.075 + agogic + (sync > 0 ? 0.08 : 0) + (rng() - 0.5) * 0.08, 0.36, 0.98);
          notes.push({
            barIdx, onsetStep: barIdx * 16 + startStep, stepInBar: startStep, dur: effDur,
            lane, vel, sync, scheduled: false, flashMs
          });
          prevInt = lane - prevLane; prevLane = lane; noteOrder++;
        }
      }

      const links = state.echoLock
        ? [{ fromBar: state.echoLock.sourceBarIdx, kind: 'lock', weight: 0.92 }]
        : [
            ...(barIdx >= 1 ? [{ fromBar: barIdx - 1, kind: 'echo', weight: 0.44 }] : []),
            ...(barIdx >= 2 ? [{ fromBar: barIdx - 2, kind: 'antecedent', weight: 0.32 }] : [])
          ];

      const bar = {
        barIdx, startStep: barIdx * 16, tokens: rawPattern, carryIn, overhang, chordKey,
        events, notes, syncScore: totalSync, label: formatPartition(events, carryIn),
        links, flashMs, xSnap: x, ySnap: y
      };
      state.bars.set(barIdx, bar);
      return bar;
    }

    function ensureTimeline() {
      const curBar = Math.floor(state.nowStep / 16);
      for (let b = Math.max(0, curBar - 4); b <= curBar + 3; b++) if (!state.bars.has(b)) buildBar(b);
      for (const k of state.bars.keys()) {
        if (k < curBar - 8 && (!state.echoLock || k !== state.echoLock.sourceBarIdx)) state.bars.delete(k);
      }
      state.humanNotes = state.humanNotes.filter(n => n.onsetStep > state.nowStep - 64);
    }

    function revoiceFuture(flash = true) {
      const curBar = Math.floor(state.nowStep / 16), minSafe = Math.ceil(state.nowStep) + 1;
      for (let b = curBar; b <= curBar + 3; b++) {
        const prev = state.bars.get(b);
        if (b === curBar && prev) {
          const kept = prev.notes.filter(n => n.onsetStep < minSafe);
          const fresh = buildBar(b, { flash });
          fresh.notes = [...kept, ...fresh.notes.filter(n => n.onsetStep >= minSafe)];
          fresh.flashMs = flash ? performance.now() : 0;
          state.bars.set(b, fresh);
        } else buildBar(b, { flash });
      }
      updateHudReadout();
    }

    function toggleEchoLock(targetBarIdx = null) {
      const curBar = Math.floor(state.nowStep / 16);
      if (targetBarIdx === null) {
        if (state.echoLock) { state.echoLock = null; playDetent(0.5); revoiceFuture(true); return; }
        targetBarIdx = Math.max(0, curBar - 1);
      } else if (state.echoLock && state.echoLock.sourceBarIdx === targetBarIdx) {
        state.echoLock = null; playDetent(0.5); revoiceFuture(true); return;
      }
      const src = state.bars.get(targetBarIdx) || state.bars.get(curBar);
      if (!src) return;
      state.echoLock = {
        sourceBarIdx: src.barIdx, tokens: src.tokens,
        lanes: src.notes.map(n => n.lane), baseY: src.ySnap, lockedAtMs: performance.now()
      };
      playDetent(0.95);
      revoiceFuture(true);
    }

    // ==================== 4. SCHEDULER & CHLADNI EIGENMODE EXCITATION ====================
    function excitePortal(lane, vel, durSteps, isHuman = false) {
      const pt = portals[lane]; if (!pt) return;
      const dNorm = clamp(durSteps / 8, 0.14, 1.0);
      pt.durTau = 0.24 + dNorm * 1.45;
      pt.e0 = Math.min(1.25, pt.e0 * 0.3 + 0.55 + vel * 0.52);
      pt.e2 = Math.min(1.20, pt.e2 * 0.25 + 0.45 + vel * 0.58);
      pt.e3 = Math.min(1.10, pt.e3 * 0.2 + 0.32 + vel * 0.52);
      pt.flash = isHuman ? 1.15 : 0.95;
      pt.rot += isHuman ? 0.42 : 0.28;
      pt.ripples.push({ r: geo.portalR * (lane === 0 ? 1.18 : 1.0), alpha: 0.72 * vel, maxR: geo.portalR + 20 + durSteps * 4.2 });
      if (pt.ripples.length > 4) pt.ripples.shift();
      if (durSteps >= 4) state.pendulumBreath = Math.min(1.0, state.pendulumBreath + 0.36 + durSteps * 0.05);
    }

    function directStrike(lane, vel = 0.86) {
      ensureAudio();
      const dur = state.puckX < 0.3 ? 6 : state.puckX < 0.65 ? 4 : 2;
      playHandpan(lane, audioCtx.currentTime, vel, dur);
      excitePortal(lane, vel, dur, true);
      state.humanNotes.push({ onsetStep: state.nowStep, dur, lane, vel, human: true, sync: 0 });
    }

    function schedulerTick() {
      if (!state.playing || !audioCtx) return;
      while (state.nextSchedTime < audioCtx.currentTime + 0.11) {
        const step = state.nextSchedStep, bar = state.bars.get(Math.floor(step / 16));
        if (bar) {
          const stepInBar = step % 16;
          for (const n of bar.notes) {
            if (n.stepInBar === stepInBar && !n.scheduled) {
              n.scheduled = true;
              playHandpan(n.lane, state.nextSchedTime, n.vel, n.dur);
              const delayMs = Math.max(0, (state.nextSchedTime - audioCtx.currentTime) * 1000);
              setTimeout(() => { if (state.playing) excitePortal(n.lane, n.vel, n.dur, false); }, delayMs);
            }
          }
        }
        state.nextSchedStep++; state.nextSchedTime += STEP_SEC;
      }
    }

    function setPlaying(on) {
      ensureAudio(); state.playing = on;
      if (on) {
        state.nextSchedStep = Math.ceil(state.nowStep);
        state.nextSchedTime = audioCtx.currentTime + (state.nextSchedStep - state.nowStep) * STEP_SEC;
      }
      updateHudReadout();
    }
    setInterval(schedulerTick, 25);

    // ==================== 5. LAYOUT & HUD ====================
    const canvas = document.getElementById('stage'), ctx = canvas.getContext('2d');
    const readoutEl = document.getElementById('status-readout');
    const btnPlay = document.getElementById('btn-play'), btnLock = document.getElementById('btn-lock');
    let W = window.innerWidth, H = window.innerHeight, DPR = 1;
    const geo = {
      nowY: 360, stepPx: 12, fieldLeft: 180, fieldRight: 720,
      portalX: [], portalR: 13, blockW: 11, rulerX: 110, rightSpineX: 750,
      puckBox: { x: 0, y: 0, w: 176, h: 124 }
    };

    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
      geo.nowY = Math.round(H * 0.50);
      geo.stepPx = clamp((H * 0.445) / 32, 7.5, 18); // 2 full quantized Future bars (32 sixteenths)

      const pw = clamp(Math.round(W * 0.155), 144, 192), ph = clamp(Math.round(H * 0.165), 110, 136);
      geo.puckBox = { x: Math.round(W - pw - 20), y: Math.round(H - ph - 24), w: pw, h: ph };

      const fieldW = clamp(W * 0.44, 240, 540);
      const centerX = W * 0.44;
      geo.fieldLeft = Math.round(Math.max(112, centerX - fieldW * 0.5));
      geo.fieldRight = Math.round(Math.min(geo.puckBox.x - 148, geo.fieldLeft + fieldW));
      if (geo.fieldRight - geo.fieldLeft < 220) geo.fieldRight = geo.fieldLeft + 220;
      const sp = (geo.fieldRight - geo.fieldLeft) / 8;
      geo.portalX = Array.from({ length: 9 }, (_, i) => geo.fieldLeft + sp * i);
      geo.portalR = clamp(Math.round(sp * 0.24), 10, 15);
      geo.blockW = clamp(Math.round(sp * 0.22), 8, 13);
      geo.rulerX = Math.max(54, geo.fieldLeft - clamp(W * 0.045, 28, 60));
      geo.rightSpineX = geo.fieldRight + clamp(W * 0.03, 22, 40);
    }

    function updateHudReadout() {
      const reg = regimeForX(state.puckX);
      const barNum = String(Math.floor(state.nowStep / 16) + 1).padStart(2, '0');
      const beatNum = Math.floor((state.nowStep % 16) / 4) + 1;
      readoutEl.textContent = `${reg.name} · ${barNum}.${beatNum} · ${BPM} BPM`;
      btnPlay.textContent = state.playing ? 'PAUSE' : 'PLAY';
      btnPlay.classList.toggle('on', state.playing);
      btnLock.textContent = state.echoLock ? `ECHO ● B${String(state.echoLock.sourceBarIdx + 1).padStart(2, '0')}` : 'ECHO ○';
      btnLock.classList.toggle('on', Boolean(state.echoLock));
    }

    // ==================== 6. DISCRETE PORTAL & PHASE-WAVE RENDERER ====================
    const stepToY = (s) => geo.nowY + (s - state.nowStep) * geo.stepPx;
    const mixSig = (sig, a) => {
      const t = clamp(sig, 0, 1);
      return `rgba(255,${Math.round(lerp(255, 90, t))},${Math.round(lerp(255, 31, t))},${clamp(a, 0, 1).toFixed(3)})`;
    };

    function drawPolarRing(cx, cy, rBase, a2, a3, rot) {
      ctx.beginPath();
      for (let k = 0; k <= 48; k++) {
        const th = (k / 48) * Math.PI * 2;
        const r = rBase + a2 * Math.cos(2 * (th - rot)) + a3 * Math.cos(3 * (th + rot * 0.7));
        const vx = cx + Math.cos(th) * r, vy = cy + Math.sin(th) * r;
        k === 0 ? ctx.moveTo(vx, vy) : ctx.lineTo(vx, vy);
      }
      ctx.closePath(); ctx.stroke();
    }

    function drawLeftMetricRuler() {
      const minS = Math.floor(state.nowStep - geo.nowY / geo.stepPx - 2);
      const maxS = Math.ceil(state.nowStep + (H - geo.nowY) / geo.stepPx + 2), rx = geo.rulerX;
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(rx, 42); ctx.lineTo(rx, H - 18); ctx.stroke();

      ctx.font = '10px ui-monospace, Menlo, monospace'; ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillText('PAST ↑', 16, 56); ctx.fillText('FUTURE ↓', 16, H - 22);
      ctx.fillStyle = 'rgba(255,255,255,0.58)'; ctx.fillText('NOW', 16, geo.nowY + 3);

      const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
      for (let s = Math.max(0, minS); s <= maxS; s++) {
        const y = stepToY(s); if (y < 40 || y > H - 14) continue;
        const w = metricWeight(s), near = Math.exp(-Math.abs(y - geo.nowY) / 70);
        if (w === 4) {
          ctx.strokeStyle = `rgba(255,255,255,${(0.45 + near * 0.45).toFixed(2)})`; ctx.lineWidth = 1.25; line(rx - 26, y, rx + 6, y);
          ctx.strokeStyle = `rgba(255,255,255,${s < state.nowStep ? 0.075 : 0.055})`; ctx.lineWidth = 1; line(geo.fieldLeft - 18, y, geo.fieldRight + 18, y);
          ctx.fillStyle = `rgba(255,255,255,${(0.38 + near * 0.45).toFixed(2)})`; ctx.textAlign = 'right';
          ctx.fillText(String(Math.floor(s / 16) + 1).padStart(2, '0'), rx - 32, y + 3);
        } else if (w === 3) {
          ctx.strokeStyle = `rgba(255,255,255,${(0.28 + near * 0.28).toFixed(2)})`; ctx.lineWidth = 1; line(rx - 16, y, rx + 3, y);
          ctx.strokeStyle = 'rgba(255,255,255,0.026)'; line(geo.fieldLeft - 10, y, geo.fieldRight + 10, y);
        } else if (w === 2) {
          ctx.strokeStyle = `rgba(255,255,255,${(0.18 + near * 0.18).toFixed(2)})`; ctx.lineWidth = 1; line(rx - 9, y, rx, y);
        } else if (w === 1) {
          ctx.strokeStyle = 'rgba(255,255,255,0.12)'; line(rx - 4, y, rx, y);
        } else {
          ctx.fillStyle = 'rgba(255,255,255,0.13)'; ctx.fillRect(rx - 2, y - 0.5, 1.5, 1.5);
        }
      }
    }

    function drawAttentionArcs(nowMs) {
      const curBar = Math.floor(state.nowStep / 16), ax = geo.fieldLeft - 20;
      for (let b = curBar; b <= curBar + 2; b++) {
        const dst = state.bars.get(b); if (!dst) continue;
        const yD = stepToY(dst.startStep + 4); if (yD > H + 30) continue;
        for (const link of dst.links) {
          const src = state.bars.get(link.fromBar); if (!src) continue;
          const yS = clamp(stepToY(src.startStep + 4), 46, geo.nowY - 12); if (yS >= yD - 10) continue;
          const bulge = 18 + Math.min(4, Math.max(1, dst.barIdx - src.barIdx)) * 17, isLock = link.kind === 'lock';
          const pulse = isLock && state.echoLock ? clamp(1 - (nowMs - state.echoLock.lockedAtMs) / 420, 0, 1) : 0;
          ctx.save();
          ctx.strokeStyle = isLock ? mixSig(pulse, 0.58) : `rgba(255,255,255,${(link.weight * 0.42).toFixed(3)})`;
          ctx.lineWidth = isLock ? 1.4 : 1; if (!isLock) ctx.setLineDash([3, 4]);
          ctx.beginPath(); ctx.moveTo(ax, yS);
          ctx.bezierCurveTo(ax - bulge, yS + (yD - yS) * 0.26, ax - bulge, yD - (yD - yS) * 0.26, ax, yD);
          ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = isLock ? mixSig(pulse, 0.92) : 'rgba(255,255,255,0.34)';
          const r = isLock ? 2.4 : 1.6;
          ctx.beginPath(); ctx.arc(ax, yS, r, 0, Math.PI * 2); ctx.arc(ax, yD, r, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
      }
    }

    // Discrete Impact Node + Quantized Phase-Ticked Decaying Duration Tail floating in pure black void
    function drawPhaseBlock(n, nowMs, isLockedBar) {
      const cx = geo.portalX[n.lane], yHead = stepToY(n.onsetStep), yTail = stepToY(n.onsetStep + n.dur);
      if (yTail < 36 || yHead > H - 10) return;
      const diff = n.flashMs ? clamp(1 - (nowMs - n.flashMs) / 400, 0, 1) : 0;
      const durSteps = Math.max(1, n.dur);

      for (let k = 0; k < durSteps; k++) {
        const sTop = stepToY(n.onsetStep + k), sBot = stepToY(n.onsetStep + k + 1) - 1.6;
        const sH = Math.max(2.5, sBot - sTop);
        if (sBot < 36 || sTop > H - 10) continue;
        const frac = durSteps > 1 ? k / (durSteps - 1) : 0;
        const decay = Math.pow(1 - frac * 0.68, 1.15);
        const w = geo.blockW * lerp(1.0, 0.56, frac), x0 = cx - w * 0.5;
        if ((sTop + sBot) * 0.5 < geo.nowY) {
          const age = clamp(1 - (geo.nowY - sBot) / (geo.nowY * 1.15), 0.18, 1.0);
          ctx.fillStyle = `rgba(255,255,255,${clamp(age * decay * (isLockedBar ? 1.0 : 0.72 + n.vel * 0.28), 0.08, 1).toFixed(3)})`;
          ctx.fillRect(x0, sTop, w, sH);
        } else {
          const dist = clamp(1 - (sTop - geo.nowY) / (H - geo.nowY + 40), 0.22, 1.0);
          ctx.fillStyle = mixSig(diff, (0.05 + dist * 0.09) * decay + diff * 0.14);
          ctx.fillRect(x0, sTop, w, sH);
          ctx.strokeStyle = mixSig(diff, (0.28 + dist * 0.44) * decay + diff * 0.30);
          ctx.lineWidth = diff > 0.05 ? 1.25 : 0.9;
          ctx.strokeRect(x0 + 0.5, sTop + 0.5, Math.max(1, w - 1), Math.max(1, sH - 1));
        }
      }

      if (yHead >= 38 && yHead <= H - 12) {
        const isPast = yHead < geo.nowY;
        const fade = isPast ? clamp(1 - (geo.nowY - yHead) / (geo.nowY * 1.15), 0.26, 1) : clamp(1 - (yHead - geo.nowY) / (H - geo.nowY + 40), 0.35, 1);
        const r = (n.lane === 0 ? 3.8 : 3.0) + (n.dur >= 6 ? 0.8 : 0);
        ctx.beginPath(); ctx.arc(cx, yHead + 1, r, 0, Math.PI * 2);
        if (isPast) {
          ctx.fillStyle = `rgba(255,255,255,${clamp(fade * 1.05, 0.28, 1).toFixed(3)})`; ctx.fill();
          if (n.human) {
            ctx.strokeStyle = `rgba(255,255,255,${(fade * 0.85).toFixed(2)})`; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(cx, yHead + 1, r + 3, 0, Math.PI * 2); ctx.stroke();
          }
        } else {
          ctx.fillStyle = '#000'; ctx.fill();
          ctx.strokeStyle = mixSig(diff, 0.72 + fade * 0.28); ctx.lineWidth = 1.35; ctx.stroke();
        }
      }

      if (n.sync > 0 && yHead >= geo.nowY - 4) {
        const cross = Math.ceil((n.onsetStep + 0.01) / 4) * 4;
        if (cross > n.onsetStep && cross < n.onsetStep + n.dur) {
          const cy = stepToY(cross);
          ctx.fillStyle = mixSig(diff, 0.9);
          ctx.beginPath(); ctx.moveTo(cx, cy - 3.2); ctx.lineTo(cx + 3.2, cy);
          ctx.lineTo(cx, cy + 3.2); ctx.lineTo(cx - 3.2, cy); ctx.closePath(); ctx.fill();
        }
      }
    }

    function drawNotes(nowMs) {
      for (const bar of state.bars.values()) {
        const locked = state.echoLock && state.echoLock.sourceBarIdx === bar.barIdx;
        for (const n of bar.notes) drawPhaseBlock(n, nowMs, locked);
      }
      for (const hn of state.humanNotes) drawPhaseBlock(hn, nowMs, false);
    }

    // Horizontal Metric Wave Pendulum + 9 Discrete Circular Chladni Resonator Portals at NOW
    function drawNowWaveAndPortals() {
      const y = geo.nowY, midX = (geo.fieldLeft + geo.fieldRight) * 0.5, halfSpan = (geo.fieldRight - geo.fieldLeft) * 0.5;
      const barFrac = (((state.nowStep % 16) + 16) % 16) / 16, phase = barFrac * Math.PI * 2;
      const px = midX - Math.cos(phase) * halfSpan, apex = state.pendulumApexGlow;
      const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
      const circ = (cx, cy, r, fill = false) => { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); fill ? ctx.fill() : ctx.stroke(); };

      // Segmented NOW horizon threading only open void between the 9 portals
      ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = 1;
      let curX = geo.fieldLeft - 28;
      for (let i = 0; i < 9; i++) {
        const r = geo.portalR * (i === 0 ? 1.18 : 1.0) + 4, xL = geo.portalX[i] - r;
        if (xL > curX) line(curX, y, xL, y);
        curX = geo.portalX[i] + r;
      }
      line(curX, y, geo.fieldRight + 28, y);

      // Metric Wave Pendulum: serene localized breathing wave gliding along NOW
      const wAmp = 4.5 + state.pendulumBreath * 9.5 + apex * 5.0, wSig = 48 + state.pendulumBreath * 34;
      ctx.strokeStyle = mixSig(apex, 0.34 + state.pendulumBreath * 0.34 + apex * 0.32); ctx.lineWidth = 1.25;
      ctx.beginPath();
      for (let x = geo.fieldLeft - 24; x <= geo.fieldRight + 24; x += 3) {
        const dx = x - px, wy = y + Math.sin(dx * 0.085 - phase * 2) * wAmp * Math.exp(-(dx * dx) / (2 * wSig * wSig));
        x === geo.fieldLeft - 24 ? ctx.moveTo(x, wy) : ctx.lineTo(x, wy);
      }
      ctx.stroke();

      ctx.strokeStyle = mixSig(barFrac < 0.25 || barFrac > 0.75 ? apex : 0, 0.38); line(geo.fieldLeft - 24, y - 6, geo.fieldLeft - 24, y + 6);
      ctx.strokeStyle = mixSig(barFrac >= 0.25 && barFrac <= 0.75 ? apex : 0, 0.38); line(geo.fieldRight + 24, y - 6, geo.fieldRight + 24, y + 6);
      ctx.strokeStyle = mixSig(apex, 0.24 + state.pendulumBreath * 0.34 + apex * 0.38); ctx.lineWidth = 1;
      circ(px, y, 8 + state.pendulumBreath * 10 + apex * 4);
      ctx.fillStyle = mixSig(apex, 1.0); circ(px, y, 3.0 + state.pendulumBreath, true);

      // 9 Discrete Circular Resonator Portals (D3 ^1 .. A4 ^5) with Chladni Eigenmodes
      for (let i = 0; i < 9; i++) {
        const pt = portals[i], cx = geo.portalX[i], baseR = geo.portalR * (i === 0 ? 1.18 : 1.0), hov = state.hoverPortal === i;
        for (const rp of pt.ripples) { ctx.strokeStyle = `rgba(255,255,255,${clamp(rp.alpha, 0, 1).toFixed(3)})`; ctx.lineWidth = 0.9; circ(cx, y, rp.r); }
        ctx.fillStyle = '#000'; circ(cx, y, baseR, true);
        if (pt.e0 + pt.e2 + pt.e3 > 0.025) {
          const br = pt.e0 * 2.8 * Math.sin(pt.p0), a2 = pt.e2 * 3.4 * Math.sin(pt.p2), a3 = pt.e3 * 2.4 * Math.sin(pt.p3);
          ctx.strokeStyle = `rgba(255,255,255,${clamp(0.45 + pt.e0 * 0.55, 0, 1).toFixed(3)})`;
          ctx.lineWidth = 1.25 + clamp(pt.flash, 0, 1) * 0.65; drawPolarRing(cx, y, baseR + br, a2, a3, pt.rot);
          if (pt.e2 + pt.e3 > 0.06) {
            ctx.strokeStyle = `rgba(255,255,255,${clamp((pt.e2 + pt.e3) * 0.34, 0, 0.55).toFixed(3)})`;
            ctx.lineWidth = 0.85; drawPolarRing(cx, y, baseR * 0.64, -a2 * 0.55, a3 * 0.65, pt.rot);
          }
        } else {
          ctx.strokeStyle = hov ? 'rgba(255,255,255,0.68)' : 'rgba(255,255,255,0.24)'; ctx.lineWidth = hov ? 1.3 : 1; circ(cx, y, baseR);
        }
        ctx.fillStyle = `rgba(255,255,255,${(0.20 + clamp(pt.flash, 0, 1) * 0.80).toFixed(2)})`;
        circ(cx, y, 1.4 + clamp(pt.e0, 0, 1) * 1.4, true);
        const lit = clamp(pt.flash + (hov ? 0.5 : 0), 0, 1);
        ctx.font = '9px ui-monospace, Menlo, monospace'; ctx.textAlign = 'center';
        ctx.fillStyle = `rgba(255,255,255,${(0.32 + lit * 0.68).toFixed(2)})`; ctx.fillText(pt.name, cx, y - baseR - 6);
        ctx.fillStyle = `rgba(255,255,255,${(0.18 + lit * 0.52).toFixed(2)})`; ctx.fillText(pt.deg, cx, y + baseR + 12);
      }
    }

    function drawRightPartitionBrackets(nowMs) {
      const bx = geo.rightSpineX; ctx.font = '10px ui-monospace, Menlo, monospace'; ctx.textAlign = 'left';
      for (const bar of state.bars.values()) {
        const y0 = stepToY(bar.startStep), y1 = stepToY(bar.startStep + 16);
        if (y1 < 42 || y0 > H - 10) continue;
        const yTop = Math.max(42, y0), yBot = Math.min(H - 12, y1 - 2); if (yBot - yTop < 12) continue;
        const isFut = bar.startStep + 16 > state.nowStep, isLock = state.echoLock && state.echoLock.sourceBarIdx === bar.barIdx;
        const diff = bar.flashMs ? clamp(1 - (nowMs - bar.flashMs) / 400, 0, 1) : 0;
        ctx.strokeStyle = mixSig(diff, isLock ? 0.92 : isFut ? 0.54 : 0.36); ctx.lineWidth = isLock ? 1.5 : 1;
        ctx.beginPath(); ctx.moveTo(bx, yTop); ctx.lineTo(bx + 7, yTop); ctx.lineTo(bx + 7, yBot); ctx.lineTo(bx, yBot); ctx.stroke();
        for (const ev of bar.events) {
          const ey0 = stepToY(bar.startStep + ev.stepInBar), ey1 = stepToY(bar.startStep + ev.stepInBar + ev.dur) - 1.5;
          if (ey1 < 44 || ey0 > H - 14) continue;
          const cy0 = Math.max(44, ey0), cy1 = Math.min(H - 14, ey1);
          ctx.strokeStyle = ev.rest ? 'rgba(255,255,255,0.12)' : mixSig(diff, isFut ? 0.44 : 0.28); ctx.lineWidth = ev.rest ? 0.8 : 1;
          ctx.beginPath(); ctx.moveTo(bx + 7, cy0);
          ctx.quadraticCurveTo(bx + 7 + (ev.rest ? 2 : Math.min(11, 3 + ev.dur * 1.15)), (cy0 + cy1) * 0.5, bx + 7, cy1); ctx.stroke();
        }
        const midY = (yTop + yBot) * 0.5;
        if (midY > 52 && midY < H - 16) {
          ctx.fillStyle = mixSig(diff, isLock ? 1.0 : isFut ? 0.78 : 0.48); ctx.fillText(bar.label, bx + 20, midY - 2);
          ctx.fillStyle = mixSig(diff, isLock ? 0.72 : 0.28); ctx.fillText(`${bar.chordKey} · S:${bar.syncScore}${isLock ? ' · LOCK' : ''}`, bx + 20, midY + 11);
        }
      }
    }

    function drawEssencePuck() {
      const b = geo.puckBox, sig = state.puckSignal, px = b.x + state.puckX * b.w, py = b.y + (1 - state.puckY) * b.h;
      ctx.fillStyle = 'rgba(0,0,0,0.84)'; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = mixSig(sig, 0.16 + sig * 0.45); ctx.lineWidth = 1; ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.beginPath();
      for (const tx of [0.25, 0.55, 0.80]) { ctx.moveTo(b.x + tx * b.w, b.y + 1); ctx.lineTo(b.x + tx * b.w, b.y + b.h - 1); }
      ctx.moveTo(b.x + 1, b.y + b.h * 0.5); ctx.lineTo(b.x + b.w - 1, b.y + b.h * 0.5); ctx.stroke();
      ctx.strokeStyle = mixSig(sig, 0.22 + sig * 0.48); ctx.beginPath();
      ctx.moveTo(px, b.y + 1); ctx.lineTo(px, b.y + b.h - 1); ctx.moveTo(b.x + 1, py); ctx.lineTo(b.x + b.w - 1, py); ctx.stroke();
      ctx.font = '9px ui-monospace, Menlo, monospace'; ctx.fillStyle = 'rgba(255,255,255,0.38)'; ctx.textAlign = 'center';
      ctx.fillText('LIFT ↑', b.x + b.w * 0.5, b.y - 6); ctx.fillText('RESOLVE ↓', b.x + b.w * 0.5, b.y + b.h + 12);
      ctx.textAlign = 'left'; ctx.fillText('BREATH', b.x + 6, b.y + b.h - 6);
      ctx.fillStyle = mixSig(sig, 0.65); ctx.fillText(regimeForX(state.puckX).name, b.x + 6, b.y + 12);
      ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,0.38)'; ctx.fillText('SYNCOPATE', b.x + b.w - 6, b.y + b.h - 6);
      const g = ctx.createRadialGradient(px, py, 2, px, py, 22 + sig * 8);
      g.addColorStop(0, mixSig(sig, 0.36 + sig * 0.28)); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, 22 + sig * 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = mixSig(sig, 0.92); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(px, py, 8.5, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = mixSig(sig, 1.0); ctx.beginPath(); ctx.arc(px, py, 3.2, 0, Math.PI * 2); ctx.fill();
    }

    // ==================== 7. ANIMATION LOOP ====================
    let lastFrameMs = performance.now();
    function frame(nowMs) {
      const dt = Math.min(0.05, (nowMs - lastFrameMs) / 1000); lastFrameMs = nowMs;

      if (state.playing && audioCtx) {
        state.nowStep += dt / STEP_SEC;
        const halfBeat = Math.floor(state.nowStep / 8);
        if (halfBeat !== state.lastStepApex) {
          state.lastStepApex = halfBeat;
          const down = halfBeat % 2 === 0;
          state.pendulumApexGlow = down ? 1.0 : 0.72;
          state.pendulumBreath = Math.min(1.0, state.pendulumBreath + (down ? 0.55 : 0.30));
          updateHudReadout();
        }
        ensureTimeline();
      }

      state.pendulumApexGlow *= Math.exp(-5.4 * dt);
      state.pendulumBreath *= Math.exp(-3.6 * dt);
      if (!state.draggingPuck) state.puckSignal *= Math.exp(-6.2 * dt);

      for (const pt of portals) {
        const w0 = 14 + pt.idx * 2.2;
        pt.p0 += dt * w0; pt.p2 += dt * w0 * 2.001; pt.p3 += dt * w0 * 2.999;
        pt.e0 *= Math.exp(-dt / Math.max(0.18, pt.durTau));
        pt.e2 *= Math.exp(-dt / Math.max(0.12, pt.durTau * 0.62));
        pt.e3 *= Math.exp(-dt / Math.max(0.09, pt.durTau * 0.38));
        pt.flash *= Math.exp(-5.0 * dt);
        for (let i = pt.ripples.length - 1; i >= 0; i--) {
          const rp = pt.ripples[i]; rp.r += dt * (46 + pt.durTau * 14); rp.alpha *= Math.exp(-3.2 * dt);
          if (rp.r >= rp.maxR || rp.alpha < 0.015) pt.ripples.splice(i, 1);
        }
      }

      ctx.save(); ctx.scale(DPR, DPR);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      drawLeftMetricRuler(); drawAttentionArcs(nowMs); drawNotes(nowMs);
      drawNowWaveAndPortals(); drawRightPartitionBrackets(nowMs); drawEssencePuck();
      ctx.restore();
      requestAnimationFrame(frame);
    }

    // ==================== 8. INTERACTION: PUCK, PORTAL DIRECT PLAY, ECHO PIN ====================
    function setPuck(nx, ny, ignite = true) {
      state.puckX = clamp(nx, 0, 1); state.puckY = clamp(ny, 0, 1);
      if (ignite) state.puckSignal = 1.0;
      const key = `${Math.floor(state.puckX * 20)}:${Math.floor(state.puckY * 6)}`;
      if (key !== state.lastDetentKey) { state.lastDetentKey = key; playDetent(0.55); revoiceFuture(true); }
    }
    const hitPuckBox = (x, y) => { const b = geo.puckBox; return x >= b.x - 14 && x <= b.x + b.w + 14 && y >= b.y - 14 && y <= b.y + b.h + 14; };
    const hitPortal = (x, y) => geo.portalX.findIndex((px, i) => Math.hypot(x - px, y - geo.nowY) <= geo.portalR * (i === 0 ? 1.18 : 1.0) + 14);
    const updatePuckPtr = (x, y) => setPuck((x - geo.puckBox.x) / geo.puckBox.w, 1 - (y - geo.puckBox.y) / geo.puckBox.h, true);

    canvas.addEventListener('pointerdown', (e) => {
      const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      ensureAudio();
      if (hitPuckBox(x, y)) { state.draggingPuck = true; canvas.setPointerCapture(e.pointerId); updatePuckPtr(x, y); return; }
      const pi = hitPortal(x, y); if (pi >= 0) { directStrike(pi, 0.88); return; }
      if (y < geo.nowY - geo.portalR - 14 && x >= geo.fieldLeft - 24) {
        const barIdx = Math.floor((state.nowStep + (y - geo.nowY) / geo.stepPx) / 16);
        if (state.bars.has(barIdx)) { toggleEchoLock(barIdx); return; }
      }
      if (x >= geo.fieldLeft - 24 && x <= geo.fieldRight + 24) {
        let best = 0, bestD = 1e9;
        geo.portalX.forEach((px, i) => { const d = Math.abs(x - px); if (d < bestD) { bestD = d; best = i; } });
        directStrike(best, 0.82);
      }
    });
    canvas.addEventListener('pointermove', (e) => {
      const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      if (state.draggingPuck) { updatePuckPtr(x, y); return; }
      state.hoverPortal = hitPortal(x, y);
      canvas.style.cursor = hitPuckBox(x, y) ? 'grab'
        : (state.hoverPortal >= 0 || (y < geo.nowY - geo.portalR - 14 && x >= geo.fieldLeft - 24)) ? 'pointer' : 'default';
    });
    ['pointerup', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, () => { state.draggingPuck = false; }));
    btnPlay.addEventListener('click', () => setPlaying(!state.playing));
    btnLock.addEventListener('click', () => { ensureAudio(); toggleEchoLock(null); });
    window.addEventListener('keydown', (e) => {
      const k = e.key;
      if (e.repeat && (e.code === 'Space' || k === 'l' || k === 'L')) return;
      if (e.code === 'Space') { e.preventDefault(); setPlaying(!state.playing); }
      else if (k === 'l' || k === 'L') { e.preventDefault(); ensureAudio(); toggleEchoLock(null); }
      else if (k >= '1' && k <= '9') directStrike(parseInt(k, 10) - 1, 0.88);
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); ensureAudio(); setPuck(state.puckX + 0.055, state.puckY); }
      else if (k === 'ArrowLeft'  || k === 'a' || k === 'A') { e.preventDefault(); ensureAudio(); setPuck(state.puckX - 0.055, state.puckY); }
      else if (k === 'ArrowUp'    || k === 'w' || k === 'W') { e.preventDefault(); ensureAudio(); setPuck(state.puckX, state.puckY + 0.08); }
      else if (k === 'ArrowDown'  || k === 's' || k === 'S') { e.preventDefault(); ensureAudio(); setPuck(state.puckX, state.puckY - 0.08); }
    });

    window.addEventListener('resize', resize);
    resize(); ensureTimeline(); updateHudReadout(); requestAnimationFrame(frame);
  </script>
</body>
